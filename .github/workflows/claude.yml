name: Claude

# Mention @claude in an issue, an issue comment, a pull request review or a
# review comment and Claude works on it: it reads CLAUDE.md and AGENTS.md,
# works on a branch, and opens or updates a pull request. It never deploys:
# only a push to main does that, and merging stays with the owner.
#
# Setup (once): add a repository secret named ANTHROPIC_API_KEY, or run
# /install-github-app from Claude Code, which installs the Claude GitHub app
# and sets the secret. Without the secret this workflow simply fails.
#
# The repository is public, so only the owner, members and collaborators can
# trigger it: anyone else's @claude is ignored rather than spending credits.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The pipeline is standard-library Python 3.12, the same as deploy.yml,
      # so Claude can run nametest.py and a fast build to check its work.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
