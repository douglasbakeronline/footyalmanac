name: Office merge window

# Once a day, merge office-agent pull requests that pass every gate in
# agents/merge_gate.py, which fails closed: required checks green on the
# current head SHA, evaluation evidence from the verified run, confirmed
# mergeability, no non-bot drift on main, an evaluation pass for model and
# calibration changes, and owner approval only for workflow/security paths
# (no owner review otherwise, Douglas 4 Oct 2026). The office sprint merges
# as it goes; this window catches leftovers. Labels are never evidence. Then
# tag and redeploy. Decisions are logged on each pull request.
on:
  schedule:
    - cron: "0 3,9,15,21 * * *"   # 9 Nov 2026: four windows for four sprints   # 10:00, 16:00, 22:00 BST: picks up other AI platforms' pull requests
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

concurrency:
  group: office-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 5 Nov 2026 (Douglas): the gate refuses an agent pull request once a
      # human commit lands on main after its evaluation, and nothing re-ran
      # them, so six piled up and the sprint stopped from 1 to 5 Nov. Before
      # the gate, every open office-agent pull request that is behind main is
      # rebased onto it and pushed with the App token, so its checks and
      # evaluation run again. A branch that does not rebase cleanly is left
      # alone with a comment. The gate still decides every merge.
      - name: Normalise the App key
        if: secrets.OFFICE_APP_ID != ''
        env:
          RAW: ${{ secrets.OFFICE_APP_KEY }}
        run: |
          python3 - <<'PY'
          import os, re, textwrap
          raw = os.environ["RAW"].replace("\\n", "\n").replace("\r", "").strip().strip('"')
          m = re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----", raw, re.S)
          kind, body = (m.group(1), m.group(2)) if m else ("RSA PRIVATE KEY", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          pem = f"-----BEGIN {kind}-----\n" + "\n".join(textwrap.wrap(body, 64)) + f"\n-----END {kind}-----"
          for line in textwrap.wrap(body, 64): print(f"::add-mask::{line}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("APP_KEY<<__PEM__\n" + pem + "\n__PEM__\n")
          PY
      - name: Mint the App token
        id: app
        if: secrets.OFFICE_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.OFFICE_APP_ID }}
          private-key: ${{ env.APP_KEY }}
      - name: Rebase stale agent pull requests
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 agents/rebase_stale.py
      - run: python3 agents/merge_gate.py
