name: Office merge window

# Once a day, merge office-agent pull requests that pass every gate in
# agents/merge_gate.py, which fails closed: required checks green on the
# current head SHA, evaluation evidence from the verified run, confirmed
# mergeability, no non-bot drift on main, an evaluation pass for model and
# calibration changes, and owner approval only for workflow/security paths
# (no owner review otherwise, Douglas 4 Oct 2026). The office sprint merges
# as it goes; this window catches leftovers. Labels are never evidence. Then
# tag and redeploy. Decisions are logged on each pull request.
on:
  schedule:
    - cron: "0 21 * * *"   # 22:00 BST / 21:00 GMT
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

concurrency:
  group: office-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 agents/merge_gate.py
