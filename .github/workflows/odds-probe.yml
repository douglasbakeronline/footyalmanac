name: Odds source probe

# 25 Oct 2026. Tests free price sources from CI (the cloud session cannot
# reach them) and commits the report to the odds-probe-report branch, so the
# integration can be written against what each source really returns. The
# report holds counts and field names only, never prices, keys or account
# details (this repo is public). Runs on a push to odds-probe-run or by hand.
on:
  workflow_dispatch:
  push:
    branches: [odds-probe-run]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 tools/odds_match_probe.py
      - name: Commit the report to odds-probe-report
        run: |
          git config user.name "footyalmanac-bot"
          git config user.email "actions@users.noreply.github.com"
          cp probe/match-probe.json /tmp/match-probe.json
          git fetch origin odds-probe-report || true
          git checkout -B odds-probe-report
          git rm -rq --cached . >/dev/null 2>&1 || true
          mkdir -p probe && cp /tmp/match-probe.json probe/match-probe.json
          git add -f probe/match-probe.json
          git commit -qm "Odds probe report $(date -u +%FT%TZ)"
          git push -f origin odds-probe-report
