name: Weekly retune

# The daily job grades the model. This one asks whether the model's own
# constants are still the right ones, and refits the calibration curve when the
# evidence says so.
#
# Weekly, not daily, on purpose. The fit is made on the last completed season,
# which does not change between Mondays, and the check season only gains a few
# hundred fixtures a month. Running it nightly would just be a slower way of
# getting the same answer, and would tempt whoever reads it into treating
# week-to-week wobble as signal.
on:
  schedule:
    - cron: "40 4 * * 1"     # Mondays, 04:40 UTC, ahead of the daily build
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tune
  cancel-in-progress: false

jobs:
  tune:
    runs-on: ubuntu-latest
    env:
      # API-Football (sources.AF), the paid source for step 3; absent means
      # those leagues are logged as missing, never guessed.
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The API-Football day pool and finished seasons (sources._af_day,
      # _af_season), shared with the daily build: without it this run refills
      # the year, ~290 calls every Monday (Douglas approved, 6 Oct 2026).
      - uses: actions/cache@v4
        with:
          path: .afcache
          key: afcache-${{ github.run_id }}
          restore-keys: afcache-

      # Refit the calibration curve on the last completed season and check it
      # on the current one. tune.py writes calibration.json only if the fit
      # also improves fixtures it has never seen; otherwise the file is left
      # alone and the shipped constant stays in force.
      - name: Refit calibration
        run: python3 tune.py --fit

      # The full constant sweep is advisory. It is printed into the job log for
      # a human to read and never applied automatically: a structural constant
      # that moves on its own is a model nobody can explain the next morning.
      - name: Sweep the constants (advisory)
        run: python3 tune.py --report

      # The continental coefficients are structural too, so the same rule
      # holds: printed for a human, never refitted on a schedule. Refit by
      # running `python3 eurotest.py --fit` and committing europe.json.
      - name: European ties (advisory)
        run: python3 eurotest.py --report

      # main is protected: push with the office App token (see deploy.yml)
      - name: Normalise the App key
        env:
          RAW: ${{ secrets.OFFICE_APP_KEY }}
        run: |
          python3 - <<'PY'
          import os, re, textwrap
          raw = os.environ["RAW"].replace("\\n", "\n").replace("\r", "").strip().strip('"')
          m = re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----", raw, re.S)
          kind, body = (m.group(1), m.group(2)) if m else ("RSA PRIVATE KEY", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          pem = f"-----BEGIN {kind}-----\n" + "\n".join(textwrap.wrap(body, 64)) + f"\n-----END {kind}-----"
          for line in textwrap.wrap(body, 64): print(f"::add-mask::{line}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("APP_KEY<<__PEM__\n" + pem + "\n__PEM__\n")
          PY
      - name: Mint the App token
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.OFFICE_APP_ID }}
          private-key: ${{ env.APP_KEY }}
      - name: Commit the result
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A calibration.json tuning-report.json
          git diff --staged --quiet && exit 0
          git commit -m "Weekly retune $(date +%F) [skip ci]"
          # drop checkout's workflow-token header, or it is sent instead of the App token (see deploy.yml)
          if [ -n "$APP_TOKEN" ]; then git config --local --unset-all http.https://github.com/.extraheader || true; git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"; fi
          # main moves under a long job (the daily archive, a release): on
          # 30 Sep 2026 a push landed mid-run and the refit was lost. Only this
          # job writes these two files, so rebasing onto the new main is safe.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push rejected, retrying ($attempt of 3)"
            sleep $((attempt * 5))
          done
          exit 1
