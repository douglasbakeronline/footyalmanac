name: Rebuild and publish

# Three triggers: scheduled rebuilds, pushes to main, and a manual button in the Actions tab for
# when you have edited adjustments.json and want it live now.
on:
  schedule:
    # Ten runs a day (seven until 13 Nov 2026, six until 10 Nov), timed to when results land rather than evenly spaced,
    # so the Daily List shows wins and losses within a couple of hours of a
    # game ending (Douglas, 7 Oct 2026). There is no in-play feed: a started
    # game shows as pending until the next run after its result is published.
    #
    # Cron is always UTC and does not follow British Summer Time. The UTC
    # times are chosen so each run still lands after the games it is for in
    # both summer and winter; UK time is an hour later in summer.
    #
    #   UTC     BST     GMT     catches
    #   00:10   01:10   00:10   just after API-Football's daily allowance resets
    #   05:15   06:15   05:15   the day's slate, after late South American games
    #                           (Brazil is UTC-3: a 20:00 local game runs past 23:00 UTC)
    #   07:40   08:40   07:40   the morning briefing push (notify.py, 10 Nov 2026,
    #                           Douglas bets around 8am, lunch, early evening, bedtime)
    #   12:00   13:00   12:00   Asian and Australian games, early European games
    #   17:00   18:00   17:00   UK 15:00 kick-offs and the afternoon tennis
    #   19:30   20:30   19:30   UK 17:30 kick-offs
    #   22:15   23:15   22:15   UK 19:45 / 20:00 kick-offs
    #
    # Each run costs roughly 10-25 API-Football calls (the shared date pool in
    # sources._af_day; open dates are re-fetched after 45 minutes), against a
    # 7,500 daily allowance. AI credits are not used by this workflow.
    - cron: "10 0 * * *"
    - cron: "15 5 * * *"
    - cron: "40 7 * * *"
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
    - cron: "30 19 * * *"
    - cron: "15 22 * * *"
    # 13 Nov 2026: backups for the lunch, evening and night briefings
    # (notify.py SLOTS 11:00, 16:00, 21:00 UK). GitHub runs scheduled
    # workflows late at busy times: the 12 Nov lunch push went 2h18 late and
    # the night push 1h40 (claude/briefing-lateness-2026-11-13.md), so each
    # slot gets a second, earlier queue time, off the hour. A briefing is
    # sent once a day per slot whichever build is first (briefed.json).
    - cron: "7 11 * * *"
    - cron: "7 16 * * *"
    - cron: "7 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # Agent write-ups, release notes, root notes (README, DEPLOY, AGENTS and
    # any other *.md), the evaluation harness, tests and agent scripts do not
    # change the site, and every rebuild spends API allowance. README.md is
    # copied into the site but a stale copy for a few hours costs nothing.
    paths-ignore: ["claude/**", "evaluation/**", "tests/**", "tools/**", "agents/**",
                   "RELEASES.md", "README.md", "DEPLOY.md", "AGENTS.md", "*.md"]

permissions:
  contents: write        # predictions are committed back so the record survives
  pages: write
  id-token: write

# Queue rather than cancel: on 5 Oct 2026 agent merges cancelled the daily
# build one after another. GitHub keeps one queued run, so a burst of pushes
# still costs at most one extra build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A push during an office-agent sprint is held: the sprint's publish job
  # rebuilds once at the end if anything merged. On 5 Oct 2026 one sprint's
  # merges started a build each.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=1
          if [ "${{ github.event_name }}" = "push" ]; then
            n=$(gh run list -R "${{ github.repository }}" -w office-agents.yml -L 5 --json status \
                  --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length' || echo 0)
            if [ "${n:-0}" -gt 0 ]; then echo "an office sprint is running; its publish job rebuilds once at the end"; go=0; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    env:
      # API-Football (sources.AF), the paid source for step 3; absent means
      # those leagues are logged as missing, never guessed.
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      # 30 Oct 2026: a build started by a push to main reuses the day's cached
      # API-Football fixtures and prices (up to a day old) instead of fetching
      # them again; the six scheduled builds refresh them. A merge should not
      # spend the daily allowance (25 builds on 29-30 Oct did).
      AF_FRUGAL: ${{ github.event_name == 'push' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Finished API-Football seasons (sources._af_season): fetched once and
      # kept, so a build costs about one call per league, not three.
      # Restored here and saved near the end even when a step fails (7 Oct
      # 2026: two builds failed, saved nothing, and each refetched the year).
      - uses: actions/cache/restore@v4
        with:
          path: .afcache
          key: afcache-${{ github.run_id }}
          restore-keys: afcache-

      # A club whose two spellings stop meeting is invisible: no error, no
      # flag on the page, just a fixture priced as though this season had not
      # started. Checked before the build so a bad name change stops the
      # publish rather than reaching the board.
      - name: Check the club-name matcher
        run: python3 nametest.py

      # No pip install: the whole thing runs on the standard library.
      - name: Build today's slate
        run: python3 build.py --days 7 --top 50

      # A build that returns nothing is a broken upstream, not a quiet
      # publish of an empty page. Fail loudly and keep yesterday's site.
      # The same for a build that comes back with a fraction of the slate
      # (25 Oct 2026, bug 7): a partial API-Football or ESPN day used to
      # publish a degraded site. The floor is 40% of the fixtures in the
      # most recent committed predictions/<date>.json, the same seven-day
      # window as the build (build.py --days 7); no archive, no floor.
      - name: Check the build is not empty
        run: |
          latest=$( { git ls-tree --name-only HEAD predictions/ | grep -E 'predictions/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | sort | tail -1; } || true)
          if [ -n "$latest" ]; then
            prev=$( { git show "HEAD:$latest" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))'; } || echo 0)
          else prev=0; fi
          echo "previous archive: ${latest:-none} (${prev} fixtures)"
          PREV_N="$prev" python3 - <<'PY'
          import json, os, sys
          d = json.load(open("data.json"))
          n = sum(day["count"] for day in d["days"])
          prev = int(os.environ.get("PREV_N") or 0)
          print(f"{n} fixtures across {len(d['days'])} days")
          if n == 0:
              sys.exit("build produced zero fixtures, refusing to publish")
          if prev > 0 and n < 0.4 * prev:
              sys.exit(f"build produced {n} fixtures against {prev} in the last committed archive "
                       f"(under 40%): a partial upstream day, refusing to publish")
          PY

      # Grade every past prediction against results that have landed since.
      # Runs before the build so the fresh record is inlined into the page.
      - name: Score past predictions
        run: python3 score.py

      # A separate pipeline from football — its own ratings file
      # (tennis.json), its own fetch, nothing football depends on. The one
      # thing that matters here: a day this can't reach ESPN, or ESPN
      # blocks the request the way it briefly did testing this by hand,
      # must NOT overwrite a working file with an empty one. Whatever was
      # last committed is already sitting in the checkout when this runs,
      # so that's the fallback — compare match counts, keep the higher one.
      - name: Build this week's tennis
        run: |
          cp tennis-data.js /tmp/tennis-data.js.prev 2>/dev/null || true
          python3 build_tennis.py --days 7 || true
          python3 - <<'PY'
          import json, os

          def count(path):
              try:
                  text = open(path).read()
                  i = text.index("{")
                  return json.loads(text[i:-1]).get("count", 0)
              except Exception:
                  return 0

          new_n = count("tennis-data.js")
          old_n = count("/tmp/tennis-data.js.prev")
          if new_n == 0 and old_n > 0:
              print(f"today's tennis fetch returned 0 matches — keeping yesterday's {old_n} instead")
              os.replace("/tmp/tennis-data.js.prev", "tennis-data.js")
          else:
              print(f"today's tennis fetch: {new_n} matches")
          PY

      # Grade archived tennis picks against who won. Separate from football's
      # score.py, and allowed to fail: a bad ESPN day keeps yesterday's grades
      # (they live in tennis-record.json) rather than costing the deploy.
      - name: Score past tennis predictions
        run: python3 score_tennis.py || echo "::warning::tennis scoring failed; keeping the last record"

      # NFL, baseball, basketball, rugby: top up results, price the next five
      # days, grade the archive. Uses the committed sports.json (fitted by hand
      # with sports.py --tune, never refitted here). Allowed to fail: football
      # and tennis must publish regardless. Guarded like tennis (25 Oct 2026,
      # bug 7): a day ESPN answers with nothing must not overwrite a working
      # board with an empty one, which the archive commit below would then
      # keep as the new baseline. Compare game counts, keep yesterday's files.
      - name: Build and score the other sports
        run: |
          mkdir -p /tmp/sports-prev
          cp sports-data.js sports-record.json sports-record.js /tmp/sports-prev/ 2>/dev/null || true
          python3 sports.py --daily || echo "::warning::sports build failed; keeping the last files"
          python3 - <<'PY'
          import json, os, shutil

          def count(path):
              try:
                  text = open(path).read()
                  i = text.index("{")
                  d = json.loads(text[i:-1])
                  return sum(len(s.get("games") or []) for s in (d.get("sports") or {}).values())
              except Exception:
                  return 0

          new_n = count("sports-data.js")
          old_n = count("/tmp/sports-prev/sports-data.js")
          if new_n == 0 and old_n > 0:
              print(f"::warning::today's sports build returned 0 games — keeping yesterday's {old_n} instead")
              for f in ("sports-data.js", "sports-record.json", "sports-record.js"):
                  src = os.path.join("/tmp/sports-prev", f)
                  if os.path.exists(src): shutil.copy(src, f)
          else:
              print(f"today's sports build: {new_n} games")
          PY

      # Pages artifacts do not persist between runs, so the prediction archive
      # has to live in the repository or the record resets to zero every day.
      # The archive commit races anything else pushing to main. Uploading files
      # through the web UI while a build is running is enough: the run checked
      # out an older main, and by the time it pushes it is no longer a
      # fast-forward and the whole job fails, taking the deploy with it.
      #
      # Rebasing is the wrong tool here. Both files are regenerated outputs of
      # this run, not edits to be merged, so the fix is to put them on top of
      # whatever main is now rather than to reconcile two versions of them.
      # Fetch, reset onto the remote tip, drop the freshly built files back in,
      # commit, push. Retried, because main can move again while that happens.
      # The Odds tab (groupings.py): five-leg groups from the model's tested
      # picks with bookmaker prices beside them, the day's first groups
      # archived to groupings-archive/ and every archived group graded into
      # groupings-record.json. Before the archive commit so both are kept.
      # Prices never feed a model. Allowed to fail: a missing price source
      # must not cost the deploy. Guarded like tennis (25 Oct 2026, bug 7):
      # groupings.json / groupings-data.js are rebuilt from scratch each run
      # and never committed, so the committed record and archive are what a
      # bad run could wreck. If the regraded record comes back with no groups
      # where the committed one had some, both are put back as they were.
      - name: Build and grade the Odds tab groupings
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PINNWIRE_KEY: ${{ secrets.PINNWIRE_KEY }}
          # 11 Nov 2026: the free price sources (free_prices.py); each is
          # silent until its secrets exist
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          MATCHBOOK_USERNAME: ${{ secrets.MATCHBOOK_USERNAME }}
          MATCHBOOK_PASSWORD: ${{ secrets.MATCHBOOK_PASSWORD }}
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          # 11 Nov 2026: the context check on the Card's picks (context_review.py)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          rm -rf /tmp/groupings-prev && mkdir -p /tmp/groupings-prev
          cp groupings-record.json /tmp/groupings-prev/ 2>/dev/null || true
          cp -r groupings-archive /tmp/groupings-prev/ 2>/dev/null || true
          python3 groupings.py || echo "::warning::groupings failed this run — the Odds tab will show its empty state"
          # 29 Oct 2026: a push to Douglas's phone for each Card group this build created (notify.py, ntfy)
          NTFY_TOPIC="${{ secrets.NTFY_TOPIC }}" python3 notify.py || echo "::warning::notify failed this run"
          python3 - <<'PY'
          import json, os, shutil

          def count(path):
              try:
                  d = json.load(open(path))
                  return sum(len(day.get("groups") or []) for day in d.get("days") or [])
              except Exception:
                  return 0

          new_n = count("groupings-record.json")
          old_n = count("/tmp/groupings-prev/groupings-record.json")
          if new_n == 0 and old_n > 0:
              print(f"::warning::today's groupings record has 0 groups — keeping yesterday's {old_n} instead")
              shutil.copy("/tmp/groupings-prev/groupings-record.json", "groupings-record.json")
              if os.path.isdir("/tmp/groupings-prev/groupings-archive"):
                  shutil.rmtree("groupings-archive", ignore_errors=True)
                  shutil.copytree("/tmp/groupings-prev/groupings-archive", "groupings-archive")
          else:
              print(f"today's groupings record: {new_n} groups")
          PY

      # The results ledger (ledger.py, 14 Nov 2026): every prediction of every
      # sport with its result and its pre-start price, merged and never
      # trimmed, and the ungraded report (a ::warning:: on Monday's first
      # build). After groupings.py, whose board prices it keeps. Allowed to
      # fail: nothing on the page reads it.
      - name: Write the results ledger
        run: python3 ledger.py || echo "::warning::ledger failed; keeping the last one"

      # Football markets beyond the match winner (markets.py, 14 Nov 2026):
      # both teams to score, goals lines, win and both score, win to nil,
      # double chance, draw no bet. The model's number and the bookmakers'
      # price for every fixture today and tomorrow, archived to
      # predictions-markets/ and graded into markets-record.json. One
      # API-Football sweep a date about every five hours; it stands down when
      # the day's allowance runs low. Allowed to fail: the page does not read it.
      - name: Price and grade the football markets
        run: python3 markets.py || echo "::warning::markets failed; keeping the last record"

      # Half-time scores for the football graded (periods.py, 16 Nov 2026):
      # read from the API-Football day files already cached, no calls, kept in
      # periods/football-YYYY-MM.json. Allowed to fail: nothing reads it yet.
      - name: Keep the football half-time scores
        run: python3 periods.py || echo "::warning::periods failed; nothing kept this run"

      # Scale (scale.py, 15 Nov 2026): Daily List winners with a second
      # condition added (football: and both teams score, only where William
      # Hill prices it, read from markets.py's archive; tennis: in straight
      # sets). Archives each day's picks and groups to scale-archive/, grades
      # them from the records and writes scale.js for the Scale tab. Fetches
      # nothing. Allowed to fail: the tab then shows its empty state.
      - name: Build and grade the Scale list
        run: python3 scale.py || echo "::warning::scale failed; the Scale tab keeps its empty state"
      # The slip (slip.py, 15 Nov 2026): the day's 3-5 legs paying 3x-6x,
      # chosen for expected return from the ledger's band rates, archived to
      # slip-archive/ and graded. Reads results-ledger.json.gz (ledger.py above).
      - name: The slip
        run: python3 slip.py || echo "::warning::slip failed; the Bets tab keeps the last slip"

      # Horse racing (racing.py, 19 Nov 2026, on trial): UK and Irish racecards
      # from The Racing API, a chance for every runner, the day's few tips, each
      # race frozen at its off in predictions-racing/, graded into
      # racing-record.json, racing.js for the tab. Silent without the secrets
      # (the tab says the feed is not connected). Allowed to fail.
      - name: Horse racing
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: python3 racing.py || echo "::warning::racing failed; the tab keeps its last page"

      # main is protected (ruleset "Protect main"): only the office App and the
      # owner may push to it directly, so the archive is pushed with an App token.
      - name: Normalise the App key
        env:
          RAW: ${{ secrets.OFFICE_APP_KEY }}
        run: |
          python3 - <<'PY'
          import os, re, textwrap
          raw = os.environ["RAW"].replace("\\n", "\n").replace("\r", "").strip().strip('"')
          m = re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----", raw, re.S)
          kind, body = (m.group(1), m.group(2)) if m else ("RSA PRIVATE KEY", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          pem = f"-----BEGIN {kind}-----\n" + "\n".join(textwrap.wrap(body, 64)) + f"\n-----END {kind}-----"
          for line in textwrap.wrap(body, 64): print(f"::add-mask::{line}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("APP_KEY<<__PEM__\n" + pem + "\n__PEM__\n")
          PY
      - name: Mint the App token
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.OFFICE_APP_ID }}
          private-key: ${{ env.APP_KEY }}

      # A scheduled run without an App token cannot push the archive (main is
      # protected), so the day's predictions would never be graded. That is a
      # red run, not a warning (25 Oct 2026, bug 7). A manual or push run can
      # still go on with the workflow token, where the owner is watching.
      - name: Refuse a scheduled run without the App token
        if: github.event_name == 'schedule' && steps.app.outputs.token == ''
        run: |
          echo "::error::the office App token could not be minted (OFFICE_APP_ID / OFFICE_APP_KEY): the archive cannot be pushed to the protected main, so today's predictions would not be graded"
          exit 1

      - name: Commit the archive
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/archive
          cp -r predictions /tmp/archive/
          cp record.json /tmp/archive/
          # every graded fixture in full (score.py), for tools/julius_export.py
          cp record-graded.json /tmp/archive/ 2>/dev/null || true
          # The season-so-far cache. Without it every run re-walks a hundred
          # days for each of sixty-one competitions instead of three.
          cp -r current /tmp/archive/ 2>/dev/null || true
          # Today's tennis fetch (or yesterday's, if today's came back
          # empty) — committed for the same reason the predictions are:
          # Pages artifacts don't persist between runs, so without this the
          # fallback in the step above would have nothing to fall back to
          # tomorrow.
          cp tennis-data.js /tmp/archive/ 2>/dev/null || true
          # The tennis archive and its record, same reason again.
          cp -r predictions-tennis /tmp/archive/ 2>/dev/null || true
          cp tennis-record.json tennis-record.js /tmp/archive/ 2>/dev/null || true
          # Every tennis result since the fitted archive ends (build_tennis.py)
          cp -r history-tennis /tmp/archive/ 2>/dev/null || true
          cp -r history-sports predictions-sports /tmp/archive/ 2>/dev/null || true
          cp sports-data.js sports-record.json sports-record.js /tmp/archive/ 2>/dev/null || true
          # every graded pick of the other sports (sports.py) and the results ledger (ledger.py)
          cp sports-graded.json results-ledger.json.gz /tmp/archive/ 2>/dev/null || true
          # the football markets archive and its record (markets.py)
          cp -r predictions-markets /tmp/archive/ 2>/dev/null || true
          cp markets-record.json /tmp/archive/ 2>/dev/null || true
          # the Scale list's picks and groups as published (scale.py)
          cp -r scale-archive /tmp/archive/ 2>/dev/null || true
          cp -r slip-archive /tmp/archive/ 2>/dev/null || true      # the slip as published (slip.py)
          cp -r periods /tmp/archive/ 2>/dev/null || true           # football half-time scores (periods.py)
          cp -r predictions-racing /tmp/archive/ 2>/dev/null || true   # horse racing as published (racing.py)
          cp racing-record.json /tmp/archive/ 2>/dev/null || true
          # the FIFA ranking, refreshed by build.py when FIFA publishes a new release
          cp fifa-rankings.json /tmp/archive/ 2>/dev/null || true
          # The Odds tab's archive and record
          cp -r groupings-archive /tmp/archive/ 2>/dev/null || true
          cp groupings-record.json /tmp/archive/ 2>/dev/null || true

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # Overlaid, not replaced: another run may have archived a day
            # this one does not have, and swapping the directory wholesale
            # would silently delete it.
            mkdir -p predictions current
            cp -r /tmp/archive/predictions/. predictions/
            cp -r /tmp/archive/current/. current/ 2>/dev/null || true
            cp /tmp/archive/record.json .
            cp /tmp/archive/record-graded.json . 2>/dev/null || true
            cp /tmp/archive/tennis-data.js . 2>/dev/null || true
            mkdir -p predictions-tennis
            cp -r /tmp/archive/predictions-tennis/. predictions-tennis/ 2>/dev/null || true
            cp /tmp/archive/tennis-record.json /tmp/archive/tennis-record.js . 2>/dev/null || true
            mkdir -p history-tennis
            cp -r /tmp/archive/history-tennis/. history-tennis/ 2>/dev/null || true
            mkdir -p history-sports predictions-sports
            cp -r /tmp/archive/history-sports/. history-sports/ 2>/dev/null || true
            cp -r /tmp/archive/predictions-sports/. predictions-sports/ 2>/dev/null || true
            cp /tmp/archive/sports-data.js /tmp/archive/sports-record.json /tmp/archive/sports-record.js . 2>/dev/null || true
            cp /tmp/archive/sports-graded.json /tmp/archive/results-ledger.json.gz . 2>/dev/null || true
            if [ -d /tmp/archive/predictions-markets ]; then
              mkdir -p predictions-markets
              cp -r /tmp/archive/predictions-markets/. predictions-markets/
            fi
            cp /tmp/archive/markets-record.json . 2>/dev/null || true
            if [ -d /tmp/archive/scale-archive ]; then
              mkdir -p scale-archive
              cp -r /tmp/archive/scale-archive/. scale-archive/
            fi
            if [ -d /tmp/archive/periods ]; then
              mkdir -p periods
              cp -r /tmp/archive/periods/. periods/
            fi
            if [ -d /tmp/archive/predictions-racing ]; then
              mkdir -p predictions-racing
              cp -r /tmp/archive/predictions-racing/. predictions-racing/
            fi
            cp /tmp/archive/racing-record.json . 2>/dev/null || true
            if [ -d /tmp/archive/slip-archive ]; then
              mkdir -p slip-archive
              cp -r /tmp/archive/slip-archive/. slip-archive/
            fi
            cp /tmp/archive/fifa-rankings.json . 2>/dev/null || true
            mkdir -p groupings-archive
            cp -r /tmp/archive/groupings-archive/. groupings-archive/ 2>/dev/null || true
            cp /tmp/archive/groupings-record.json . 2>/dev/null || true
            git add -A predictions current record.json record-graded.json tennis-data.js \
                       predictions-tennis tennis-record.json tennis-record.js history-tennis \
                       history-sports predictions-sports sports-data.js sports-record.json sports-record.js \
                       $(ls -d sports-graded.json results-ledger.json.gz predictions-markets markets-record.json scale-archive slip-archive periods 2>/dev/null) \
                       $(ls -d predictions-racing racing-record.json 2>/dev/null) \
                       fifa-rankings.json groupings-archive groupings-record.json
            if git diff --staged --quiet; then
              echo "nothing new to archive"
              exit 0
            fi
            # [skip ci]: an App-token push triggers workflows, and this one must not rebuild itself
            git commit -m "Archive predictions and record for $(date +%F) [skip ci]"
            # actions/checkout leaves the workflow token in an extraheader, and git
            # sends it ahead of the App token in the URL: every archive push since
            # main was protected went out as github-actions[bot] and was refused
            # (GH013, 5-6 Oct 2026). Drop it so the App, a ruleset bypass actor, pushes.
            if [ -n "$APP_TOKEN" ]; then
              git config --local --unset-all http.https://github.com/.extraheader || true
              DEST="https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            else DEST=origin; fi
            if git push "$DEST" HEAD:main; then
              exit 0
            fi
            echo "push rejected, main moved under us; retrying ($attempt of 3)"
            sleep $((attempt * 5))
          done

          # A lost archive costs one day of grading. A failed job costs the
          # deploy, and the site goes stale instead. The lesser of the two.
          echo "::warning::could not push the archive after three attempts; \
                today's predictions will not be graded later"
          git reset --hard origin/main

      - name: Rebuild with the updated record
        run: python3 build.py --days 7 --top 50

      # Today's Daily List, pinned for the UK day (daylist.py): every pick as it
      # was published before its start, with its result from the record. The
      # live files drop a game at kick-off, so without this the day's list
      # emptied as it was played (5 Oct 2026). The office reads daylist.json.
      # Allowed to fail: the live list still publishes without it.
      - name: Pin today's Daily List
        run: python3 daylist.py || echo "::warning::daylist failed; today's started picks will not show"

      # The emails (mailer.py, 23 Nov 2026, Douglas): the Daily List at 07:00 UK every
      # morning and the Weekly Record on Saturdays, through Resend. After daylist.py
      # (today's list), groupings.py, scale.py and slip.py, whose files it reads. It
      # sends only from 07:00 to 11:59 UK (the morning briefing's build, notify.py's
      # 07:00 slot), and once a day per email: Supabase's almanac_mail_claim answers
      # true to the first build only. Silent without the two secrets. Never fails the deploy.
      - name: The emails
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAILER_SECRET: ${{ secrets.MAILER_SECRET }}
        run: python3 mailer.py || echo "::warning::mailer failed this run"

      - name: Keep the API-Football cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .afcache
          key: afcache-${{ github.run_id }}

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html   # the self-contained build
          cp record-data.js _site/record-data.js   # the football record, fetched when "How it went" opens (26 Oct 2026)
          cp data.json _site/data.json         # handy if you want the raw numbers
          cp record.json _site/record.json
          cp markets-record.json _site/markets-record.json 2>/dev/null || true   # the football markets record (markets.py)
          cp analysis.html _site/analysis.html   # Almanac Analysis, reads record.json (6 Oct 2026)
          cp mailer.html _site/mailer.html       # the Mailer sign-up page (16 Nov 2026)
          # The touch icons and the manifest are fetched by the device rather
          # than parsed out of the page, so they need to exist at real URLs or
          # a home-screen save falls back to a screenshot of the page.
          cp icon-*.png manifest.webmanifest _site/
          # Tennis: only copied if it exists, which it always will now that
          # the step above commits it back — but a defensive check costs
          # nothing and a missing file must not fail the assemble step.
          cp tennis-data.js _site/tennis-data.js 2>/dev/null || \
            echo "::warning::no tennis-data.js this run — Tennis tab will show its empty state"
          cp sports-data.js sports-record.js _site/ 2>/dev/null || \
            echo "::warning::no sports files this run — sport tabs will show their empty state"
          cp tennis-record.js _site/tennis-record.js 2>/dev/null || \
            echo "::warning::no tennis-record.js this run — tennis results will show their empty state"
          cp daylist.js daylist.json _site/ 2>/dev/null || \
            echo "::warning::no daylist this run — started picks will not show on today's list"
          cp groupings-data.js groupings.json _site/ 2>/dev/null || \
            echo "::warning::no groupings this run — the Odds tab will show its empty state"
          cp slip.js slip.json _site/ 2>/dev/null || echo "::warning::no slip files this run"
          cp scale.js scale.json _site/ 2>/dev/null || \
            echo "::warning::no scale files this run — the Scale tab will show its empty state"
          cp racing.js _site/ 2>/dev/null || \
            echo "::warning::no racing.js this run — the Horse racing tab will show its empty state"

      # 16 Nov 2026, Douglas: Google Tag Manager on every page, future pages included.
      # The pages carry it in their source; this adds it to any published page that does not.
      - name: Google Tag Manager on every page
        run: python3 tools/tag_pages.py _site || echo "::warning::a published page has no <head>, so no tag"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 16 Nov 2026: start the briefing watchdog's wait for the next slot
  # (tools/briefing_watch.py --wait). GitHub sheds scheduled runs, the
  # watchdog's own included, so the chain runs from build to build: this
  # build's watchdog sleeps until the next unsent slot and dispatches the
  # build that sends it, which starts the next wait. Runs whether or not the
  # build ran (a held push still keeps the chain). Never fails the deploy.
  briefing-next:
    needs: [gate, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch the briefing watchdog in wait mode
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/briefing-watch.yml/dispatches" \
            -f ref=main -f 'inputs[wait]=true' && echo "briefing watchdog dispatched (wait)"

  # 17 Nov 2026: the nightly Card review's 03:40 UTC cron has fired between
  # 10:55 and 12:07 UTC on every day from 9 to 16 Nov (the 09:25 backup in the
  # evening), so the 03:17 and 09:17 London build sessions never had the day's
  # review. The first build at or after 03:40 UTC that finds no review issue
  # for the UTC day, and no review running, dispatches one. The crons stay as
  # backups; card_review_post posts one issue a day whichever run comes first.
  card-review-next:
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      issues: read
    steps:
      - name: Dispatch the Card review if the day has none yet
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          now=$(date -u +%H%M); day=$(date -u +%F)
          if [ "$now" -lt 0340 ]; then echo "before 03:40 UTC: the night's grading may not be in"; exit 0; fi
          have=$(gh api "repos/$REPO/issues?labels=card-review&state=all&per_page=5" --jq "[.[] | select(.title == \"Card review $day\")] | length")
          if [ "$have" != "0" ]; then echo "Card review $day already posted"; exit 0; fi
          busy=$(gh api "repos/$REPO/actions/workflows/card-review.yml/runs?per_page=5" --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$busy" != "0" ]; then echo "a Card review is already running"; exit 0; fi
          gh api -X POST "repos/$REPO/actions/workflows/card-review.yml/dispatches" -f ref=main && echo "Card review dispatched for $day"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
