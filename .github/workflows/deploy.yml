name: Rebuild and publish

# Three triggers: scheduled rebuilds, pushes to main, and a manual button in the Actions tab for
# when you have edited adjustments.json and want it live now.
on:
  schedule:
    # Six runs a day, timed to when results land rather than evenly spaced,
    # so the Daily List shows wins and losses within a couple of hours of a
    # game ending (Douglas, 7 Oct 2026). There is no in-play feed: a started
    # game shows as pending until the next run after its result is published.
    #
    # Cron is always UTC and does not follow British Summer Time. The UTC
    # times are chosen so each run still lands after the games it is for in
    # both summer and winter; UK time is an hour later in summer.
    #
    #   UTC     BST     GMT     catches
    #   00:10   01:10   00:10   just after API-Football's daily allowance resets
    #   05:15   06:15   05:15   the day's slate, after late South American games
    #                           (Brazil is UTC-3: a 20:00 local game runs past 23:00 UTC)
    #   12:00   13:00   12:00   Asian and Australian games, early European games
    #   17:00   18:00   17:00   UK 15:00 kick-offs and the afternoon tennis
    #   19:30   20:30   19:30   UK 17:30 kick-offs
    #   22:15   23:15   22:15   UK 19:45 / 20:00 kick-offs
    #
    # Each run costs roughly 10-25 API-Football calls (the shared date pool in
    # sources._af_day; open dates are re-fetched after 45 minutes), against a
    # 7,500 daily allowance. AI credits are not used by this workflow.
    - cron: "10 0 * * *"
    - cron: "15 5 * * *"
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
    - cron: "30 19 * * *"
    - cron: "15 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # Agent write-ups, release notes, tests and agent scripts do not change
    # the site, and every rebuild spends API allowance.
    paths-ignore: ["claude/**", "RELEASES.md", "tests/**", "tools/**", "agents/**"]

permissions:
  contents: write        # predictions are committed back so the record survives
  pages: write
  id-token: write

# Queue rather than cancel: on 5 Oct 2026 agent merges cancelled the daily
# build one after another. GitHub keeps one queued run, so a burst of pushes
# still costs at most one extra build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A push during an office-agent sprint is held: the sprint's publish job
  # rebuilds once at the end if anything merged. On 5 Oct 2026 one sprint's
  # merges started a build each.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=1
          if [ "${{ github.event_name }}" = "push" ]; then
            n=$(gh run list -R "${{ github.repository }}" -w office-agents.yml -L 5 --json status \
                  --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length' || echo 0)
            if [ "${n:-0}" -gt 0 ]; then echo "an office sprint is running; its publish job rebuilds once at the end"; go=0; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    env:
      # API-Football (sources.AF), the paid source for step 3; absent means
      # those leagues are logged as missing, never guessed.
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Finished API-Football seasons (sources._af_season): fetched once and
      # kept, so a build costs about one call per league, not three.
      - uses: actions/cache@v4
        with:
          path: .afcache
          key: afcache-${{ github.run_id }}
          restore-keys: afcache-

      # A club whose two spellings stop meeting is invisible: no error, no
      # flag on the page, just a fixture priced as though this season had not
      # started. Checked before the build so a bad name change stops the
      # publish rather than reaching the board.
      - name: Check the club-name matcher
        run: python3 nametest.py

      # No pip install: the whole thing runs on the standard library.
      - name: Build today's slate
        run: python3 build.py --days 7 --top 50

      # A build that returns nothing is a broken upstream, not a quiet
      # publish of an empty page. Fail loudly and keep yesterday's site.
      - name: Check the build is not empty
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("data.json"))
          n = sum(day["count"] for day in d["days"])
          print(f"{n} fixtures across {len(d['days'])} days")
          if n == 0:
              sys.exit("build produced zero fixtures, refusing to publish")
          PY

      # Grade every past prediction against results that have landed since.
      # Runs before the build so the fresh record is inlined into the page.
      - name: Score past predictions
        run: python3 score.py

      # A separate pipeline from football — its own ratings file
      # (tennis.json), its own fetch, nothing football depends on. The one
      # thing that matters here: a day this can't reach ESPN, or ESPN
      # blocks the request the way it briefly did testing this by hand,
      # must NOT overwrite a working file with an empty one. Whatever was
      # last committed is already sitting in the checkout when this runs,
      # so that's the fallback — compare match counts, keep the higher one.
      - name: Build this week's tennis
        run: |
          cp tennis-data.js /tmp/tennis-data.js.prev 2>/dev/null || true
          python3 build_tennis.py --days 7 || true
          python3 - <<'PY'
          import json, os

          def count(path):
              try:
                  text = open(path).read()
                  i = text.index("{")
                  return json.loads(text[i:-1]).get("count", 0)
              except Exception:
                  return 0

          new_n = count("tennis-data.js")
          old_n = count("/tmp/tennis-data.js.prev")
          if new_n == 0 and old_n > 0:
              print(f"today's tennis fetch returned 0 matches — keeping yesterday's {old_n} instead")
              os.replace("/tmp/tennis-data.js.prev", "tennis-data.js")
          else:
              print(f"today's tennis fetch: {new_n} matches")
          PY

      # Grade archived tennis picks against who won. Separate from football's
      # score.py, and allowed to fail: a bad ESPN day keeps yesterday's grades
      # (they live in tennis-record.json) rather than costing the deploy.
      - name: Score past tennis predictions
        run: python3 score_tennis.py || echo "::warning::tennis scoring failed; keeping the last record"

      # NFL, baseball, basketball, rugby: top up results, price the next five
      # days, grade the archive. Uses the committed sports.json (fitted by hand
      # with sports.py --tune, never refitted here). Allowed to fail: football
      # and tennis must publish regardless.
      - name: Build and score the other sports
        run: python3 sports.py --daily || echo "::warning::sports build failed; keeping the last files"

      # Pages artifacts do not persist between runs, so the prediction archive
      # has to live in the repository or the record resets to zero every day.
      # The archive commit races anything else pushing to main. Uploading files
      # through the web UI while a build is running is enough: the run checked
      # out an older main, and by the time it pushes it is no longer a
      # fast-forward and the whole job fails, taking the deploy with it.
      #
      # Rebasing is the wrong tool here. Both files are regenerated outputs of
      # this run, not edits to be merged, so the fix is to put them on top of
      # whatever main is now rather than to reconcile two versions of them.
      # Fetch, reset onto the remote tip, drop the freshly built files back in,
      # commit, push. Retried, because main can move again while that happens.
      # The Odds tab (groupings.py): five-leg groups from the model's tested
      # picks with bookmaker prices beside them, the day's first groups
      # archived to groupings-archive/ and every archived group graded into
      # groupings-record.json. Before the archive commit so both are kept.
      # Prices never feed a model. Allowed to fail: a missing price source
      # must not cost the deploy.
      - name: Build and grade the Odds tab groupings
        run: python3 groupings.py || echo "::warning::groupings failed this run — the Odds tab will show its empty state"

      # main is protected (ruleset "Protect main"): only the office App and the
      # owner may push to it directly, so the archive is pushed with an App token.
      - name: Normalise the App key
        env:
          RAW: ${{ secrets.OFFICE_APP_KEY }}
        run: |
          python3 - <<'PY'
          import os, re, textwrap
          raw = os.environ["RAW"].replace("\\n", "\n").replace("\r", "").strip().strip('"')
          m = re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----", raw, re.S)
          kind, body = (m.group(1), m.group(2)) if m else ("RSA PRIVATE KEY", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          pem = f"-----BEGIN {kind}-----\n" + "\n".join(textwrap.wrap(body, 64)) + f"\n-----END {kind}-----"
          for line in textwrap.wrap(body, 64): print(f"::add-mask::{line}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("APP_KEY<<__PEM__\n" + pem + "\n__PEM__\n")
          PY
      - name: Mint the App token
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.OFFICE_APP_ID }}
          private-key: ${{ env.APP_KEY }}

      - name: Commit the archive
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/archive
          cp -r predictions /tmp/archive/
          cp record.json /tmp/archive/
          # The season-so-far cache. Without it every run re-walks a hundred
          # days for each of sixty-one competitions instead of three.
          cp -r current /tmp/archive/ 2>/dev/null || true
          # Today's tennis fetch (or yesterday's, if today's came back
          # empty) — committed for the same reason the predictions are:
          # Pages artifacts don't persist between runs, so without this the
          # fallback in the step above would have nothing to fall back to
          # tomorrow.
          cp tennis-data.js /tmp/archive/ 2>/dev/null || true
          # The tennis archive and its record, same reason again.
          cp -r predictions-tennis /tmp/archive/ 2>/dev/null || true
          cp tennis-record.json tennis-record.js /tmp/archive/ 2>/dev/null || true
          cp -r history-sports predictions-sports /tmp/archive/ 2>/dev/null || true
          cp sports-data.js sports-record.json sports-record.js /tmp/archive/ 2>/dev/null || true
          # the FIFA ranking, refreshed by build.py when FIFA publishes a new release
          cp fifa-rankings.json /tmp/archive/ 2>/dev/null || true
          # The Odds tab's archive and record
          cp -r groupings-archive /tmp/archive/ 2>/dev/null || true
          cp groupings-record.json /tmp/archive/ 2>/dev/null || true

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # Overlaid, not replaced: another run may have archived a day
            # this one does not have, and swapping the directory wholesale
            # would silently delete it.
            mkdir -p predictions current
            cp -r /tmp/archive/predictions/. predictions/
            cp -r /tmp/archive/current/. current/ 2>/dev/null || true
            cp /tmp/archive/record.json .
            cp /tmp/archive/tennis-data.js . 2>/dev/null || true
            mkdir -p predictions-tennis
            cp -r /tmp/archive/predictions-tennis/. predictions-tennis/ 2>/dev/null || true
            cp /tmp/archive/tennis-record.json /tmp/archive/tennis-record.js . 2>/dev/null || true
            mkdir -p history-sports predictions-sports
            cp -r /tmp/archive/history-sports/. history-sports/ 2>/dev/null || true
            cp -r /tmp/archive/predictions-sports/. predictions-sports/ 2>/dev/null || true
            cp /tmp/archive/sports-data.js /tmp/archive/sports-record.json /tmp/archive/sports-record.js . 2>/dev/null || true
            cp /tmp/archive/fifa-rankings.json . 2>/dev/null || true
            mkdir -p groupings-archive
            cp -r /tmp/archive/groupings-archive/. groupings-archive/ 2>/dev/null || true
            cp /tmp/archive/groupings-record.json . 2>/dev/null || true
            git add -A predictions current record.json tennis-data.js \
                       predictions-tennis tennis-record.json tennis-record.js \
                       history-sports predictions-sports sports-data.js sports-record.json sports-record.js \
                       fifa-rankings.json groupings-archive groupings-record.json
            if git diff --staged --quiet; then
              echo "nothing new to archive"
              exit 0
            fi
            # [skip ci]: an App-token push triggers workflows, and this one must not rebuild itself
            git commit -m "Archive predictions and record for $(date +%F) [skip ci]"
            # actions/checkout leaves the workflow token in an extraheader, and git
            # sends it ahead of the App token in the URL: every archive push since
            # main was protected went out as github-actions[bot] and was refused
            # (GH013, 5-6 Oct 2026). Drop it so the App, a ruleset bypass actor, pushes.
            if [ -n "$APP_TOKEN" ]; then
              git config --local --unset-all http.https://github.com/.extraheader || true
              DEST="https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            else DEST=origin; fi
            if git push "$DEST" HEAD:main; then
              exit 0
            fi
            echo "push rejected, main moved under us; retrying ($attempt of 3)"
            sleep $((attempt * 5))
          done

          # A lost archive costs one day of grading. A failed job costs the
          # deploy, and the site goes stale instead. The lesser of the two.
          echo "::warning::could not push the archive after three attempts; \
                today's predictions will not be graded later"
          git reset --hard origin/main

      - name: Rebuild with the updated record
        run: python3 build.py --days 7 --top 50

      # Today's Daily List, pinned for the UK day (daylist.py): every pick as it
      # was published before its start, with its result from the record. The
      # live files drop a game at kick-off, so without this the day's list
      # emptied as it was played (5 Oct 2026). The office reads daylist.json.
      # Allowed to fail: the live list still publishes without it.
      - name: Pin today's Daily List
        run: python3 daylist.py || echo "::warning::daylist failed; today's started picks will not show"

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html   # the self-contained build
          cp data.json _site/data.json         # handy if you want the raw numbers
          cp README.md _site/README.md
          cp record.json _site/record.json
          cp analysis.html _site/analysis.html   # Almanac Analysis, reads record.json (6 Oct 2026)
          # The touch icons and the manifest are fetched by the device rather
          # than parsed out of the page, so they need to exist at real URLs or
          # a home-screen save falls back to a screenshot of the page.
          cp icon-*.png manifest.webmanifest _site/
          # Tennis: only copied if it exists, which it always will now that
          # the step above commits it back — but a defensive check costs
          # nothing and a missing file must not fail the assemble step.
          cp tennis-data.js _site/tennis-data.js 2>/dev/null || \
            echo "::warning::no tennis-data.js this run — Tennis tab will show its empty state"
          cp sports-data.js sports-record.js _site/ 2>/dev/null || \
            echo "::warning::no sports files this run — sport tabs will show their empty state"
          cp tennis-record.js _site/tennis-record.js 2>/dev/null || \
            echo "::warning::no tennis-record.js this run — tennis results will show their empty state"
          cp daylist.js daylist.json _site/ 2>/dev/null || \
            echo "::warning::no daylist this run — started picks will not show on today's list"
          cp groupings-data.js groupings.json _site/ 2>/dev/null || \
            echo "::warning::no groupings this run — the Odds tab will show its empty state"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
