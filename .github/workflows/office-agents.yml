name: Office agents

# The Footyalmanac HQ agents doing real development work, unattended.
# Each morning, after the daily build, the office runs a sprint: every agent
# in turn (agents/pick_task.py SPRINT) takes its most important task that is
# not in its seven-day cooldown, works on it with Claude following CLAUDE.md
# and AGENTS.md, and the workflow opens a pull request. There is no owner
# review: agents/merge_gate.py merges it at once if every check passes, so
# the next agent builds on it, and the site is redeployed once at the end.
# Agents run one at a time so their RELEASES.md entries never conflict. Needs ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN); without
# it this workflow skips quietly.
on:
  schedule:
    - cron: "30 6 * * *"   # 07:30 BST / 06:30 GMT, after deploy.yml
  workflow_dispatch:
    inputs:
      task:
        description: "Task key to force (blank = pick automatically)"
        required: false
        default: ""
      agent:
        description: "Agent to run (all = the whole sprint; blank = the single most urgent task)"
        required: false
        default: "all"

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: office-agents
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.p.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          A="${{ inputs.agent }}"; T="${{ inputs.task }}"
          [ "${{ github.event_name }}" = "schedule" ] && A=all
          if [ -n "$T" ]; then echo 'agents=[""]' >> "$GITHUB_OUTPUT"
          elif [ "$A" = all ]; then echo "agents=$(python3 agents/pick_task.py --list-agents)" >> "$GITHUB_OUTPUT"
          else echo "agents=[\"$A\"]" >> "$GITHUB_OUTPUT"; fi

  work:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        agent: ${{ fromJSON(needs.plan.outputs.agents) }}
    env:
      GH_TOKEN: ${{ github.token }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the latest main, including the agent merged just before this one
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for a Claude key
        id: key
        env:
          K1: ${{ secrets.ANTHROPIC_API_KEY }}
          K2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$K1$K2" ]; then
            echo "::warning::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret, so the agents are off today."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
          # A pasted token can carry a space or line break, which the Claude
          # action rejects in a quarter of a second. Report the shape (never
          # the value) and pass a trimmed copy on.
          for n in K1 K2; do
            v="${!n}"; t="$(printf '%s' "$v" | tr -d '[:space:]')"
            [ -n "$v" ] && echo "$n: length ${#v}, trimmed ${#t}"
          done
          T1="$(printf '%s' "$K1" | tr -d '[:space:]')"; T2="$(printf '%s' "$K2" | tr -d '[:space:]')"
          [ -n "$T1" ] && echo "::add-mask::$T1"; [ -n "$T2" ] && echo "::add-mask::$T2"
          { echo "AGENT_API_KEY=$T1"; echo "AGENT_OAUTH=$T2"; } >> "$GITHUB_ENV"
      - name: Pick today's task
        id: pick
        if: steps.key.outputs.skip == '0'
        run: python3 agents/pick_task.py --task "${{ inputs.task }}" --agent "${{ matrix.agent }}"
      - name: Agent works on the task
        if: steps.key.outputs.skip == '0' && steps.pick.outputs.skip == '0'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.AGENT_API_KEY }}
          claude_code_oauth_token: ${{ env.AGENT_OAUTH }}
          prompt: ${{ steps.pick.outputs.prompt }}
          claude_args: "--model sonnet --max-turns 50 --allowedTools Bash,Read,Edit,Write,Glob,Grep,WebFetch"
      - name: Verify and open a pull request
        id: pr
        if: steps.key.outputs.skip == '0' && steps.pick.outputs.skip == '0'
        run: |
          mkdir -p /tmp/office-agent
          bash agents/open_pr.sh "${{ steps.pick.outputs.key }}" "${{ steps.pick.outputs.owner }}" "${{ steps.pick.outputs.title }}"
      - name: Merge it if every gate passes
        if: steps.pr.outputs.pr != ''
        run: python3 agents/merge_gate.py --pr "${{ steps.pr.outputs.pr }}" --no-deploy

  publish:
    needs: work
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Redeploy the site once with everything merged
        run: gh workflow run deploy.yml -R "${{ github.repository }}" --ref main
