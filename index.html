<style>
:root{
  /* A 1950s American sports annual: aged stock, banner red, foil gold,
     and navy. The probability bar takes the cover's own three colours rather
     than a home / away code: the year band's yellow for the side the model
     favours, the jacket grey for the draw, the banner red for the side it
     expects to lose. Position still says which side is home. */
  --ink:#1a1511;
  --ink-2:#4b4038;
  --mute:#6e6355;        /* 4.8:1 on paper; was #867a6b at 3.4:1, too faint for small labels */
  --mute-ink:#6e6355;
  /* One column layout for every row in every sport, so the bar sits in the
     same place at the same width whether the row is football, tennis, NFL,
     basketball, baseball or rugby. The narrow middle column is football's
     predicted score; the two-sided sports keep it empty to stay aligned. */
  --row-cols:32px 132px minmax(0,1fr) 248px 72px minmax(0,1fr) 88px;
  --rule:#c6b89e;
  --rule-soft:#ded3bd;
  --paper:#f0e8d6;
  --surface:#fbf6ea;

  --home:#1f3b5c;
  --home-soft:#d3dae4;
  --draw:#a8801f;
  --draw-soft:#eee0c0;
  --away:#96271d;
  --away-soft:#eed6d1;
  --gold:#b08a2e;

  --yellow:#f4d21c;      /* the year band */
  --yellow-mid:#f8e27a;
  --yellow-soft:#fbf0bf;
  --red:#c8102e;         /* the star band and stat panel */
  --grey:#a4a9ad;        /* the jacket */
  --cover-ink:#100e0c;

  --rail:6px;

  --f-display:'Anton','Barlow Semi Condensed',sans-serif;
  --f-ui:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f-ui);
  font-size:15px;
  line-height:1.4;
  padding:0 20px 80px;
  font-variant-numeric:tabular-nums;
}
.wrap{max-width:1180px;margin:0 auto}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- masthead ----------
   A close restaging of the Grays Sports Almanac jacket. The details that carry
   the resemblance, in order of how much they matter:
     - the two title words are the full width of the cover, not centred text
     - they are stretched horizontally and set solid, so they nearly touch
     - the black outline is heavy and there is a hard offset shadow under it
     - the star banner and year band bleed edge to edge inside a grey margin
     - the lower panel is red, standing in for the sports artwork
   Getting the words to fill the width is what actually makes it read as the
   cover: the reference has almost no air anywhere. */
header{padding:18px 0 0}
.cover{
  position:relative;overflow:hidden;
  background:#9ba1a6;border:1px solid #100e0c;
  /* flush: the star banner, year band and stat panel run edge to edge;
     only the title block sits on the grey */
  padding:0;text-align:center;
}
.starband{
  background:#c8102e;border:0;border-bottom:1px solid #100e0c;
  padding:3px 12px;display:flex;align-items:center;justify-content:space-between;
}
.starband b{
  font-family:var(--f-display);font-weight:400;color:#fff;
  font-size:clamp(15px,3.2vw,27px);letter-spacing:clamp(.16em,1.1vw,.34em);
  text-transform:uppercase;line-height:1.1;padding-left:.28em;
  text-shadow:2px 0 0 #100e0c,-2px 0 0 #100e0c,0 2px 0 #100e0c,0 -2px 0 #100e0c;
}
.starband i{
  color:#fff;font-style:normal;letter-spacing:.18em;
  font-size:clamp(9px,1.6vw,15px);
}
/* The title block gets its own width rather than running the full span of the
   cover. The reference for this thing is a portrait book jacket; the page is a
   wide landscape band, and filling 1180px with two words means either type
   three hundred pixels tall or letterforms stretched out of shape. Capping the
   block keeps the stack in book proportions and the type at a sane size. */
h1{margin:clamp(14px,2.4vw,26px) auto 0;line-height:.82;max-width:min(100%,760px)}
h1 span{
  display:block;font-family:var(--f-display);font-weight:400;text-transform:uppercase;
  letter-spacing:-.012em;white-space:nowrap;
  /* --fit is measured and set by fitWordmark() once the display face has
     loaded. The 1.05 fallback is what the CSS used to hard-code, so with no
     JS the wordmark behaves exactly as it did before. */
  transform:scaleX(var(--fit,1.05));transform-origin:center;
}
/* Three lines, three faces. The identity comes from the letterforms rather
   than from effects piled on a single face:

     SPORTS     Bevan, a heavy slab with crisp square serifs
     ALMANAC    Archivo Black, wide and heavy with no serifs at all
     strapline  Oswald, condensed and widely letterspaced

   Both title words are fitted to the full width of the cover, so two faces of
   very different natural width still stack flush. That is the fitting routine
   earning its keep rather than being a nicety.

   On effects: the stroke is gone. What is left is ONE hard offset per title
   line, no blur, and it is not decoration. Measured on the cover's grey
   ground the red reads 1.82:1 and the white 2.61:1, both under the 3:1
   minimum for large text, so with no edge at all they are genuinely hard to
   read rather than merely less pretty. A single offset is the cheapest thing
   that fixes that and stays crisp. Ink measures 7.38:1, which is why the
   strapline carries no shadow whatsoever.

   If you want the titles clean too, the ground has to go dark: set .cover's
   background to #14100c and both offsets can come off. */
h1 .a,h1 .b{font-size:clamp(34px,8.9vw,88px)}
h1 .a{
  font-family:'Bevan','Alfa Slab One',var(--f-display);
  color:#e0202c;text-shadow:.036em .036em 0 #100e0c;
}
h1 .b{
  font-family:'Archivo Black','Anton',var(--f-display);
  color:#fff;letter-spacing:-.035em;
  /* set in em so the gap holds its proportion at every size, rather than
     opening up on desktop and closing on a phone */
  margin-top:.07em;
  text-shadow:.05em .05em 0 #100e0c;
}
     
.cover .sub{
  font-family:'Oswald',var(--f-ui);font-weight:600;color:#100e0c;
  font-size:clamp(11px,2.4vw,18px);letter-spacing:.17em;text-transform:uppercase;
  margin-top:8px;text-align:center;
}
.cover .yr{margin-top:clamp(10px,1.6vw,16px);background:#100e0c;padding:2px 0;text-align:center}
.cover .yr b{
  font-family:var(--f-display);font-weight:400;font-style:italic;color:#f4d21c;
  font-size:clamp(20px,4.8vw,40px);letter-spacing:.01em;
  text-shadow:3px 3px 0 rgba(0,0,0,.5);
}
/* the red panel stands in for the cover artwork, and carries the numbers */
.meta{
  display:flex;gap:0;flex-wrap:wrap;
  background:#c8102e;border:0;
  position:relative;overflow:hidden;
}
.meta div{
  flex:1 1 0;min-width:100px;padding:6px 9px;text-align:left;
  border-right:1px solid rgba(255,255,255,.28);
}
.meta div:last-child{border-right:0}
/* the last stat cell (the corner flash is .meta's final child) stops short of the yellow corner */
.meta > div:nth-last-child(2){padding-right:96px}
@media (max-width:700px){ .meta > div:nth-last-child(2){padding-right:9px} }
.meta b{font-family:var(--f-num);font-weight:600;font-size:14.5px;color:#fff;display:block;letter-spacing:-.02em}
.meta span{display:block;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:700;margin-bottom:2px}
.meta small{font-family:var(--f-num);font-size:10.5px;color:rgba(255,255,255,.72)}
.meta .good b{color:#f4d21c}
.meta .bad b{color:#ffd9d9}
.flash{
  position:absolute;right:-66px;bottom:-8px;width:240px;z-index:3;
  background:#f4d21c;border-top:1px solid #100e0c;border-bottom:1px solid #100e0c;
  transform:rotate(-30deg);padding:5px 0;text-align:center;pointer-events:none;
}
.flash span{
  font-family:var(--f-ui);font-weight:700;font-size:8.5px;letter-spacing:.01em;
  text-transform:uppercase;color:#100e0c;line-height:1.3;display:block;white-space:nowrap;
}
@media (max-width:700px){ .flash{display:none} }

/* ---------- honesty strip ---------- */
.note{
  margin-top:12px;padding:9px 13px;border-left:var(--rail) solid var(--draw);
  background:var(--draw-soft);font-size:12.5px;color:#4a3712;max-width:100ch;line-height:1.5;
}
.note:empty{display:none}
.note.stale{border-left-color:var(--away);background:var(--away-soft);color:#5e1e2e}
.record{
  margin-top:16px;padding:13px 15px;background:var(--surface);
  border:1px solid var(--rule);display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end;
}
.record h3{
  font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mute);width:100%;margin-bottom:-4px;
}
.record div span{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:600}
.record div b{display:block;font-family:var(--f-num);font-size:17px;font-weight:600;letter-spacing:-.03em}
.record div small{font-family:var(--f-num);font-size:11px;color:var(--mute);font-weight:400}
.record .beat b{color:var(--home)}
.record .lose b{color:var(--away)}
.note b{font-weight:700}

/* ---------- the daily list ----------
   The site's headline: only the fixtures obvious enough to serve on their
   own. The rule is stated in full above the list, because a short list is
   only worth trusting if the reader can see what kept everything else off it. */
/* ---------- ledes: a headline, one line of why, the rest behind a toggle ---------- */
.lede{margin-top:18px;max-width:92ch}
.lede h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,2.6vw,30px);
  letter-spacing:.01em;text-transform:uppercase;line-height:1.05;color:var(--ink)}
.lede p{margin-top:6px;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.lede b{color:var(--ink)}
details.how{margin-top:8px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
details.how summary{cursor:pointer;font-weight:700;color:var(--home);list-style:none;
  display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"+";font-family:var(--f-num);font-weight:600;
  width:16px;height:16px;display:inline-grid;place-items:center;border:1px solid var(--home);border-radius:50%;font-size:12px;line-height:1}
details.how[open] summary::before{content:"–"}
details.how p{margin-top:8px;padding-left:22px}
.list-rule{
  margin-top:16px;padding:12px 15px;background:var(--surface);border:1px solid var(--rule);
  border-left:1px solid var(--ink);font-size:14px;line-height:1.55;max-width:100ch;color:var(--ink-2);
}
.list-rule b{color:var(--ink)}
.ko-local{font-family:var(--f-ui);font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.list-past{margin-top:16px;border:1px solid var(--rule);background:var(--surface)}
.slip-box{margin:16px 0 20px;border:1px solid var(--ink);background:var(--surface);padding:14px 15px}
.slip-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.slip-head h3{font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.slip-head p{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.slip-run{font-family:var(--f-ui);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--ink);color:var(--yellow);border:0;padding:10px 18px;cursor:pointer;flex:none}
.slip-total{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);margin-top:14px;border:1px solid var(--rule)}
.slip-total>div{background:var(--surface);padding:10px 12px}
.slip-total span{display:block;font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.slip-total b{display:block;font-family:var(--f-num);font-size:24px;margin:2px 0}
.slip-total small,.slip small{display:block;font-size:12px;color:var(--mute);line-height:1.4}
.slip-note{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin:12px 0}
.slip{width:100%;border-collapse:collapse;font-size:14px}
.slip th{font-family:var(--f-ui);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:left;padding:6px 6px;border-bottom:1px solid var(--ink)}
.slip td{padding:8px 6px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
.slip .n{text-align:right;font-family:var(--f-num);white-space:nowrap}
.slip .verdict{font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px}
.v-strong .verdict{background:var(--ink);color:var(--yellow)}
.v-reserve .verdict{border:1px solid var(--ink);color:var(--ink)}
.v-wary .verdict{background:var(--red);color:#fff}
@media (max-width:560px){.slip-total{grid-template-columns:1fr}.slip-total b{font-size:20px}
  .slip thead{display:none}
  .slip tr{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--rule-soft)}
  .slip td{border:0;padding:0}
  .slip td:last-child{grid-column:1/-1}
  .slip td:last-child small{display:inline;margin-left:6px}}
.reserve-head{padding:14px 12px 8px;margin-top:6px;border-top:1px solid var(--ink);
  font-family:var(--f-ui);font-size:13px;color:var(--mute);line-height:1.45}
.reserve-head b{color:var(--ink);text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.list-past h3{
  font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mute);padding:10px 15px 6px;
}
.list-past li{
  list-style:none;display:grid;grid-template-columns:5.5em 1.4em 1fr auto;gap:8px;
  padding:6px 15px;border-top:1px solid var(--rule-soft);font-size:13.5px;align-items:baseline;
}
.list-past .d{font-family:var(--f-num);font-size:12px;color:var(--mute)}
.list-past .ok{color:var(--home);font-weight:700}
.list-past .no{color:var(--away);font-weight:700}
.list-past .sc{font-family:var(--f-num);font-size:12px;color:var(--ink-2);white-space:nowrap}

/* ---------- controls ---------- */
.controls{
  position:sticky;top:47px;z-index:20;background:var(--paper);
  padding:10px 0 9px;border-bottom:1px solid var(--ink);
  display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;
}
/* the controls belong to the fixture board, so they go away with it, and a
   display rule on the class would otherwise beat the hidden attribute */
.controls[hidden]{display:none}
.controls > div{min-width:0}
.chips{max-width:none}
.comp-toggle{font-family:var(--f-ui);font-size:13px;display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--rule);background:transparent;color:var(--ink);padding:5px 10px;
  cursor:pointer;border-radius:2px;min-height:32px;max-width:260px}
.comp-toggle b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-toggle .caret{color:var(--mute);transition:transform .12s}
.comp-toggle[aria-expanded="true"] .caret{transform:rotate(180deg)}
.comp-panel{flex-basis:100%;padding-top:8px;border-top:1px solid var(--rule-soft);
  max-height:46vh;overflow-y:auto}
.comp-panel input{width:100%;max-width:340px;font:inherit;font-size:14px;padding:6px 9px;
  border:1px solid var(--rule);background:var(--surface);color:var(--ink);margin-bottom:8px;border-radius:2px}
button.chip[hidden]{display:none}
.chips{display:flex;gap:4px;flex-wrap:wrap}
button.chip{
  font-family:var(--f-ui);font-size:12.5px;font-weight:600;letter-spacing:.04em;
  border:1px solid var(--rule);background:transparent;color:var(--ink-2);
  padding:4px 8px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;gap:5px;line-height:1.3;
  transition:background .12s,color .12s,border-color .12s;
}
button.chip .flg{box-shadow:0 0 0 .5px rgba(26,21,17,.3)}
button.chip:hover{border-color:var(--ink-2)}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--yellow);border-color:var(--ink)}
button.chip:focus-visible{outline:2px solid var(--home);outline-offset:2px}
.seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg button{
  font-family:var(--f-ui);font-size:12.5px;font-weight:600;border:0;background:transparent;
  padding:6px 10px;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--rule);
  white-space:nowrap;
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--yellow)}
.seg button:focus-visible{outline:2px solid var(--home);outline-offset:-2px}
.ctl-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* ---------- day ---------- */
.day{margin-top:24px}
/* Each day opens with a slice of the cover's star band, so the colour of the
   jacket carries down the page instead of stopping at the masthead. */
.day-head{
  display:flex;align-items:baseline;gap:12px;padding:6px 12px 5px;
  background:var(--red);border:1px solid var(--cover-ink);
}
.day-head h2{
  font-family:var(--f-display);font-weight:400;font-size:17px;color:#fff;
  letter-spacing:.04em;text-transform:uppercase;
  text-shadow:1.5px 1.5px 0 var(--cover-ink);
}
.day-head .count{font-family:var(--f-num);font-size:12px;color:var(--yellow);margin-left:auto;font-weight:600;white-space:nowrap}

/* ---------- column ruler ---------- */
.ruler{
  display:grid;grid-template-columns:var(--row-cols);
  /* left padding = the row's own padding plus the 30px bookmark star that
     sits in front of every row, so each label sits over its column */
  gap:12px;align-items:center;padding:8px 10px 6px 40px;
  background:var(--paper);border-bottom:1px solid var(--rule);
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);font-weight:600;
}
.ruler .r-bar,.rruler .r-bar{display:flex;justify-content:space-between}

/* ---------- fixture row ---------- */
/* Row states, each carrying exactly one meaning:
     default   parchment
     alternate a half-tone band, so the eye can track across a wide row
     unrated   faded, the model has no rating for a side
     celtic    amber rail, the model is working blind
     noread    muted type, the number is close to a guess
   Nothing else changes the background, so a tint always means something. */
.row{
  display:grid;grid-template-columns:var(--row-cols);
  gap:12px;align-items:center;
  background:var(--surface);border-bottom:1px solid var(--rule-soft);
  padding:12px 10px;transition:background .15s ease;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;
  font-family:var(--f-ui);font-size:15px;color:var(--ink);cursor:pointer;
}
.row:hover{background:var(--yellow-soft)}
.row:focus-visible{outline:2px solid var(--home);outline-offset:-2px}
.row[aria-expanded="true"]{background:#f3ead6;box-shadow:inset 0 0 0 1px var(--rule)}

/* A row plus its bookmark toggle, side by side. The star sits outside the
   row's own grid entirely — a sibling, not a child — so it never has to
   know about, or risk breaking, that grid's desktop and mobile layouts. */
.row-line{display:flex;align-items:stretch}
.row-line .row{border-left:0}
.star-btn{
  flex:0 0 30px;width:30px;border:0;border-bottom:1px solid var(--rule-soft);
  background:var(--surface);color:var(--mute-ink,var(--mute));cursor:pointer;
  font-size:16px;line-height:1;padding:0;
}
.star-btn:hover{background:var(--yellow-soft);color:var(--brand-red,#b4222b)}
.star-btn[aria-pressed="true"]{color:var(--brand-red,#b4222b)}
.star-btn:focus-visible{outline:2px solid var(--home);outline-offset:-2px}
.row-line:nth-child(odd) .star-btn{background:var(--surface)}

/* Research links inside an expanded fixture: a fast way out to Google for
   the fixture itself or the competition table, rather than the model
   pretending to be the last word on either. */
.research{display:flex;gap:16px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:12px;
  border-bottom:1px solid var(--rule)}
.research a{font-family:var(--f-ui);font-size:13.5px;font-weight:600;color:var(--home);
  text-decoration:none}
.research a:hover{text-decoration:underline}

.rank{font-family:var(--f-num);font-size:12px;color:var(--mute);font-weight:500}
/* The row number carries the model's read, not the row's position, so it
   means the same thing under every sort and every filter. Any read is a
   yellow chip; Strong is the year band itself, yellow on ink. No chip, no read. */
.rank.t1,.rank.t2,.rank.t3{
  color:var(--cover-ink);font-weight:700;border-radius:2px;
  box-shadow:inset 0 0 0 1px var(--cover-ink);
  text-align:center;padding:2px 0;justify-self:start;min-width:24px;
}
.rank.t3{background:var(--cover-ink);color:var(--yellow)}
.rank.t2{background:var(--yellow)}
.rank.t1{background:var(--yellow-mid)}
/* Kick-off and competition, always visible. The time is the reader's own
   local time (build.py stores one UTC instant per fixture). */
.ko{min-width:0;line-height:1.2}
.ko time{font-family:var(--f-num);font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.ko .comp{display:flex;align-items:center;gap:5px;margin-top:3px;min-width:0;
  font-family:var(--f-ui);font-size:10px;letter-spacing:.045em;text-transform:uppercase;
  color:var(--ink-2);font-weight:700}
.ko .comp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ko .comp .flg{width:13px;height:9px}

.side{min-width:0}
.side.away{text-align:right}
.club{
  font-weight:600;font-size:16.5px;letter-spacing:-.005em;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stat{font-family:var(--f-num);font-size:11.5px;color:var(--mute);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.stat i{font-style:normal}
.stat .pos{color:var(--home)}
.stat .neg{color:var(--away)}

/* ---------- the bar: this is the whole point of the page ---------- */
.bar{position:relative;height:28px;display:flex;background:#f0f2f0;
  box-shadow:inset 0 0 0 1px rgba(16,14,12,.18)}
.bar i{display:block;height:100%;position:relative;overflow:hidden}
/* Colour follows the model's verdict, not the venue: yellow for the side it
   favours, grey for the draw, red for the side it expects to lose. Labels are
   ink on yellow and grey, white on red, all above 4.5:1. */
.bar .win{background:var(--yellow)}
.bar .draw{background:var(--grey)}
.bar .lose{background:var(--red)}
.bar .win b,.bar .draw b{color:var(--cover-ink)}
.bar b{
  font-family:var(--f-num);font-size:12px;font-weight:600;color:#fff;
  position:absolute;top:50%;transform:translateY(-50%);left:6px;
  letter-spacing:-.03em;
}
.bar .a b{left:auto;right:6px}
.bar .d b{left:50%;transform:translate(-50%,-50%)}
/* shared reference line: any home block reaching past it is odds-on */
.bar::after{
  content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;
  background:var(--ink);opacity:.5;
}
.conf{font-family:var(--f-num);font-size:17px;font-weight:600;text-align:right;line-height:1.1}
.tier{
  display:block;font-family:var(--f-ui);font-size:9.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;margin-top:2px;
}
.tier.t1,.tier.t2,.tier.t3{
  color:var(--cover-ink);display:table;margin-left:auto;
  padding:1px 5px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--cover-ink);
}
.tier.t3{background:var(--cover-ink);color:var(--yellow)}
.tier.t2{background:var(--yellow)}
.tier.t1{background:var(--yellow-mid)}
.tier.t0{color:var(--mute)}
.row.noread .club{font-weight:500;color:var(--ink-2)}
.row.noread .bar{opacity:.62}
.row.noread .conf{color:var(--mute);font-weight:500}
.readbar{
  margin:9px 0 0;font-size:12.5px;color:var(--ink-2);max-width:100ch;line-height:1.5;
}
.readbar b{font-family:var(--f-num);color:var(--ink)}
.readbar details b{font-family:var(--f-ui)}
.boards{display:flex;gap:0;border:1px solid var(--ink);border-radius:2px;overflow:hidden;margin-top:2px}
.boards button{
  font-family:var(--f-ui);font-size:13.5px;font-weight:600;border:0;background:transparent;
  padding:6px 13px;cursor:pointer;color:var(--ink);border-right:1px solid var(--ink);
  white-space:nowrap;
}
.boards button:last-child{border-right:0}
.boards button[aria-pressed="true"]{background:var(--ink);color:var(--yellow)}
.boards button:focus-visible{outline:2px solid var(--home);outline-offset:-3px}
.btts{font-family:var(--f-num);font-size:14px;font-weight:600;text-align:right}
.btts small{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:400;font-family:var(--f-ui)}
.row.bttsmode{grid-template-columns:var(--row-cols)}
.conf small{display:block;font-size:9.5px;letter-spacing:.06em;color:var(--mute);font-weight:400;text-transform:uppercase}

/* ---------- top-level views ----------
   Two boards that answer different questions: what is coming, and how the last
   one went. They sit above the controls because switching between them changes
   what the controls even mean. Styled as a band rather than as tabs, so it
   reads as part of the cover rather than as browser chrome. */
.views{
  display:flex;margin-top:0;border:1px solid #100e0c;border-top:0;
  background:#100e0c;
}
/* The top-level nav sits flush under the red band above it, so no top
   border is wanted there — but the same .views class is reused for the
   standalone "How it went" sport switcher, which has nothing above it and
   needs its stroke closed on all four sides or it reads as unfinished. */
.views.standalone{border-top:1px solid #100e0c}
.views button{
  flex:1 1 0;font-family:var(--f-display);font-weight:400;font-size:clamp(13px,2.6vw,18px);
  letter-spacing:.08em;text-transform:uppercase;
  border:0;background:#100e0c;color:var(--yellow);padding:7px 10px;cursor:pointer;
  border-right:1px solid #3a342e;min-height:44px;
}
.views button:last-child{border-right:0}
/* nine boards: three to a row on a phone rather than nine slivers */
#views{flex-wrap:wrap;position:sticky;top:0;z-index:40;box-shadow:0 6px 14px -10px rgba(16,14,12,.55)}
/* On a phone the nav is three rows tall; pinned, it would eat a third of
   the screen. There it scrolls away, and so do the football filters. */
@media (max-width:860px){ #views{position:static;box-shadow:none} .controls{position:static} }
@media (max-width:700px){ #views button{flex:1 1 30%;border-bottom:1px solid #3a342e} }
.views button[aria-pressed="true"]{
  background:var(--yellow);color:#100e0c;
}
.views button:focus-visible{outline:2px solid #f4d21c;outline-offset:-4px}

/* ---------- tennis ----------
   Deliberately reuses .row, .rank, .club, .stat, .bar, .tier, .conf, .ko,
   .day-head and .ruler as-is rather than a parallel .tXXX set — the first
   build had its own near-identical classes, which is exactly how a "Strong"
   tier ended up blue instead of the yellow-on-black every other Strong tag
   on the site uses. Same classes means the same rules apply automatically;
   there's nothing left to drift out of sync with football. .trow only
   overrides the column count, since there's no score/xG slot here. */
.trow .comp span{max-width:132px}
.tour-chip{
  font-family:var(--f-display);font-weight:400;font-size:9px;letter-spacing:.03em;
  background:var(--ink);color:var(--paper);padding:1px 5px;border-radius:2px;
  flex:0 0 auto;
}
/* ---------- results review ---------- */
.dayseg{display:flex;flex-wrap:wrap;gap:4px}
.dayseg button{
  font-family:var(--f-ui);font-size:12.5px;font-weight:600;letter-spacing:.03em;
  border:1px solid var(--rule);background:transparent;color:var(--ink-2);
  padding:4px 9px;cursor:pointer;border-radius:2px;line-height:1.3;white-space:nowrap;
}
.dayseg button[aria-pressed="true"]{background:var(--ink);color:var(--yellow);border-color:var(--ink)}
.dayseg button:focus-visible{outline:2px solid var(--home);outline-offset:2px}
.dayseg button i{font-style:normal;font-family:var(--f-num);opacity:.75;margin-left:5px}

.scoreline{
  display:flex;gap:0;flex-wrap:wrap;margin-top:14px;
  background:var(--surface);border:1px solid var(--rule);
}
.scoreline div{
  flex:1 1 0;min-width:118px;padding:9px 13px;border-right:1px solid var(--rule-soft);
}
.scoreline div:last-child{border-right:0}
.scoreline span{
  display:block;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--mute);font-weight:700;margin-bottom:3px;
}
.scoreline b{display:block;font-family:var(--f-num);font-size:21px;font-weight:600;letter-spacing:-.03em;line-height:1}
.scoreline small{display:block;font-family:var(--f-num);font-size:11px;color:var(--mute);margin-top:3px}
.scoreline .good b{color:#2f6b52}
.scoreline .bad b{color:var(--away)}

.rruler,.rrow{
  display:grid;grid-template-columns:46px 1fr 176px 52px 52px 1fr 68px 26px;
  gap:10px;align-items:center;
}
.rruler{
  padding:7px 8px 5px;border-bottom:1px solid var(--rule);
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);font-weight:600;
}
.rrow{
  background:var(--surface);border-bottom:1px solid var(--rule-soft);
  padding:9px 8px;font-size:15px;
}
.rrow.alt{background:#f6efdc}
.rrow.celtic{box-shadow:inset 3px 0 0 var(--draw)}
.rrow .sc{font-family:var(--f-num);font-size:15px;font-weight:600;text-align:center;letter-spacing:-.03em}
.rrow .sc.pred{font-size:13px;font-weight:400;color:var(--mute)}
.rrow .lg{font-family:var(--f-num);font-size:11px;color:var(--mute);font-weight:500}
.mark{
  font-family:var(--f-ui);font-weight:700;font-size:15px;text-align:center;line-height:1;
}
.mark.ok{color:#2f6b52}
.mark.no{color:var(--away)}
.rrow.miss .club{color:var(--ink-2);font-weight:500}
.rrow.miss .bar{opacity:.55}

/* results rows (tennis, other sports): prediction beside the result, one match per row */
.xruler,.xrow{display:grid;grid-template-columns:46px 1.4fr 1fr 1.3fr 70px 26px;gap:10px;align-items:center}
.xruler{
  padding:7px 8px 5px;border-bottom:1px solid var(--rule);
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);font-weight:600;
}
.xrow{background:var(--surface);border-bottom:1px solid var(--rule-soft);padding:9px 8px;font-size:14.5px}
.xrow.alt{background:#f6efdc}
.xrow .lg{font-family:var(--f-num);font-size:11px;color:var(--mute);font-weight:500}
.xrow .tm b{font-weight:600}
.xrow small{display:block;font-family:var(--f-num);font-size:11px;color:var(--mute);margin-top:2px}
.xrow .tp span,.xrow .tw span{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700}
.xrow .tp em{font-style:normal;font-family:var(--f-num);font-size:12px;color:var(--ink-2)}
.xrow .tw{font-weight:600}
.xrow.miss .tw{color:var(--away)}
.xrow .conf{text-align:right}
@media (max-width:700px){
  .xruler{display:none}
  .xrow{grid-template-columns:1fr 1fr 26px;grid-template-areas:"tm tm mark" "tp tw mark" "lg conf conf";row-gap:6px}
  .xrow .tm{grid-area:tm}.xrow .tp{grid-area:tp}.xrow .tw{grid-area:tw}
  .xrow .lg{grid-area:lg}.xrow .conf{grid-area:conf}.xrow .mark{grid-area:mark}
}

.ladder{margin-top:26px}
.ladder table{border-collapse:collapse;width:100%;max-width:94ch;font-family:var(--f-num);font-size:13px}
.ladder th{
  text-align:right;font-family:var(--f-ui);font-weight:700;color:var(--mute);
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:0 8px 5px 0;
  border-bottom:1px solid var(--rule);
}
.ladder th:first-child{text-align:left}
.ladder td{text-align:right;padding:6px 8px 6px 0;border-bottom:1px solid var(--rule-soft)}
.ladder td:first-child{
  text-align:left;font-family:var(--f-ui);font-size:14px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;
}
.ladder td.thin{font-weight:400;color:var(--mute);font-family:var(--f-num);font-size:12px;
  letter-spacing:0;text-transform:none}
.ladder .t3 td:first-child{color:var(--cover-ink);background:linear-gradient(transparent 55%,var(--yellow) 55%)}
.ladder .t2 td:first-child{color:var(--cover-ink);background:linear-gradient(transparent 55%,var(--yellow) 55%)}
.ladder .t1 td:first-child{color:var(--cover-ink);background:linear-gradient(transparent 55%,var(--yellow-mid) 55%)}
.ladder .t0 td:first-child{color:var(--mute)}
.prose{max-width:78ch;font-size:14px;line-height:1.6;color:var(--ink-2);margin-top:12px}
.prose p{margin-top:11px}
.prose b{color:var(--ink)}
.prose em{font-style:normal;font-family:var(--f-num);font-size:13px;color:var(--ink)}
.sect{
  margin-top:34px;padding-bottom:6px;border-bottom:1px solid var(--ink);
  font-family:var(--f-display);font-weight:400;font-size:16px;
  letter-spacing:.01em;text-transform:uppercase;
}

/* ---------- expanded detail ---------- */
.detail{background:#f3ead6;border-bottom:1px solid var(--ink);padding:16px 18px 18px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.detail h3{
  font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mute);margin-bottom:8px;
}
table.sheet{border-collapse:collapse;width:100%;font-family:var(--f-num);font-size:12px}
table.sheet th{
  text-align:right;font-weight:500;color:var(--mute);padding:2px 7px 2px 0;
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;
}
table.sheet th:first-child{text-align:left}
table.sheet td{text-align:right;padding:3px 7px 3px 0;border-top:1px solid var(--rule-soft)}
table.sheet td:first-child{text-align:left;font-family:var(--f-ui);font-size:13.5px;font-weight:600}
.why{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);
  font-size:13.5px;color:var(--ink-2);max-width:82ch;
}
.why em{font-style:normal;font-family:var(--f-num);font-size:12.5px;color:var(--ink)}
.flag{
  display:inline-block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;padding:2px 6px;border-radius:2px;margin-right:6px;
}
.flag.carry{background:var(--draw-soft);color:#5f4715}
.flag.live{background:var(--home-soft);color:#0d443f}


/* tested accuracy under the confidence number: what calls at this level
   actually did on games the model never saw */
.stat .wr{font-weight:700;color:var(--ink)}
.conf .acc{display:block;font-family:var(--f-num);font-size:10.5px;font-weight:500;color:var(--mute);
  letter-spacing:-.01em;margin-top:4px;white-space:nowrap}
table.sheet td.rW{color:#2f6b52;font-weight:700}
table.sheet td.rL{color:var(--away);font-weight:700}
table.sheet td.rD{color:var(--mute);font-weight:700}
.row.unrated .club{color:var(--mute);font-weight:500}
.row.unrated .bar{opacity:.38}
.row.unrated .conf{color:var(--mute);font-weight:500}
.row.unrated .stat{opacity:.8}
.stat.none{color:var(--away);opacity:.85}
/* Only ever rendered inside a cup fixture's row — see sideStats(). Small
   and muted rather than colour-coded like the tier badges, since it's
   identifying information, not a verdict the way Strong/Firm/Lean are. */
.league-tag{
  display:block;font-family:var(--f-ui);font-size:9.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);
  background:var(--rule-soft);padding:1px 5px;border-radius:2px;
  margin-top:2px;white-space:nowrap;width:fit-content;
}
.league-tag.none{color:var(--mute);background:transparent;font-weight:500;
  text-transform:none;letter-spacing:normal;padding:0}
.sheet-league{font-weight:400;color:var(--mute);font-size:.85em}
.flg{
  width:15px;height:10.3px;flex:0 0 auto;border-radius:1px;
  box-shadow:0 0 0 .5px rgba(20,24,29,.28);vertical-align:baseline;
}
.club{display:flex;align-items:center;gap:7px}
.side.away .club{flex-direction:row-reverse}
.club span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xg{font-family:var(--f-num);font-size:12.5px;text-align:center;color:var(--ink-2);white-space:nowrap}
.xg small{display:block;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-family:var(--f-ui);font-weight:600}
.xg b{font-weight:600;color:var(--ink)}
.flag.unrated{background:var(--away-soft);color:#6a1f31}
.flag.manual{background:#d8dced;color:#2b3560}
.flag.celtic{background:var(--draw-soft);color:#5f4715}
.flag.out{background:var(--away-soft);color:#6a1f31}
.outlist{margin-top:8px;font-family:var(--f-num);font-size:11.5px;color:var(--ink-2);line-height:1.65}
.outlist i{font-style:normal;color:var(--away)}
.outlist span{color:var(--mute)}
.mini-out{color:var(--away);font-family:var(--f-ui);font-weight:600}
/* Alternate rows carry a faint tint, as a printed results table does. It is
   there to help the eye track across a wide row, so it must be weak enough to
   read as texture rather than as meaning. Every state that DOES mean something
   (flagged, unrated, no read) is signalled by rail, weight or opacity instead,
   so nothing competes with it. */
.row.alt{background:#f6efe0}
.row.alt{background:#f6efdc}
.row.celtic{box-shadow:inset 3px 0 0 var(--draw)}
.row.unrated{opacity:.72}
.row.celtic.alt{background:#f6efe0}
.row:hover,.row.alt:hover{background:#fdf6d8}
/* The bookmakers' number for the outcome the model favours, sitting under
   that outcome's segment of the bar so it reads as belonging to it. */
.barcell{min-width:0}
.mkt{
  margin-top:4px;font-family:var(--f-num);font-size:10.5px;color:var(--mute-ink,#6e6355);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;
}
.mkt b{color:var(--ink);font-weight:600}
.mkt.h{text-align:left}.mkt.d{text-align:center}.mkt.a{text-align:right}
.mkt .val{background:var(--cover-ink);color:var(--yellow);padding:0 4px;border-radius:2px;font-weight:700}
.mktgrid{width:100%;border-collapse:collapse;font-family:var(--f-num);font-size:12.5px;margin:4px 0 2px}
.mktgrid th{font-family:var(--f-ui);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mute);font-weight:700;text-align:right;padding:3px 6px}
.mktgrid th:first-child,.mktgrid td:first-child{text-align:left;padding-left:0}
.mktgrid td{text-align:right;padding:3px 6px;border-top:1px solid var(--rule)}
/* "Show all" at the foot of a capped day */
.more{
  display:block;width:100%;margin-top:0;padding:11px 8px;cursor:pointer;
  font-family:var(--f-ui);font-size:13.5px;font-weight:700;letter-spacing:.04em;
  background:var(--surface);color:var(--cover-ink);border:0;border-bottom:1px solid var(--cover-ink);
  text-align:center;
}
.more:hover{background:var(--yellow-soft)}
.more:focus-visible{outline:2px solid var(--home);outline-offset:-2px}
.more b{font-family:var(--f-num)}
.cl{
  display:inline-block;font-family:var(--f-num);font-size:9.5px;font-weight:600;
  color:var(--draw);border:1px solid var(--draw);border-radius:2px;
  padding:0 3px;line-height:1.35;margin-left:5px;vertical-align:1px;
}
/* A flagged fixture says so in words, under its tier: "CL" meant nothing
   unless you had read the footer. */
.flagged{
  display:block;margin-top:2px;font-family:var(--f-ui);font-size:9.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:#7a5c12;
}
.pred{font-family:var(--f-num);text-align:center;white-space:nowrap;line-height:1.25}
.pred b{display:block;font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.pred small{display:block;font-size:10.5px;color:var(--mute);letter-spacing:-.02em}
.empty{padding:40px 8px;color:var(--mute);font-size:14px}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--mute);max-width:80ch}
footer a{color:var(--ink-2)}
footer p{margin-top:10px;line-height:1.6}
footer b{color:var(--ink-2)}

@media (max-width:600px){
  /* On a 390px phone the masthead cost 611px and the first fixture sat 957px
     down the page. Almost none of that was the cover itself: the brand block
     is 130px of it. The rest was the stat panel wrapping to three rows, two
     stacked blocks of explanatory prose, and a filter row that grows without
     limit as competitions are added. None of the following changes the look
     of the cover. */
  header{padding-top:12px}

  /* The stat panel was taking 199px, more than the cover above it. Trimmed by
     type size and padding rather than by dropping to three columns or a
     scrolling row: both of those either crop or hide the baseline figure, and
     the comparison between the model and the baseline is the one number the
     site exists to make. Nothing here is truncated. */
  .cover{padding:0}
  .cover .sub{margin-top:4px}
  .cover .yr{margin-top:4px}
  .meta div{padding:6px 9px}
  .meta span{font-size:8.5px;letter-spacing:.09em}
  .meta b{font-size:13.5px}
  .meta small{font-size:10px}

  .note{margin-top:9px;padding:8px 11px;font-size:12px}
  .readbar{margin-top:7px;font-size:12px}

  /* The competition chips live in a collapsed panel (#compPanel) now, so
     they wrap there instead of scrolling as one row. */
  .chips{flex-wrap:wrap}
  .chips::-webkit-scrollbar{display:none}
  button.chip{flex:0 0 auto;min-height:36px;padding:5px 9px}

  .controls{gap:8px;padding:8px 0 7px}
  .boards button,.seg button{min-height:40px}
}
@media (max-width:860px){
  .ruler{display:none}
  .meta div{flex:1 1 46%;min-width:0;padding:7px 11px}
  .cover{padding:0}
  .meta small{display:block}
  .seg,.boards{max-width:100%;overflow-x:auto}
  .seg button,.boards button{padding:6px 9px;font-size:12.5px}
  .controls{padding:9px 0 8px;gap:10px}
  .controls > div[style*="margin-left"]{margin-left:0!important;width:100%}
  .rruler{display:none}
  /* the column ruler is gone on narrow screens, so the two scorelines have to
     label themselves or the row is a pair of unexplained numbers */
  .rrow .sc::before{
    display:block;font-family:var(--f-ui);font-size:8.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--mute);font-weight:700;line-height:1.3;
  }
  .rrow .sc.pred::before{content:"Predicted"}
  .rrow .sc.act::before{content:"Final"}
  .rrow{grid-template-columns:1fr 66px 30px;grid-template-areas:
    "home pred mark" "bar bar mark" "away act mark" "lg conf conf";
    row-gap:5px;padding:11px 8px;}
  .rrow .lg{grid-area:lg}
  .rrow .side{grid-area:home}
  .rrow .side.away{grid-area:away;text-align:left}
  .rrow .side.away .club{flex-direction:row}
  .rrow .bar{grid-area:bar;margin:2px 0}
  .rrow .sc.pred{grid-area:pred}
  .rrow .sc.act{grid-area:act}
  .rrow .conf{grid-area:conf;text-align:left}
  .rrow .conf .tier{display:inline;margin-left:6px}
  .rrow .conf .flagged{display:inline;margin-left:6px}
  .rrow .mark{grid-area:mark;align-self:center}
  .scoreline div{flex:1 1 44%;min-width:0}
  .row{grid-template-columns:28px 1fr 62px;grid-template-areas:
    "rank ko ko" "rank home conf" "rank bar conf" "rank away conf" "rank xg xg";
    row-gap:5px;padding:11px 8px;}
  .pred{grid-area:xg;text-align:left}
  .pred b{display:inline;font-size:13.5px}
  .pred small{display:inline;margin-left:6px}
  .rank{grid-area:rank;align-self:start}
  .ko{grid-area:ko;display:flex;align-items:baseline;gap:8px;min-width:0}
  .ko time{font-size:13px}
  .ko .comp{margin-top:0}
  .day-head h2{font-size:15px}
  .day-head{flex-wrap:wrap;row-gap:2px}
  .day-head .count{margin-left:0;width:100%}
  .side{grid-area:home}
  .side.away{grid-area:away;text-align:left}
  .bar{grid-area:bar;margin:2px 0}
  .barcell{grid-area:bar}
  .barcell .bar{margin:2px 0 0}
  .mkt{white-space:normal}
  .side.away .club{flex-direction:row}
  .conf{grid-area:conf;align-self:start}
  .detail-grid{grid-template-columns:1fr;gap:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(function(){
"use strict";
const D = window.__FIXTURE_DATA__;
if(!D || !D.days){
  document.body.innerHTML = '<div class="wrap" style="padding:60px 0;max-width:60ch">'
    + '<h1 style="font-family:var(--f-display);font-size:28px;letter-spacing:-.03em">No fixture data loaded</h1>'
    + '<p style="margin-top:14px;font-size:15px;line-height:1.55">This page expects <code>data.js</code> '
    + 'to sit next to it. Either open <b>dashboard.html</b> instead, which has the data built in, '
    + 'or run <code>python3 build.py</code> and serve the folder:</p>'
    + '<pre style="margin-top:14px;font-family:var(--f-num);font-size:13px;background:#fff;padding:12px;'
    + 'border-left:6px solid var(--draw)">python3 build.py --days 4 --top 50\npython3 -m http.server 8000</pre></div>';
  return;
}
const $ = s => document.querySelector(s);
const pct = x => Math.round(x*100);
const state = { leagues:new Set(), sort:"conf", open:null, board:"win",
                show:"all", expanded:new Set() };
// Which flags the sprite actually carries. Read once, lazily, because flag() is
// called while building the league chips, before this file's later
// declarations have run.
let FLAGS = null;

/* ---------- freshness ----------
   A build is a snapshot with a few days of fixtures in it. If the rebuild does
   not run, the page still holds yesterday's games and will happily show them as
   though they were the slate. Days in the past are dropped at render time and
   an out-of-date build says so, rather than quietly looking wrong. */
/* ---------- wordmark fitting ----------
   The cover only reads right when the two title words run the full width of
   it. That was hard-coded as a 1.05 horizontal stretch on a viewport-sized
   font, which meant the type overflowed its own box above 1024px and fell
   short of it below 480px, and would have been wrong again for anyone whose
   browser never loaded the display face.

   Measuring instead of guessing costs a few lines and is correct at every
   width and in every font. The scale is bounded so a missing face produces
   something slightly off rather than something absurd. */
function textWidth(el){
  const r = document.createRange();
  r.selectNodeContents(el);
  return r.getBoundingClientRect().width;
}

function fitWordmark(){
  const h1 = document.querySelector("header h1");
  const cover = document.querySelector(".cover");
  if(!h1 || !cover) return;
  // the cover's own padding, plus clearance for the hard offset that sits
  // outside each title line's own advance width
  const room = Math.min(cover.clientWidth - 20, h1.clientWidth);
  if(room <= 0) return;

  h1.querySelectorAll("span").forEach(el => {
    // Size first, stretch second. The two title lines are set in different
    // faces now, and Archivo Black is far wider per character than Anton, so
    // fitting on horizontal scale alone would squash one of them out of shape
    // to make the widths agree. Adjusting the size does most of the work at
    // the face's own proportions, and the stretch only takes up the remainder.
    el.style.removeProperty("font-size");
    el.style.setProperty("--fit", 1);
    const base = parseFloat(getComputedStyle(el).fontSize);
    // A Range around the text, not the element's own box. These spans are
    // display:block, so their width is the container's width whatever the
    // type inside is doing, and measuring the box would report a perfect fit
    // at every size while the letters sat at whatever width they liked.
    const natural = textWidth(el);
    if(!base || !natural) return;

    // The ceiling is generous on purpose. Anton is narrow enough to need
    // nearly three times the CSS size to fill the cover, and a tight clamp
    // meant both lines pinned to the ceiling and the wider face then bled out
    // of the box. Each line finds its own size; the stretch afterwards is
    // held near 1 so neither face is visibly distorted to make them agree.
    // Size does most of the fitting, at each face's own proportions, and the
    // stretch takes up whatever is left. The size ceiling is what stops the
    // masthead growing to fill a wide viewport; the stretch bound is what
    // stops a narrow face being pulled out of shape to reach the edge.
    const sized = Math.max(base * 0.4, Math.min(base * 1.9, base * (room / natural)));
    el.style.fontSize = sized.toFixed(2) + "px";

    const after = textWidth(el);
    if(after) el.style.setProperty("--fit",
      Math.max(0.9, Math.min(1.45, room / after)).toFixed(4));
  });
}


/* Runs once now, again when the display face arrives, and on resize. Fonts
   land after first paint, so fitting only on load measures the fallback. */
fitWordmark();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitWordmark);
let fitTimer;
addEventListener("resize", () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fitWordmark, 120);
});

const todayISO = (()=>{ const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); })();

const upcoming = D.days.filter(d => d.date >= todayISO);
const droppedDays = D.days.length - upcoming.length;
const ageHours = (Date.now() - new Date(D.generated).getTime()) / 36e5;
const isStale = ageHours > 30 || upcoming.length === 0;

/* ---------- bookmarks ----------
   Keyed to today's date rather than to a fixture: reading yesterday's
   shortlist back once those games are gone would be worse than showing
   nothing, so the whole list is treated as expired the moment the date
   it was made on has passed, and simply starts empty again. */
const STAR_KEY = "almanac-starred";
function loadStarred(){
  try{
    const raw = localStorage.getItem(STAR_KEY);
    if(!raw) return new Set();
    const obj = JSON.parse(raw);
    return obj && obj.date === todayISO ? new Set(obj.ids) : new Set();
  }catch(e){ return new Set(); }
}
function saveStarred(){
  try{
    localStorage.setItem(STAR_KEY, JSON.stringify({date: todayISO, ids: [...state.starred]}));
  }catch(e){ /* private browsing or storage full: bookmarking just stops persisting */ }
}
state.starred = loadStarred();
function gSearch(q){ return "https://www.google.com/search?q=" + encodeURIComponent(q); }

/* ---------- header ---------- */
const fmtDay = iso => new Date(iso+"T12:00:00").toLocaleDateString("en-GB",
  {weekday:"long", day:"numeric", month:"long"});
const fmtShort = iso => new Date(iso+"T12:00:00").toLocaleDateString("en-GB",
  {day:"numeric", month:"short"});

$("#window").textContent = new Date().getFullYear();
const rangeText = upcoming.length
  ? fmtShort(upcoming[0].date)+" – "+fmtShort(upcoming[upcoming.length-1].date)
  : "none upcoming";

const total = upcoming.reduce((a,d)=>a+d.count,0);
const live  = upcoming.reduce((a,d)=>a+d.games.filter(g=>g.evidence!=="carryover").length,0);
const R = window.__RECORD__;
// The strip covers the whole site, not football alone: this week's window,
// how many picks the Daily List has, how much was priced, and the two live
// records. Read straight off the window globals, because the sports and
// tennis consts further down do not exist yet at this point in the script.
const _SD = window.__SPORTS_DATA__, _TD = window.__TENNIS_DATA__;
const _sportGames = _SD && _SD.sports ? Object.values(_SD.sports).flatMap(sp => sp.games || []) : [];
const _tennis = _TD && _TD.matches ? _TD.matches : [];
const listCount = upcoming.reduce((a,d) => a + d.games.filter(g => g.list).length, 0)
  + _sportGames.filter(g => g.list).length + _tennis.filter(m => m.list).length;

/* ---------- how much of today is actually worth reading ---------- */

function oddsNote(){
  const O = D.odds || {};
  const any = allGames.some(g => g.market);
  if(!any) return "";
  return O.gate
    ? ` Bookmaker prices sit under each bar; a black <b>value</b> tag marks a best price the model
       beats, a test it has passed against closing prices over two seasons.`
    : ` Bookmaker prices sit under each bar for comparison. The model has not yet shown it beats
       them, so nothing is tagged as value.`;
}

function updateReadbar(){
  if(!allGames.length){ readbarEl.innerHTML=""; return; }
  if(state.board === "btts"){
    const n = allGames.filter(g => bttsTier(g).k >= 2).length;
    readbarEl.innerHTML = `<b>${n}</b> of ${allGames.length} fixtures reach 58% for both teams
      to score. Be careful with this board: across last season the model's very best
      both-score calls came in <b>59%</b> of the time against a <b>54%</b> base rate for all
      fixtures. It is a real edge but a thin one, far weaker than the winner board.`;
  } else {
    const n = allGames.filter(g => tier(g).k >= 1).length;
    readbarEl.innerHTML = n === 0
      ? `<b>None</b> of today's ${allGames.length} fixtures clear the threshold where this model
         has historically been worth listening to. That is normal — across last season three
         quarters of all fixtures fell below it.`
      : `<b>${n}</b> of ${allGames.length} fixtures have a confident read, in yellow. Under each
         confidence number is how often calls at that level actually landed in testing. Tap any row
         for the reasoning.
         <details class="how"><summary>Tiers and flags</summary>
         <p><b>Strong</b> (yellow on black), <b>Firm</b> and <b>Lean</b> are confident reads; <b>No read</b>
         is close to guesswork, and <b>Confident only</b> hides those. A row marked <b>flagged</b> is one
         the model is partly blind to (a promoted side, a cross-division cup tie, a club with no prior
         season) and drops one tier.${oddsNote()}</p></details>`;
  }
}
// First run happens beside the first render(), once the tier ladders below
