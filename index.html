/* ---------- how much to trust a number ----------
   A percentage on its own tells a reader nothing: 47% on a three-way market is
   barely above the 33% you would get by guessing. These bands are the model's
   own backtested hit rates across 5,281 fixtures in 2025/26, so the label is a
   measurement rather than a description. Celtic's Law drops a fixture one band,
   because flagged fixtures measurably underperform their quoted confidence. */
const TIERS = [
  {min:0.70, k:3, name:"Strong",  was:"79%"},
  {min:0.62, k:2, name:"Firm",    was:"66%"},
  {min:0.55, k:1, name:"Lean",    was:"61%"},
  {min:0.00, k:0, name:"No read", was:"44%"},
];
/* Both-teams-to-score bands, measured the same way. Note how much flatter they
   are than the winner bands: the very best call is 59% against a 54% base rate.
   That gap is the honest size of the signal. */
const BTTS_TIERS = [
  {min:0.58, k:2, name:"Likely",  was:"59%"},
  {min:0.55, k:1, name:"Leaning", was:"57%"},
  {min:0.50, k:0, name:"Toss-up", was:"53%"},
  {min:0.00, k:0, name:"Unlikely",was:"49%"},
];
function bttsTier(g){
  if(g.unrated) return {min:0, k:0, name:"No read", was:"—"};
  let t = BTTS_TIERS.find(t => g.btts >= t.min);
  if(g.celtic){
    const i = BTTS_TIERS.indexOf(t);
    if(i < BTTS_TIERS.length - 1) t = BTTS_TIERS[i + 1];
  }
  return t;
}

function tier(g){
  // No rating on file means the number is built on a placeholder: no read,
  // however confident it looks. score.py grades it the same way.
  if(g.unrated) return TIERS[TIERS.length - 1];
  let t = TIERS.find(t => g.confidence >= t.min);
  if(g.celtic){
    const i = TIERS.indexOf(t);
    if(i < TIERS.length - 1) t = TIERS[i + 1];
  }
  return t;
}

/* ---------- row rendering ---------- */
/* Every time on the site is UK time (Europe/London, so GMT or BST as the
   date falls), whatever zone the reader's device is set to: Douglas's call,
   30 Sep 2026, so a slate reads against the UK day. build.py stores one UTC
   instant per fixture; a fixture whose source gave no zone keeps the time as
   printed, marked "local" rather than converted with a guess. */
const UK_TZ = "Europe/London";
const koFmt = new Intl.DateTimeFormat("en-GB", {hour:"2-digit", minute:"2-digit", timeZone: UK_TZ});
const koText = g => g.kickoff ? koFmt.format(new Date(g.kickoff))
  : (g.time ? `${g.time} <small class="ko-local" title="The source gave no time zone, so this is the local kick-off time, not UK time">local</small>` : "TBC");
const koKey = g => g.kickoff || (g.date + "T" + (g.time || "99:99"));
const compName = g => g.leagueName || g.short || g.league;

/* "Most confident" puts the model's reads first, strongest tier at the top,
   then by percentage inside each tier. Sorting on the raw number alone put a
   flagged 60% (demoted to No read) above an unflagged 59% (Lean), so the
   numbering and the highlighting told two different stories. */
const rank = {
  conf:  (a,b)=> (tier(b).k - tier(a).k) || (b.confidence - a.confidence),
  btts:  (a,b)=> (bttsTier(b).k - bttsTier(a).k) || (b.btts - a.btts),
  upset: (a,b)=> b.p.a - a.p.a,
  goals: (a,b)=> (b.xg[0]+b.xg[1]) - (a.xg[0]+a.xg[1]),
  time:  (a,b)=> koKey(a).localeCompare(koKey(b)) || b.confidence-a.confidence,
};
// Upsets, Goals and Time are straight orders on one number each.
const sortFns = rank;

/* The flag set is read off the sprite rather than hard-coded, so a competition
   from a country with no flag drawn yet renders without one instead of leaving
   an empty box on every row. Add a symbol to the sprite and it appears. */
function flag(iso, country){
  if(FLAGS === null) FLAGS = new Set(
    [...document.querySelectorAll('symbol[id^="f-"]')].map(s => s.id.slice(2)));
  if(!iso || !FLAGS.has(iso)) return "";
  return `<svg class="flg" role="img" aria-label="${country}"><use href="#f-${iso}"/></svg>`;
}

function sideStats(t, isCup){
  // Only shown for cup ties: in an ordinary league fixture the competition
  // itself already tells you the level, so a repeated badge would be noise.
  // In a cup, sides can come from completely different divisions — this is
  // the "quick scan" version, the row-level equivalent of teamSheet's header.
  const tag = (isCup && t.league)
    ? `<span class="league-tag">${t.league}</span>`
    : (isCup && t.played !== null ? `<span class="league-tag none">no domestic league on file</span>` : "");
  const s = t.now && t.now.P ? t.now : t.last;
  if(!s){
    // An international side has no domestic season table by definition —
    // that's not the same thing as being unrated. t.played is null only
    // for that path (a domestic side always has a played COUNT, even 0),
    // so it's the signal to show the rating itself instead of wrongly
    // claiming there isn't one.
    if(t.played === null && !t.unrated)
      return `${tag}<div class="stat">${t.worldRank ? `<b class="wr">FIFA #${t.worldRank}</b> · ` : ""}att ${t.att.toFixed(2)} · def ${t.def.toFixed(2)}</div>`;
    return `${tag}<div class="stat none">not rated — no season on file</div>`;
  }
  const gd = s.GD>0 ? `<i class="pos">+${s.GD}</i>` : (s.GD<0?`<i class="neg">${s.GD}</i>`:`<i>0</i>`);
  const f = t.form ? ` · ${t.form.seq}` : "";
  const miss = t.out ? ` · <span class="mini-out">${t.out.length} out</span>` : "";
  return `${tag}<div class="stat">${s.PPG.toFixed(2)} ppg · ${s.W}-${s.D}-${s.L} · ${gd}${f}${miss}</div>`;
}

/* Which side the model favours decides the colours: yellow for it, red for
   the other, grey for the draw. A dead heat goes to the home side. */
const roles = (h, a) => h >= a ? ["win", "lose"] : ["lose", "win"];

function bttsBar(g){
  const y=pct(g.btts), n=100-y;
  // no loser here, only a likelier outcome: yellow for it, grey for the other
  const [cy, cn] = y >= n ? ["win", "draw"] : ["draw", "win"];
  return `<div class="bar" role="img" aria-label="Both teams to score ${y} per cent">
    <i class="h ${cy}" style="width:${y}%">${y>=13?`<b>${y}</b>`:""}</i>
    <i class="a ${cn}" style="width:${n}%">${n>=13?`<b>${n}</b>`:""}</i>
  </div>`;
}

function probBar(h, d, a, min){
  const lbl=v=> v>=min ? `<b>${v}</b>` : "";
  const [ch, ca] = roles(h, a);
  return `<div class="bar" role="img" aria-label="Home win ${h} per cent, draw ${d} per cent, away win ${a} per cent">
    <i class="h ${ch}" style="width:${h}%">${lbl(h)}</i>
    <i class="d draw" style="width:${d}%">${lbl(d)}</i>
    <i class="a ${ca}" style="width:${a}%">${lbl(a)}</i>
  </div>`;
}

/* Bookmakers' fair probability and best price for the model's favoured
   outcome. The "value" tag only exists if odds.py's backtest opened the gate. */
function mktLine(g){
  if(!g.market) return "";
  const mp = [g.p.h, g.p.d, g.p.a];
  const i = mp.indexOf(Math.max(...mp));
  const v = g.value ? ` · <b class="val">value +${Math.round(g.value.ev*100)}%</b>` : "";
  return `<div class="mkt ${"hda"[i]}" title="Bookmakers' average with their margin taken out, and the best single price on file, for the outcome the model favours. Collected Friday for the weekend and Tuesday for midweek, so it will have moved.">Bookies <b>${pct(g.market.p[i])}%</b> · best <b>${g.market.best[i].toFixed(2)}</b>${v}</div>`;
}

function bar(g){
  const h=pct(g.p.h), d=pct(g.p.d);
  return probBar(h, d, 100-h-d, 13);
}

function teamSheet(t, label){
  const rows = [];
  if(t.last) rows.push([t.lastSeason || "2025/26", t.last]);
  if(t.now && t.now.P) rows.unshift(["This season", t.now]);
  const body = rows.map(([k,s])=>`<tr>
      <td>${k}</td><td>${s.P}</td><td>${s.W}</td><td>${s.D}</td><td>${s.L}</td>
      <td>${s.GF}</td><td>${s.GA}</td><td>${s.GD>0?"+":""}${s.GD}</td>
      <td>${s.Pts}</td><td>${s.PPG.toFixed(2)}</td></tr>`).join("");
  const flags = [
    t.unrated ? `<span class="flag unrated">not rated</span>` : "",
    t.adj ? `<span class="flag manual">manual override</span>` : "",
    t.out ? `<span class="flag out">${t.out.length} missing</span>` : "",
    t.carriedFrom ? `<span class="flag carry">carried from ${lname(t.carriedFrom).name}</span>` : "",
    (t.now && t.now.P) ? `<span class="flag live">${t.now.P} played</span>` : "",
  ].join("");
  return `<div>
    <h3>${label} — ${t.name}${t.league ? ` <span class="sheet-league">(${t.league})</span>` : ""}</h3>
    ${flags}
    <table class="sheet">
      <tr><th>Record</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>PPG</th></tr>
      ${body || (t.played === null && !t.unrated
        ? `<tr><td colspan="10">Rated from international results, not a domestic table — see attack/defence below.</td></tr>`
        : `<tr><td colspan="10">No completed matches on record.</td></tr>`)}
    </table>
    <div class="stat" style="margin-top:8px">
      attack ${t.att.toFixed(2)} · defence ${t.def.toFixed(2)}
      ${t.form ? " · last "+(t.form.max/3)+": "+t.form.pts+" pts ("+t.form.seq+")" : " · form: not yet available"}
    </div>
    ${t.adj ? `<div class="stat" style="margin-top:6px;color:#2b3560">
        hand-adjusted: attack x${t.adj.att.toFixed(2)}, defence x${t.adj.def.toFixed(2)}${t.adj.why?" — "+t.adj.why:""}
      </div>` : ""}
    ${t.out ? `<div class="outlist">unavailable:
        ${t.out.map(p=>`<i>${p.name}</i> <span>(${p.importance} ${p.role}${p.why?", "+p.why:""})</span>`).join(" · ")}
        <br><span>net effect: attack x${t.outFactors[0].toFixed(2)}, defence x${t.outFactors[1].toFixed(2)}</span>
      </div>` : ""}
  </div>`;
}

function detail(g){
  // A model number is a starting point, not the last word. Both links leave
  // the site entirely: the fixture itself, and the competition table for
  // context the model doesn't show (position, run-in, head-to-head).
  const research = `<div class="research">
    <a href="${gSearch(g.home.name + " v " + g.away.name + " head to head")}"
       target="_blank" rel="noopener">Head to head ↗</a>
    <a href="${gSearch(g.home.name + " v " + g.away.name + " prediction")}"
       target="_blank" rel="noopener">Predictions ↗</a>
    <a href="${gSearch(g.home.name + " v " + g.away.name + (g.date ? " " + g.date : ""))}"
       target="_blank" rel="noopener">Search this fixture ↗</a>
    <a href="${gSearch(compName(g) + " " + g.country + " table")}"
       target="_blank" rel="noopener">${compName(g)} table ↗</a>
  </div>`;
  const edge = g.p.h>g.p.a ? g.home : g.away;
  const dir  = g.p.h>g.p.a ? "home" : "away";
  const missing = [g.home,g.away].filter(t=>t.unrated).map(t=>t.name);

  const why = missing.length
    ? `<b>This fixture is not really priced.</b> ${missing.join(" and ")}
       ${missing.length>1?"have":"has"} no season on file — almost certainly promoted from a
       division this build does not yet cover — so the model substitutes a league-average rating
       and the split below is close to what you would get from knowing nothing at all.
       Treat the ${pct(g.confidence)}% as a placeholder, not a read.`
    : `Model expects <em>${g.xg[0].toFixed(2)} – ${g.xg[1].toFixed(2)}</em> goals,
       likeliest scoreline <em>${g.score[0]}–${g.score[1]}</em>.
       The ${dir} edge comes from ${edge.name}'s attack rating of
       <em>${edge.att.toFixed(2)}</em> against a defence rating of
       <em>${(dir==="home"?g.away.def:g.home.def).toFixed(2)}</em>, before a home-ground
       adjustment worth about a third of a goal.
       ${g.evidence==="carryover"
         ? " Nothing has been played this season, so this rests entirely on 2025/26 and takes no account of summer transfers."
         : ""}`;

  const cl = g.celtic ? `<div class="why" style="border-top:1px solid var(--rule);color:#5f4715">
      <span class="flag celtic">Celtic's Law</span>
      Flagged before kick-off as one the model is blind to: ${g.celtic.reasons.join("; ")}.
      ${g.celtic.early ? "Fewer than ten matches have been played, when the effect is strongest. " : ""}
      Across 2025/26, fixtures like this were called correctly
      <em>${g.celtic.early ? "43.8%" : "47.2%"}</em> of the time against
      <em>${g.celtic.early ? "48.8%" : "50.4%"}</em> for settled ones. This fixture's split is
      not wrong so much as worth less than the same number on an unflagged row.
    </div>` : "";

  if(state.board === "btts"){
    const B = bttsTier(g);
    const bv = `<div class="why" style="border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:0">
        <b>${B.name}: ${pct(g.btts)}% both teams score.</b>
        Expected goals of <em>${g.xg[0].toFixed(2)}</em> and <em>${g.xg[1].toFixed(2)}</em> put the
        chance of over 2.5 goals at <em>${pct(g.over25)}%</em>.
        Fixtures quoted around here came in <em>${B.was}</em> of the time last season, against a
        <em>54%</em> base rate across all fixtures. Goals markets are much harder to call from
        season averages than the result is, so treat this as a nudge rather than a read.
      </div>`;
    return `<div class="detail">${research}${bv}
      <div class="detail-grid" style="margin-top:16px">${teamSheet(g.home,"Home")}${teamSheet(g.away,"Away")}</div>
    </div>`;
  }
  const T = tier(g);
  const side = g.p.h>=g.p.d && g.p.h>=g.p.a ? g.home.name
             : (g.p.a>=g.p.d ? g.away.name : "a draw");
  const verdict = T.k === 0
    ? `<div class="why" style="border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:0">
         <b>No read.</b> At ${pct(g.confidence)}% this is close to the 33% you would get from
         guessing between three outcomes. Fixtures the model quoted in this range came in
         ${T.was} of the time last season. It is telling you these sides are hard to separate,
         not that ${side} is likely.
       </div>`
    : `<div class="why" style="border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:0">
         <b>${T.name} read on ${side}.</b> ${g.rankAdjusted ? `Re-scored with the FIFA world ranking
           (${g.home.name} #${g.home.worldRank}, ${g.away.name} #${g.away.worldRank}), which in testing on 2026
           internationals made the calls measurably more accurate. ` : ""}${g.accuracy ? accLine(g.accuracy)
           : `Fixtures the model quoted around ${pct(g.confidence)}% came in ${T.was} of the time last season.`}${g.celtic ? " This one is flagged below and should be discounted a notch." : ""}
       </div>`;

  const O = D.odds || {};
  const mk = g.market ? `<div class="why" style="border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:0">
      <b>Against the bookmakers.</b>
      <table class="mktgrid"><thead><tr><th></th><th>${g.home.name}</th><th>Draw</th><th>${g.away.name}</th></tr></thead>
      <tbody>
        <tr><td>Model</td><td>${pct(g.p.h)}%</td><td>${pct(g.p.d)}%</td><td>${pct(g.p.a)}%</td></tr>
        <tr><td>Bookies</td><td>${pct(g.market.p[0])}%</td><td>${pct(g.market.p[1])}%</td><td>${pct(g.market.p[2])}%</td></tr>
        <tr><td>Best price</td><td>${g.market.best[0].toFixed(2)}</td><td>${g.market.best[1].toFixed(2)}</td><td>${g.market.best[2].toFixed(2)}</td></tr>
      </tbody></table>
      ${g.value ? `The best price on ${g.value.side==="h"?g.home.name:g.value.side==="a"?g.away.name:"the draw"} is
        worth about <em>${Math.round(g.value.ev*100)}%</em> more than the model's own fair price.`
        : (O.verdict || "")}
      Prices from football-data.co.uk, collected Friday for the weekend and Tuesday for midweek.
    </div>` : "";

  return `<div class="detail">
    ${research}
    ${verdict}
    ${mk}
    <div class="detail-grid" style="margin-top:16px">
      ${teamSheet(g.home,"Home")}
      ${teamSheet(g.away,"Away")}
    </div>
    <div class="why">${why}</div>
    ${cl}
  </div>`;
}

/* ---------- shared fixture row: used by both the fixtures board and the
   Starred board, so a bookmark toggled or a row expanded on one reads the
   same on the other. */
const starGlyph = id => state.starred.has(id) ? "★" : "☆";

function appendFixture(sec, g, i, dayDate, btts){
  const id = dayDate+"|"+g.home.name+"|"+g.away.name;
  const T = btts ? bttsTier(g) : tier(g);

  const line = document.createElement("div");
  line.className = "row-line";

  const star = document.createElement("button");
  star.type = "button";
  star.className = "star-btn";
  star.setAttribute("aria-pressed", state.starred.has(id) ? "true" : "false");
  star.setAttribute("aria-label",
    (state.starred.has(id) ? "Remove bookmark: " : "Bookmark: ") + g.home.name + " v " + g.away.name);
  star.title = "Bookmark this fixture";
  star.textContent = starGlyph(id);
  star.addEventListener("click", e=>{
    e.stopPropagation();
    state.starred.has(id) ? state.starred.delete(id) : state.starred.add(id);
    saveStarred();
    star.textContent = starGlyph(id);
    star.setAttribute("aria-pressed", state.starred.has(id) ? "true" : "false");
    if(!$("#starred").hidden) renderStarred();
    if(!$("#list").hidden) renderList();
  });

  const btn = document.createElement("button");
  btn.className = "row" + (i % 2 ? " alt" : "")
                + (g.unrated ? " unrated" : "") + (g.celtic ? " celtic" : "")
                + (T.k === 0 ? " noread" : "");
  btn.setAttribute("aria-expanded", state.open===id ? "true":"false");
  btn.innerHTML = `
    <div class="rank t${T.k}" title="${T.k ? T.name + " read" : "No read"}">${String(i+1).padStart(2,"0")}</div>
    <div class="ko"><time${g.kickoff?` datetime="${g.kickoff}"`:""}>${koText(g)}</time><div class="comp" title="${g.country} · ${compName(g)}">${flag(g.iso,g.country)}<span>${compName(g)}</span></div></div>
    <div class="side"><div class="club">${flag(g.iso,g.country)}<span>${g.home.name}</span></div>${sideStats(g.home, g.cup)}</div>
    <div class="barcell">${btts ? bttsBar(g) : bar(g) + mktLine(g)}</div>
    <div class="pred"><b>${g.score[0]}–${g.score[1]}</b><small>${g.xg[0].toFixed(2)}–${g.xg[1].toFixed(2)}</small></div>
    <div class="side away"><div class="club">${flag(g.iso,g.country)}<span>${g.away.name}</span></div>${sideStats(g.away, g.cup)}</div>
    <div class="conf">${pct(btts ? g.btts : g.confidence)}<span class="tier t${T.k}">${T.name}</span>${btts ? "" : accChip(g.accuracy)}${g.celtic?`<span class="flagged" title="Celtic's Law: the model is working partly blind here, so this fixture is dropped one tier. Tap the row for why.">flagged</span>`:""}</div>`;
  btn.addEventListener("click", ()=>{
    state.open = state.open===id ? null : id;
    render();
    if(!$("#starred").hidden) renderStarred();
    if(!$("#list").hidden) renderList();
  });

  line.appendChild(star);
  line.appendChild(btn);
  sec.appendChild(line);
  if(state.open===id){
    const dv = document.createElement("div");
    dv.innerHTML = detail(g);
    sec.appendChild(dv.firstElementChild);
  }
}

/* ---------- the starred board ----------
   A shortlist, not a saved search: it only ever holds fixtures already on
   the fixtures board, filtered to what was tapped, and it empties itself
   with the rest of the slate at the start of a new day (see loadStarred). */
/* ---------- starred: run the slip ----------
   The chance every starred pick lands, on the site's own numbers (no
   bookmaker input, by Douglas's decision), with fair odds (1 / chance) and a
   plain verdict per leg. Legs are treated as independent, which is how an
   accumulator settles. Douglas, 30 Sep 2026. */
function starredLegs(){
  const legs = [];
  upcoming.forEach(day => day.games.forEach(g => {
    if(!state.starred.has(day.date + "|" + g.home.name + "|" + g.away.name)) return;
    const k = ["h","d","a"].reduce((a,b) => g.p[b] > g.p[a] ? b : a, "h");
    const pick = k === "h" ? g.home.name : k === "a" ? g.away.name : "Draw";
    const warn = [];
    if(k === "d") warn.push("a draw pick: the least predictable outcome in football");
    if(g.rankAdjusted && g.modelConfidence && g.modelConfidence < 0.75)
      warn.push(`the FIFA ranking carried it: the model's own number was ${pct(g.modelConfidence)}%`);
    if(g.celtic) warn.push("Celtic's Law: " + g.celtic.reasons.join("; "));
    if(g.unrated) warn.push("a side has no rating on file");
    legs.push({name: `${g.home.name} v ${g.away.name}`, pick, p: g.p[k], acc: g.accuracy,
      list: g.list, reserve: g.reserve, warn});
  }));
  const others = [];
  if(SD && SD.sports) Object.values(SD.sports).forEach(sp => (sp.games || []).forEach(g => others.push(g)));
  const TDS = window.__TENNIS_DATA__;
  if(TDS && TDS.matches) TDS.matches.forEach(m => others.push(tennisAsGame(m)));
  others.filter(g => state.starred.has("s|" + (g.id || (g.when + "|" + g.home + "|" + g.away)))).forEach(g => {
    const warn = [];
    if(/qualif/i.test(g.label || "")) warn.push("a qualifying round: thin ratings, and not what was tested");
    legs.push({name: `${g.home} v ${g.away}`, pick: g.pick, p: g.confidence, acc: g.accuracy,
      list: g.list, reserve: g.reserve, warn});
  });
  legs.forEach(l => {
    if(l.p < 0.62) l.warn.push("under Firm (62%): close to a coin flip on the model's numbers");
    l.verdict = l.list && !l.warn.length ? "Strong" : (l.warn.length ? "Wary" : (l.reserve ? "Reserve" : "Wary"));
    if(l.verdict === "Wary" && !l.warn.length) l.warn.push("under this sport's Daily List bar");
  });
  return legs;
}

const fairOdds = p => {
  const dec = 1 / p;
  return `${dec.toFixed(2)} (${dec - 1 >= 1 ? (dec - 1).toFixed(dec - 1 >= 10 ? 0 : 1) + "/1" : "1/" + (1 / (dec - 1)).toFixed(1)})`;
};

function runSlip(){
  const legs = starredLegs();
  if(!legs.length) return `<p>Star some picks first.</p>`;
  const all = legs.reduce((a, l) => a * l.p, 1);
  const weakest = legs.reduce((a, l) => l.p < a.p ? l : a);
  const without = legs.length > 1 ? all / weakest.p : null;
  const rows = legs.slice().sort((a, b) => b.p - a.p).map(l => `
    <tr class="v-${l.verdict.toLowerCase()}">
      <td><b>${l.pick}</b><small>${l.name}</small></td>
      <td class="n">${pct(l.p)}%<small>${fairOdds(l.p)}</small></td>
      <td class="n">${l.acc ? pct(l.acc.hit) + "%" : "–"}<small>${l.acc ? "tested" : ""}</small></td>
      <td><span class="verdict">${l.verdict}</span>${l.warn.length ? `<small>${l.warn.map(w => w[0].toUpperCase() + w.slice(1)).join(". ")}.</small>`
        : `<small>${l.list ? "Clears the Daily List bar." : "Below the bar, Firm or better."}</small>`}</td>
    </tr>`).join("");
  const strong = legs.filter(l => l.verdict === "Strong").length;
  const wary = legs.filter(l => l.verdict === "Wary").length;
  return `
    <div class="slip-total">
      <div><span>All ${legs.length} land</span><b>${(all * 100).toFixed(all < 0.1 ? 1 : 0)}%</b>
        <small>about 1 in ${Math.max(1, Math.round(1 / all))} · fair odds ${fairOdds(all)}</small></div>
      <div><span>Loses</span><b>${((1 - all) * 100).toFixed(0)}%</b><small>of the time, on these numbers</small></div>
      <div><span>Verdicts</span><b>${strong} strong</b><small>${wary} to be wary of</small></div>
    </div>
    <p class="slip-note">${legs.length > 1 ? `Weakest leg: <b>${weakest.pick}</b> at ${pct(weakest.p)}%.
      Without it, the rest land ${(without * 100).toFixed(0)}% of the time. ` : ""}Fair odds are 1 ÷ the site's chance,
      not a bookmaker's price; a bookmaker pays less, and the gap widens with every leg.</p>
    <table class="slip"><thead><tr><th>Pick</th><th class="n">Chance</th><th class="n">Landed</th><th>Verdict</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function renderStarred(){
  const host = $("#starred");
  if(!host) return;
  host.innerHTML = "";
  const btts = state.board === "btts";
  let any = false;
  if(state.starred.size){
    const box = document.createElement("div");
    box.className = "slip-box";
    box.innerHTML = `<div class="slip-head"><div><h3>Your starred picks together</h3>
      <p>The chance they all land on the site's own numbers, and a verdict on each.</p></div>
      <button type="button" class="slip-run">${state.slipRun ? "Run again" : "Run"}</button></div>
      <div class="slip-out">${state.slipRun ? runSlip() : ""}</div>`;
    box.querySelector(".slip-run").addEventListener("click", () => {
      state.slipRun = true;
      box.querySelector(".slip-out").innerHTML = runSlip();
      box.querySelector(".slip-run").textContent = "Run again";
    });
    host.appendChild(box);
  }

  upcoming.forEach(day=>{
    const games = day.games.filter(g => state.starred.has(day.date+"|"+g.home.name+"|"+g.away.name));
    if(!games.length) return;
    any = true;
    const sec = document.createElement("section");
    sec.className = "day";
    sec.innerHTML = `
      <div class="day-head">
        <h2>${fmtDay(day.date)}</h2>
        <div class="count">${games.length} bookmarked</div>
      </div>
      <div class="ruler">
        <div>#</div><div>UK time</div><div>Home</div>
        <div class="r-bar">${btts
          ? `<span>Both score</span><span>Not both</span>`
          : `<span>Home win</span><span>Draw</span><span>Away win</span>`}</div>
        <div style="text-align:center">Score · xG</div>
        <div style="text-align:right">Away</div><div style="text-align:right">Conf.</div>
      </div>`;
    games.slice().sort(btts ? rank.btts : rank.conf)
      .forEach((g,i)=> appendFixture(sec, g, i, day.date, btts));
    host.appendChild(sec);
  });

  // Every other sport's bookmarks, by day, in the shared row.
  const others = [];
  if(SD && SD.sports) Object.values(SD.sports).forEach(sp => (sp.games || []).forEach(g => others.push(g)));
  const TDS = window.__TENNIS_DATA__;
  if(TDS && TDS.matches) TDS.matches.forEach(m => others.push(tennisAsGame(m)));
  const starredOthers = others.filter(g => state.starred.has("s|" + (g.id || (g.when + "|" + g.home + "|" + g.away))));
  const byDay = {};
  starredOthers.forEach(g => (byDay[localDay(g.when)] = byDay[localDay(g.when)] || []).push(g));
  Object.keys(byDay).sort().forEach(d => {
    any = true;
    const sec = document.createElement("section");
    sec.className = "day";
    sec.innerHTML = `<div class="day-head"><h2>${fmtDay(d)}</h2>
      <div class="count">${byDay[d].length} bookmarked · other sports</div></div>${sportRuler()}`;
    byDay[d].sort((x,y) => y.confidence - x.confidence).forEach((g,i) => sec.appendChild(sportRow(g, i, true)));
    host.appendChild(sec);
  });

  if(!any) host.innerHTML = `<div class="empty">No bookmarks yet. Tap the star (☆) on any
    fixture to shortlist it here. The list clears itself each morning along with the
    fixtures, so it never carries a stale pick into a new day.</div>`;
}

/* ---------- the daily list ----------
   build.py decides membership (list_eligible) and archives it, so the page
   only reads the flag: the rule lives in one place and score.py grades
   exactly what was shown. */
function renderList(){
  const host = $("#list");
  if(!host) return;
  const L = D.list || {min:0.75};
  const R = window.__RECORD__ || {};
  const pc = x => Math.round(x*100) + "%";

  // Each sport's threshold, as its own testing set it.
  const TDL = window.__TENNIS_DATA__;
  const thresholds = [`football leagues ${pc(L.min)}`];
  if(L.minIntl) thresholds.push(`internationals ${pc(L.minIntl)}`);
  // min is per tour now; an older tennis file (kept when a day's fetch fails) has one number
  if(TDL && TDL.list && TDL.list.min) thresholds.push(`tennis ${pc(typeof TDL.list.min === "number"
    ? TDL.list.min : Math.min(...Object.values(TDL.list.min)))}`);
  const absent = [];
  if(SD && SD.sports) Object.values(SD.sports).forEach(sp =>
    sp.published && sp.listMin ? thresholds.push(`${sp.name === "NFL" ? "NFL" : sp.name.toLowerCase()} ${pc(sp.listMin)}`) : absent.push(sp.name));

  // One live record for the list, across every sport that has graded picks.
  const recs = [R.list, window.__TENNIS_RECORD__ && window.__TENNIS_RECORD__.list, SR && SR.list].filter(Boolean);
  const liveN = recs.reduce((a,r) => a + r.n, 0), liveC = recs.reduce((a,r) => a + r.correct, 0);

  // counted up front so the headline can say how many
  let _n = 0;
  upcoming.forEach(day => _n += day.games.filter(g => g.list).length);
  if(SD && SD.sports) Object.values(SD.sports).forEach(sp => _n += (sp.games || []).filter(g => g.list).length);
  if(TDL && TDL.matches) _n += TDL.matches.filter(m => m.list).length;
  host.innerHTML = `
    <div class="lede">
      <h2>${_n} pick${_n === 1 ? "" : "s"} this week, strongest first</h2>
      <p>Every pick here is one the model's testing says lands at least <b>four times in five</b>.
        Each row shows its own tested rate: <b>"86% landed"</b> means calls at that level came off
        86% of the time on games the model never saw.
        ${liveN ? `Live so far: <b>${liveC} of ${liveN}</b> landed (${pc(liveC/liveN)}).` : ""}</p>
      <details class="how"><summary>How the list works</summary>
        <p>A pick qualifies only if calls at its level landed at least 80% of the time in testing, on
        games the model was never tuned on. The level differs by sport because the numbers do:
        ${thresholds.join(", ")}.${absent.length ? ` Not on the list: ${absent.join(", ")}, whose strongest calls do not land often enough.` : ""}</p>
        <p>Football leaves out anything the model is blind to (promoted sides, cross-division cup ties,
        clubs with no prior season) and never picks a draw. Tennis leaves out qualifying rounds.
        World rankings feed in where testing showed they help: FIFA for internationals, ATP for men's tennis.
        An international also needs the model's own number to clear the bar before the ranking moves it.</p>
        <p>Below the picks that clear the bar, a <b>reserve</b> fills each day out to 20: games under the bar
        but otherwise clean, Firm (62%) or better, ranked the same way. Each carries its strength tag and
        tested rate, and the reserve is graded as its own group so it never flatters the list's record.</p>
        <p>Everything is the model's own read, with no bookmaker input. Roughly one pick in five or
        six will still miss; that is sport, and no bar removes it.
        ${liveN ? "" : "The list's live record starts from its first graded day."}</p>
      </details>
    </div>`;

  // Every sport's picks per day in one ranking: highest tested hit rate
  // first, then confidence. Confidence alone would not compare fairly: a
  // football number is one of three outcomes, the others one of two.
  // Picks that clear the bar come first. Below them, the reserve fills the
  // day out to LIST_TARGET: games under the bar but otherwise clean, Firm or
  // better, flagged by each pipeline before kick-off and graded as their own
  // group by strength tag (record.json "reserve"), never in the list's record.
  const LIST_TARGET = 20;
  const byDay = {}, resDay = {};
  const add = (bucket, date, item) => (bucket[date] = bucket[date] || []).push(item);
  const fDay = (g, day) => g.kickoff ? localDay(g.kickoff) : day.date;
  upcoming.forEach(day => day.games.forEach(g =>
    g.list ? add(byDay, fDay(g, day), {kind:"football", g, day})
           : g.reserve && add(resDay, fDay(g, day), {kind:"football", g, day})));
  if(SD && SD.sports) Object.values(SD.sports).forEach(sp => (sp.games || []).forEach(g =>
    g.list ? add(byDay, localDay(g.when), {kind:"sport", g})
           : g.reserve && add(resDay, localDay(g.when), {kind:"sport", g})));
  if(TDL && TDL.matches) TDL.matches.map(tennisAsGame).forEach(g =>
    g.list ? add(byDay, localDay(g.when), {kind:"sport", g})
           : g.reserve && add(resDay, localDay(g.when), {kind:"sport", g}));
  const strength = it => [(it.g.accuracy && it.g.accuracy.hit) || 0, it.g.confidence];
  const order = (a,b) => { const x = strength(a), y = strength(b); return y[0]-x[0] || y[1]-x[1]; };
  const dates = [...new Set([...Object.keys(byDay), ...Object.keys(resDay)])].sort();
  dates.forEach(date => {
    const items = (byDay[date] || []).sort(order).slice(0, LIST_TARGET);
    const extra = (resDay[date] || []).sort(order).slice(0, Math.max(0, LIST_TARGET - items.length));
    const sec = document.createElement("section");
    sec.className = "day";
    sec.innerHTML = `<div class="day-head"><h2>${fmtDay(date)}</h2>
      <div class="count">${items.length} clear the bar${extra.length ? ` · ${extra.length} reserve` : ""}</div></div>`;
    const put = (it, i) => it.kind === "football"
      ? appendFixture(sec, it.g, i, date, false)
      : sec.appendChild(sportRow(it.g, i, true));
    items.forEach(put);
    if(extra.length){
      sec.insertAdjacentHTML("beforeend", `<div class="reserve-head"><b>Reserve</b>
        Under the 80% bar, Firm or better. Weigh each by its tag and tested rate; graded separately.</div>`);
      extra.forEach((it, j) => put(it, items.length + j));
    }
    host.appendChild(sec);
  });
  if(!dates.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = `Nothing clears the bar in this window, in any sport, so nothing is served.
      Each sport's full slate is on its own tab.`;
    host.appendChild(e);
  }

  const past = R.listDays || [];
  if(past.length){
    const rows = past.flatMap(d => d.games.map(g => ({d:d.date, ...g})));
    const side = g => g.pick === "h" ? g.home : g.away;
    host.insertAdjacentHTML("beforeend", `
      <div class="list-past"><h3>Recent list results</h3><ul>${rows.slice(0, 30).map(g => `
        <li><span class="d">${fmtDay(g.d).split(",")[0]}</span>
          <span class="${g.ok ? "ok" : "no"}">${g.ok ? "✓" : "✗"}</span>
          <span>${side(g)} to beat ${g.pick === "h" ? g.away : g.home} · ${pct(g.confidence)}%</span>
          <span class="sc">${g.result[0]}–${g.result[1]}</span></li>`).join("")}</ul></div>`);
  }
}

/* ---------- tennis ----------
   Own render path, own data file (tennis-data.js, loaded separately from
   data.js so a missing one never breaks the football board). No draw, so
   no three-way bar — a single two-colour split between the two players.
   No flags: nationality isn't in tennis.json's rating file, so this shows
   name and tour only rather than guessing at a flag. */
function tennisResearch(m){
  // Same idea as football's research links: leave the model's own number
  // and give a fast way out to something with more context than a rating
  // file can hold — a bracket, a recent-form thread, an injury note.
  return `<div class="research">
    <a href="${gSearch(m.playerA + " v " + m.playerB + " head to head")}"
       target="_blank" rel="noopener">Head to head ↗</a>
    <a href="${gSearch(m.playerA + " v " + m.playerB + " prediction")}"
       target="_blank" rel="noopener">Predictions ↗</a>
    <a href="${gSearch(m.playerA + " v " + m.playerB + " " + m.tournament)}"
       target="_blank" rel="noopener">Search this match ↗</a>
    <a href="${gSearch(m.tournament + " " + m.tour + " draw")}"
       target="_blank" rel="noopener">${m.tournament || "Tournament"} draw ↗</a>
  </div>`;
}

// Same numeric tiers football's own TIERS/tier() use — k:3 Strong down to
// k:0 No read — so .rank.t3 and .tier.t3 mean exactly the same yellow-on-
// black "Strong" everywhere on the site, not a tennis-specific lookalike.
const TENNIS_TIER_K = {"Strong": 3, "Firm": 2, "Lean": 1, "No read": 0};

function tennisBar(pa, pb){
  const [ca, cb] = pa >= pb ? ["win", "lose"] : ["lose", "win"];
  const lbl = v => v >= 13 ? `<b>${v}</b>` : "";
  return `<div class="bar" role="img" aria-label="${pa} per cent, ${pb} per cent">
    <i class="h ${ca}" style="width:${pa}%">${lbl(pa)}</i>
    <i class="a ${cb}" style="width:${pb}%">${lbl(pb)}</i>
  </div>`;
}

function tennisStat(r, surface){
  // The evidence behind the number, same job football's ppg/W-D-L/GD line
  // under each club does: elo is the rating actually used to price this
  // specific match (the surface-specific one, falling back to overall for
  // a player new to this surface); matches is how much of it to trust.
  if(!r) return `<div class="stat none">not rated</div>`;
  return `<div class="stat">${r.surfaceElo} ${surface} Elo &middot; ${r.matches} matches</div>`;
}

function renderTennis(){
  const host = $("#tennis");
  const TD = window.__TENNIS_DATA__;
  if(!TD || !TD.matches){
    host.innerHTML = `<div class="empty">No tennis data loaded. Run
      <code>python3 build_tennis.py</code> next to this page to fetch and price
      this week's ATP/WTA fixtures.</div>`;
    return;
  }
  host.innerHTML = "";
  if(!TD.matches.length){
    host.innerHTML = `<div class="empty">No upcoming tennis fixtures found for
      ${TD.from} to ${TD.to}.</div>`;
    return;
  }
  host.innerHTML = `<div class="lede"><h2>Tennis</h2><p>ATP and WTA, priced from each player's
    Elo rating on the surface, pulled toward a coin flip by the amount testing found honest. Men's
    matches are re-scored with the ATP world ranking, which made them measurably more accurate.
    Under each number is how often calls at that level landed in testing.</p></div>`;
  const byDay = {};
  TD.matches.forEach(m => { const k = localDay(tennisAsGame(m).when); (byDay[k] = byDay[k] || []).push(m); });

  Object.keys(byDay).sort().forEach(date => {
    const games = byDay[date].slice().sort((a,b)=> b.confidence - a.confidence);
    const confident = games.filter(m => m.tier !== "No read").length;
    const sec = document.createElement("section");
    sec.className = "day";
    const d = new Date(date + "T00:00:00");
    const label = d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }).toUpperCase();
    sec.innerHTML = `
      <div class="day-head">
        <h2>${label}</h2>
        <div class="count">${games.length} matches &middot; ${confident} confident</div>
      </div>
      <div class="ruler">
        <div>#</div><div>UK time</div><div>Player</div>
        <div class="r-bar"><span>Win</span><span>Win</span></div><div></div>
        <div style="text-align:right">Opponent</div><div style="text-align:right">Conf.</div>
      </div>`;

    games.forEach((m, i) => sec.appendChild(sportRow(tennisAsGame(m), i, false)));
    host.appendChild(sec);
  });
}

function render(){
  const host = $("#days");
  host.innerHTML = "";
  let shown = 0;

  upcoming.forEach(day=>{
    const btts = state.board === "btts";
    const tierOf = g => btts ? bttsTier(g) : tier(g);
    let games = day.games.filter(g=> state.leagues.size===0 || state.leagues.has(g.league));
    if(state.show === "read") games = games.filter(g => tierOf(g).k >= 1);
    if(!games.length) return;
    const nRead = games.filter(g => tierOf(g).k >= 1).length;
    const total = games.length;
    // Every fixture is on the page. Only the All view with nothing filtered
    // is shortened, to the most confident rows, until "Show all" is pressed.
    // Picking a competition, or Confident only, always shows everything.
    const cap = D.topPerDay || 50;
    const capped = state.leagues.size === 0 && state.show === "all"
                   && !state.expanded.has(day.date) && total > cap;
    if(capped){
      games = games.slice().sort(btts ? rank.btts : rank.conf).slice(0, cap);
    }
    games = games.slice().sort(sortFns[state.sort]);
    shown += games.length;

    const sec = document.createElement("section");
    sec.className = "day";
    sec.innerHTML = `
      <div class="day-head">
        <h2>${fmtDay(day.date)}</h2>
        <div class="count">${total} fixture${total===1?"":"s"} · ${nRead} confident</div>
      </div>
      <div class="ruler">
        <div>#</div><div>UK time</div><div>Home</div>
        <div class="r-bar">${state.board==="btts"
          ? `<span>Both score</span><span>Not both</span>`
          : `<span>Home win</span><span>Draw</span><span>Away win</span>`}</div>
        <div style="text-align:center">Score · xG</div>
        <div style="text-align:right">Away</div><div style="text-align:right">Conf.</div>
      </div>`;

    games.forEach((g,i)=> appendFixture(sec, g, i, day.date, btts));
    if(capped || (state.expanded.has(day.date) && state.leagues.size === 0
                  && state.show === "all" && total > cap)){
      const more = document.createElement("button");
      more.className = "more";
      more.innerHTML = capped
        ? `Show all <b>${total}</b> fixtures for ${fmtDay(day.date)}`
        : `Show the top <b>${cap}</b> only`;
      more.addEventListener("click", ()=>{
        state.expanded.has(day.date) ? state.expanded.delete(day.date) : state.expanded.add(day.date);
        render();
      });
      sec.appendChild(more);
    }
    host.appendChild(sec);
  });

  if(!shown) host.innerHTML = upcoming.length
    ? (state.show === "read"
        ? `<div class="empty">No confident reads for this selection. Switch to <b>Every fixture</b> to see them all.</div>`
        : `<div class="empty">No fixtures match that filter. Clear a competition to see more.</div>`)
    : `<div class="empty">Nothing left to show. Every fixture in this build has been played.</div>`;
}

/* ---------- the review board ----------
   Predictions are worth nothing unless someone goes back and checks them, and
   a page that only ever shows the future is asking to be believed on nothing.
   This board reads a completed day back against what was published before it
   kicked off: which tier each pick sat in, what happened, and where the misses
   came from. The tier hit rates underneath are the live version of the labels
   the fixture board uses, so a reader can see whether "Lean" has meant anything
   on this season's fixtures rather than only in a backtest. */
const resState = { day: null, tday: null, sday: null, sport: "football" };
const R_DAYS = (R && R.days) || [];
if(R_DAYS.length) resState.day = R_DAYS[0].date;

const mark = ok => `<div class="mark ${ok?"ok":"no"}" aria-label="${ok?"correct":"wrong"}">${ok?"✓":"✗"}</div>`;
const OUTCOME = {h:"home win", d:"draw", a:"away win"};

function resultRow(g, i){
  const L = lname(g.league) || {short:g.league, iso:"", country:""};
  const h = pct(g.p[0]), d = pct(g.p[1]), a = 100-h-d;
  return `<div class="rrow${i%2?" alt":""}${g.celtic?" celtic":""}${g.ok?"":" miss"}">
    <div class="lg">${L.short}</div>
    <div class="side"><div class="club">${flag(L.iso,L.country)}<span>${g.home}</span></div></div>
    ${probBar(h, d, a, 15)}
    <div class="sc pred" title="predicted scoreline">${g.predScore[0]}–${g.predScore[1]}</div>
    <div class="sc act" title="final score">${g.result[0]}–${g.result[1]}</div>
    <div class="side away"><div class="club">${flag(L.iso,L.country)}<span>${g.away}</span></div></div>
    <div class="conf">${pct(g.confidence)}<span class="tier t${g.k}">${g.tier}</span>${g.celtic?`<span class="flagged" title="Celtic's Law: flagged before kick-off and dropped one tier">flagged</span>`:""}</div>
    ${mark(g.ok)}
  </div>`;
}

function ladderTable(){
  const live = (R && R.tiers) || [];
  const rows = TIERS.map(t => {
    const l = live.find(x => x.name === t.name);
    return `<tr class="t${t.k}">
      <td>${t.name}</td>
      <td class="thin">${t.min>0 ? pct(t.min)+"% and above" : "below 55%"}</td>
      <td>${t.was}</td>
      <td>${l ? l.n : "—"}</td>
      <td>${l ? pct(l.hit)+"%" : "—"}</td>
      <td class="thin">${l ? (l.hit>=l.expected?"+":"")+Math.round((l.hit-l.expected)*100)+" pts" : "—"}</td>
    </tr>`;
  }).join("");
  return `<table>
    <tr><th>Tier</th><th>Confidence</th><th>Backtest</th>
        <th>Live picks</th><th>Live hit</th><th style="text-align:right">vs quoted</th></tr>
    ${rows}</table>`;
}

function bandTable(){
  const b = (R && R.bands) || [];
  if(!b.length) return "";
  return `<table>
    <tr><th>Quoted confidence</th><th>Fixtures</th><th>Average quote</th><th>Actually landed</th><th style="text-align:right">Error</th></tr>
    ${b.map(x=>`<tr>
      <td class="thin" style="font-family:var(--f-num);font-size:13px">${pct(x.from)}% – ${pct(x.to)}%</td>
      <td>${x.n}</td><td>${pct(x.expected)}%</td><td>${pct(x.hit)}%</td>
      <td>${x.hit>=x.expected?"+":""}${Math.round((x.hit-x.expected)*100)} pts</td>
    </tr>`).join("")}</table>`;
}

/* ---------- tennis: how it went ----------
   score_tennis.py grades every archived tennis price against ESPN's winner,
   but only prices published before the match started; walkovers are void,
   retirements count. Each row reads as the prediction beside the result:
   who the model backed, who actually won, and the score. */
const TT = window.__TENNIS_RECORD__ || null;
const TK = {"Strong":3, "Firm":2, "Lean":1, "No read":0};
const tScore = note => (note || "").replace(/^.*\([A-Z]{3}\)\s*/, "");

function tennisRow(g, i){
  const loser = g.winner === g.playerA ? g.playerB : g.playerA;
  return `<div class="xrow${i%2?" alt":""}${g.ok?"":" miss"}">
    <div class="lg">${g.tour}</div>
    <div class="tm"><b>${g.playerA}</b> v <b>${g.playerB}</b>
      <small>${[g.tournament, g.round].filter(Boolean).join(" · ")}</small></div>
    <div class="tp"><span>Picked</span>${g.pick} <em>${pct(g.confidence)}%</em></div>
    <div class="tw"><span>Won</span>${g.winner}
      <small>${tScore(g.note)}${g.retired ? ` · ${loser} retired` : ""}</small></div>
    <div class="conf"><span class="tier t${TK[g.tier] ?? 0}">${g.tier}</span></div>
    ${mark(g.ok)}
  </div>`;
}

function tennisResults(){
  if(!TT || !TT.overall || !(TT.days || []).length){
    return `<div class="empty" style="max-width:80ch;line-height:1.6">
      <b>Nothing graded yet.</b> Tennis picks are graded once the match is played, and only
      if the pick was published before it started. This fills in after the next daily run.</div>`;
  }
  const days = TT.days;
  const day = days.find(d => d.date === resState.tday) || days[0];
  const o = TT.overall, at = TT.byTour.ATP, wt = TT.byTour.WTA;
  const tierRows = ["Strong","Firm","Lean","No read"].map(name => {
    const t = (TT.tiers || []).find(x => x.name === name);
    const k = TK[name];
    const min = {Strong:"70%", Firm:"62%", Lean:"55%"}[name];
    return `<tr class="t${k}"><td>${name}</td>
      <td class="thin">${min ? min + " and above" : "below 55%"}</td>
      <td>${t ? t.n : "—"}</td><td>${t ? pct(t.accuracy)+"%" : "—"}</td>
      <td class="thin">${t ? pct(t.expected)+"%" : "—"}</td>
      <td class="thin">${t ? (t.accuracy>=t.expected?"+":"")+Math.round((t.accuracy-t.expected)*100)+" pts" : "—"}</td></tr>`;
  }).join("");
  const tl = (x, label) => x ? `<div class="${x.accuracy >= x.expected ? "good" : "bad"}">
      <span>${label}</span><b>${x.correct} / ${x.n}</b>
      <small>${pct(x.accuracy)}% · quoted ${pct(x.expected)}%</small></div>` : "";

  return `
    <div class="scoreline" style="margin-top:20px">
      ${tl(o, "Picked the winner")}${tl(at, "ATP")}${tl(wt, "WTA")}
      <div><span>Log loss</span><b>${o.logLoss.toFixed(3)}</b>
        <small>lower is better · 0.693 = a coin flip</small></div>
    </div>

    <div style="margin-top:20px">
      <div class="ctl-label" style="margin-bottom:6px">Completed day</div>
      <div class="dayseg" id="tdayseg">${days.map(d=>
        `<button data-day="${d.date}" aria-pressed="${d.date===day.date}">
           ${fmtShort(d.date)}<i>${d.correct}/${d.n}</i></button>`).join("")}</div>
    </div>

    <div class="day-head" style="margin-top:22px"><h2>${fmtDay(day.date)}</h2>
      <div class="count">${day.correct} of ${day.n} picked the winner</div></div>
    <div class="xruler"><div>Tour</div><div>Match</div><div>Prediction</div><div>Result</div>
      <div style="text-align:right">Tier</div><div></div></div>
    ${day.games.map(tennisRow).join("")}

    <h2 class="sect">By confidence tier</h2>
    <div class="ladder"><table>
      <tr><th>Tier</th><th>Confidence</th><th>Graded</th><th>Won</th>
          <th>Quoted</th><th style="text-align:right">vs quoted</th></tr>${tierRows}</table></div>
    <div class="prose">
      <p>Every match here was priced and published <b>before it started</b>. A price the site
      showed after a match had begun is not graded${TT.publishedLate ? ` (${TT.publishedLate} such)` : ""}.
      Walkovers are void${TT.void ? ` (${TT.void} so far)` : ""}; a retirement counts, because the
      result stands.</p>
      <p>The tennis tiers borrow football's thresholds and have not been calibrated for tennis.
      This is a small live sample: treat anything under about fifty matches in a row of the
      table as noise, and read the WTA and ATP lines separately.</p>
    </div>`;
}

/* ---------- the shared two-sided row: NFL, baseball, basketball, rugby, tennis ----------
   Football's row features on every sport: a bookmark star, tap to expand the
   reasoning, and the tested accuracy of calls at this level. */
const accChip = a => a ? `<span class="acc" title="Calls at ${pct(a.from)}% or more landed ${pct(a.hit)}% of ${a.n} games the model was never tuned on">${pct(a.hit)}% landed</span>` : "";
const accLine = a => a ? `Calls at <em>${pct(a.from)}%</em> or more landed <em>${pct(a.hit)}%</em> of the time across
  <em>${a.n}</em> games the model was never tuned on${a.season ? ` (${a.season})` : ""}.` : "";

function rerenderOpen(){
  if(!$("#sport").hidden && state.sportView) renderSport(state.sportView);
  if(!$("#tennis").hidden) renderTennis();
  if(!$("#list").hidden) renderList();
  if(!$("#starred").hidden) renderStarred();
}

function formLines(f){
  if(!f || !f.length) return `<div class="stat">no recent games on file</div>`;
  return `<table class="sheet"><tr><th>Last ${f.length}</th><th>Score</th><th></th></tr>${f.map(x =>
    `<tr><td>${x.home ? "v" : "at"} ${x.opp}</td><td>${x.score}</td><td class="r${x.r}">${x.r}</td></tr>`).join("")}</table>`;
}

function sportDetail(g){
  const name = g.sport === "tennis" ? "Tennis" : (SD && SD.sports[g.sport] ? SD.sports[g.sport].name : g.sport);
  const research = g.research || `<div class="research">
    <a href="${gSearch(g.home + " v " + g.away + " " + name + " head to head")}" target="_blank" rel="noopener">Head to head ↗</a>
    <a href="${gSearch(g.home + " v " + g.away + " " + name + " prediction")}" target="_blank" rel="noopener">Predictions ↗</a>
    <a href="${gSearch(g.home + " v " + g.away + " " + name)}" target="_blank" rel="noopener">Search this game ↗</a>
    <a href="${gSearch(g.label + " " + name + " standings")}" target="_blank" rel="noopener">${g.label} table ↗</a></div>`;
  const T = SPORT_K[g.tier] ?? 0;
  const verdict = `<div class="why" style="border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:0">
      <b>${T ? `${g.tier} read on ${g.pick}` : "No read"}</b> at ${pct(g.confidence)}%. ${accLine(g.accuracy)}
      ${T ? "" : " At this level the model cannot really separate them."}</div>`;
  const gap = (g.eloH + (g.hfa || 0)) - g.eloA;
  const why = g.sport === "tennis" ? `<div class="why">${g.why || ""}</div>` : `<div class="why">
      Rated <em>${g.eloH}</em> against <em>${g.eloA}</em>${g.hfa ? `, plus <em>${g.hfa}</em> for playing at home` : g.neutral ? ", neutral venue" : ""}:
      a gap of <em>${Math.abs(Math.round(gap))}</em> rating points in ${gap >= 0 ? g.home : g.away}'s favour.
      Ratings move with every result, more for bigger wins, and drift back toward average over an off-season.</div>`;
  const rec = r => r ? `${r.w}–${r.l}${r.d ? "–" + r.d : ""} this season` : "";
  const sheets = g.formH ? `<div class="detail-grid" style="margin-top:16px">
      <div><h3>${g.home} · ${rec(g.recordH)}</h3>${formLines(g.formH)}</div>
      <div><h3>${g.away} · ${rec(g.recordA)}</h3>${formLines(g.formA)}</div></div>` : "";
  const h2h = g.h2h && g.h2h.length ? `<div class="why"><b>Last meetings.</b> ${g.h2h.map(m =>
      `${m.home} ${m.score} ${m.away} <em>${m.date}</em>`).join(" · ")}</div>` : "";
  return `<div class="detail">${research}${verdict}${why}${sheets}${h2h}</div>`;
}

function sportRow(g, i, showSport, host){
  const id = "s|" + (g.id || (g.when + "|" + g.home + "|" + g.away));
  const ph = Math.round(g.pHome*100), pa = 100 - ph;
  const k = SPORT_K[g.tier] ?? 0;
  const homePick = g.pick === g.home;
  const name = g.sport === "tennis" ? "Tennis" : (SD && SD.sports[g.sport] ? SD.sports[g.sport].name : g.sport);
  const line = document.createElement("div");
  line.className = "row-line";
  const star = document.createElement("button");
  star.type = "button"; star.className = "star-btn";
  star.setAttribute("aria-pressed", state.starred.has(id) ? "true" : "false");
  star.setAttribute("aria-label", (state.starred.has(id) ? "Remove bookmark: " : "Bookmark: ") + g.home + " v " + g.away);
  star.textContent = starGlyph(id);
  star.addEventListener("click", e => {
    e.stopPropagation();
    state.starred.has(id) ? state.starred.delete(id) : state.starred.add(id);
    state.starredGames = state.starredGames || {};
    state.starredGames[id] = g;
    saveStarred(); rerenderOpen();
  });
  const btn = document.createElement("button");
  btn.className = "row trow" + (i % 2 ? " alt" : "") + (k === 0 ? " noread" : "");
  btn.setAttribute("aria-expanded", state.open === id ? "true" : "false");
  btn.innerHTML = `
    <div class="rank t${k}">${String(i+1).padStart(2,"0")}</div>
    <div class="ko"><time datetime="${g.when}">${localTime(g.when)}</time>
      <div class="comp"><span class="tour-chip">${showSport ? name : (g.chip || g.label)}</span>
        <span>${showSport ? g.label : (g.sub || "")}${g.neutral ? " · neutral venue" : ""}</span></div></div>
    <div class="side"><div class="club${homePick?" pick":""}">${g.home}</div>
      <div class="stat">${g.statH || `rating ${g.eloH} · ${g.gamesH} games`}</div></div>
    <div class="barcell">${tennisBar(ph, pa)}</div>
    <div class="pred" aria-hidden="true"></div>
    <div class="side away"><div class="club${!homePick?" pick":""}">${g.away}</div>
      <div class="stat">${g.statA || `rating ${g.eloA} · ${g.gamesA} games`}</div></div>
    <div class="conf">${Math.round(g.confidence*100)}<span class="tier t${k}">${g.tier}</span>${accChip(g.accuracy)}</div>`;
  btn.addEventListener("click", () => { state.open = state.open === id ? null : id; rerenderOpen(); });
  line.appendChild(star); line.appendChild(btn);
  const frag = document.createDocumentFragment();
  frag.appendChild(line);
  if(state.open === id){
    const dv = document.createElement("div");
    dv.innerHTML = sportDetail(g);
    frag.appendChild(dv.firstElementChild);
  }
  return frag;
}

/* tennis in the shared shape */
function tennisAsGame(m){
  const when = m.time ? `${m.date}T${m.time}:00Z` : `${m.date}T12:00:00Z`;
  return {sport:"tennis", id:"t|" + m.date + "|" + m.playerA + "|" + m.playerB,
    label:`${m.tour} · ${m.tournament || ""}${m.round ? " · " + m.round : ""}`,
    chip:m.tour, sub:`${m.tournament || "Tour event"}${m.round ? " · " + m.round : ""} · ${m.surface}`,
    when, home:m.playerA, away:m.playerB, neutral:false, pHome:m.p.a, pick:m.pick,
    confidence:m.confidence, tier:m.tier, accuracy:m.accuracy, list:m.list, reserve:m.reserve,
    statH:`${m.rankA ? `<b class="wr">${m.tour} #${m.rankA}</b> · ` : ""}Elo ${m.ratingA.surfaceElo} · ${m.ratingA.matches} played`,
    statA:`${m.rankB ? `<b class="wr">${m.tour} #${m.rankB}</b> · ` : ""}Elo ${m.ratingB.surfaceElo} · ${m.ratingB.matches} played`,
    research:tennisResearch(m),
    why:`Career Elo <em>${m.ratingA.elo}</em> against <em>${m.ratingB.elo}</em>, ${m.surface.toLowerCase()}-court
      Elo <em>${m.ratingA.surfaceElo}</em> against <em>${m.ratingB.surfaceElo}</em>, blended and pulled toward a coin flip
      by the amount testing found honest for the ${m.tour}.${m.rankAdjusted
        ? ` Then re-scored with the ATP world ranking (${m.rankA ? "#" + m.rankA : "outside the top 150"} v ${m.rankB ? "#" + m.rankB : "outside the top 150"}), which made ATP calls measurably more accurate in testing.`
        : (m.tour === "WTA" ? " WTA rankings are shown for reference: in testing they did not improve on the ratings, so they do not move the number." : "")}${m.list ? "" : m.confidence >= 0.75 ? " Not on the Daily List: qualifying rounds and thinly-rated players are excluded, because that is not what was tested." : ""}`};
}

/* ---------- NFL, baseball, basketball, rugby ----------
   sports.py prices these off one Elo model per sport, keyed by ESPN team id,
   and only publishes a sport whose model beat backing the home side on a
   season it never saw. Same row shape as tennis: two sides, no draw. */
const SD = window.__SPORTS_DATA__ || null;
const SR = window.__SPORTS_RECORD__ || null;
const SPORT_K = {"Strong":3, "Firm":2, "Lean":1, "No read":0};
// The UK calendar day and time of an instant (UK_TZ above), not the device's.
const ukDayFmt = new Intl.DateTimeFormat("en-CA", {year:"numeric", month:"2-digit", day:"2-digit", timeZone: UK_TZ});
const localDay = iso => { const d = new Date(iso); return isNaN(d) ? iso.slice(0,10) : ukDayFmt.format(d); };
const localTime = iso => { const d = new Date(iso); return isNaN(d) ? "" : koFmt.format(d); };

function sportRuler(){
  return `<div class="ruler"><div>#</div><div>UK time</div><div>Home</div>
    <div class="r-bar"><span>Home win</span><span>Away win</span></div><div></div>
    <div style="text-align:right">Away</div><div style="text-align:right">Conf.</div></div>`;
}

function sportEvidence(sp){
  const c = sp.check, b = (sp.bands || []).find(x => x.from === 0.75);
  if(!c) return "";
  return `Checked on <b>${c.n}</b> games since July 2025 that it was never fitted on: picked the
    winner <b>${pct(c.accuracy)}%</b> of the time, against ${pct(c.homeRate)}% for always backing the
    home side.${b ? ` Calls at 75% or more landed <b>${pct(b.hit)}%</b> (${b.n} games).` : ""}
    ${sp.listMin ? `Games at <b>${pct(sp.listMin)}%</b> or more go on the Daily List.`
      : `No games from this sport go on the Daily List: its strongest calls did not land often enough in testing.`}`;
}

function renderSport(key){
  state.sportView = key;
  const host = $("#sport");
  const sp = SD && SD.sports && SD.sports[key];
  if(!sp){
    host.innerHTML = `<div class="empty">No data loaded for this sport yet. It appears after the next daily build.</div>`;
    return;
  }
  if(!sp.published){
    host.innerHTML = `<div class="lede"><h2>${sp.name}</h2><p>Not published. In testing, the
      model did not beat simply backing the home side on games it had never seen, so its
      numbers would not mean anything.</p></div>`;
    return;
  }
  host.innerHTML = `<div class="lede"><h2>${sp.name}</h2><p>${sportEvidence(sp)}</p></div>`;
  if(!sp.games.length){
    host.insertAdjacentHTML("beforeend", `<div class="empty">No ${sp.name} games in the next seven days.</div>`);
    return;
  }
  const byDay = {};
  sp.games.forEach(g => (byDay[localDay(g.when)] = byDay[localDay(g.when)] || []).push(g));
  Object.keys(byDay).sort().forEach(d => {
    const games = byDay[d].slice().sort((a,b) => b.confidence - a.confidence);
    const sec = document.createElement("section");
    sec.className = "day";
    sec.innerHTML = `<div class="day-head"><h2>${fmtDay(d)}</h2>
      <div class="count">${games.length} game${games.length===1?"":"s"} · ${games.filter(g=>g.tier!=="No read").length} confident</div></div>
      ${sportRuler()}`;
    games.forEach((g,i) => sec.appendChild(sportRow(g, i, false)));
    host.appendChild(sec);
  });
}

/* sports results on "How it went": same rows as tennis */
function sportsResults(){
  if(!SR || !SR.overall || !(SR.days||[]).length){
    return `<div class="empty" style="max-width:80ch;line-height:1.6"><b>Nothing graded yet.</b>
      NFL, baseball, basketball and rugby picks are graded once played, and only if they were
      published before the start. This fills in from the first day they are on the site.</div>`;
  }
  const days = SR.days, day = days.find(d => d.date === resState.sday) || days[0];
  const tl = (x, label) => x ? `<div class="${x.accuracy >= x.expected ? "good" : "bad"}">
      <span>${label}</span><b>${x.correct} / ${x.n}</b>
      <small>${pct(x.accuracy)}% · quoted ${pct(x.expected)}%</small></div>` : "";
  const row = (g, i) => `<div class="xrow${i%2?" alt":""}${g.ok?"":" miss"}">
      <div class="lg">${(SD && SD.sports[g.sport] || {name:g.sport}).name}</div>
      <div class="tm"><b>${g.home}</b> v <b>${g.away}</b><small>${g.label}</small></div>
      <div class="tp"><span>Picked</span>${g.pick} <em>${pct(g.confidence)}%</em></div>
      <div class="tw"><span>Won</span>${g.winner || "Draw"}<small>${g.score[0]}–${g.score[1]}</small></div>
      <div class="conf"><span class="tier t${SPORT_K[g.tier] ?? 0}">${g.tier}</span></div>
      ${mark(g.ok)}</div>`;
  return `<div class="scoreline" style="margin-top:20px">${tl(SR.overall, "Picked the winner")}
      ${Object.entries(SR.bySport).filter(([k,v]) => v).map(([k,v]) => tl(v, (SD && SD.sports[k] || {name:k}).name)).join("")}</div>
    <div style="margin-top:20px"><div class="ctl-label" style="margin-bottom:6px">Completed day</div>
      <div class="dayseg" id="sdayseg">${days.map(d => `<button data-day="${d.date}" aria-pressed="${d.date===day.date}">
        ${fmtShort(d.date)}<i>${d.correct}/${d.n}</i></button>`).join("")}</div></div>
    <div class="day-head" style="margin-top:22px"><h2>${fmtDay(day.date)}</h2>
      <div class="count">${day.correct} of ${day.n} picked the winner</div></div>
    <div class="xruler"><div>Sport</div><div>Game</div><div>Prediction</div><div>Result</div>
      <div style="text-align:right">Tier</div><div></div></div>
    ${day.games.map(row).join("")}`;
}

function renderResults(){
  const host = $("#results");
  // Two records, not one: a graded football fixture and a graded tennis
  // match are tracked completely separately (score.py, score_tennis.py), so
  // "How it went" is two boards sharing a tab.
  const sportTabs = `<div class="views standalone" id="resSport" style="margin:18px 0 0;max-width:520px">
    <button data-sport="football" aria-pressed="${resState.sport==="football"}">Football</button>
    <button data-sport="tennis" aria-pressed="${resState.sport==="tennis"}">Tennis</button>
    <button data-sport="other" aria-pressed="${resState.sport==="other"}">Other sports</button>
  </div>`;

  if(resState.sport === "other"){
    host.innerHTML = sportTabs + sportsResults();
    const seg = $("#sdayseg");
    if(seg) seg.addEventListener("click", e=>{
      const b = e.target.closest("button"); if(!b) return;
      resState.sday = b.dataset.day; renderResults();
    });
    $("#resSport").addEventListener("click", e=>{
      const b = e.target.closest("button"); if(!b) return;
      resState.sport = b.dataset.sport; renderResults();
    });
    return;
  }

  if(resState.sport === "tennis"){
    host.innerHTML = sportTabs + tennisResults();
    const seg = $("#tdayseg");
    if(seg) seg.addEventListener("click", e=>{
      const b = e.target.closest("button"); if(!b) return;
      resState.tday = b.dataset.day;
      renderResults();
    });
    $("#resSport").addEventListener("click", e=>{
      const b = e.target.closest("button"); if(!b) return;
      resState.sport = b.dataset.sport;
      renderResults();
    });
    return;
  }

  if(!R_DAYS.length){
    host.innerHTML = sportTabs + `<div class="empty" style="max-width:80ch;line-height:1.6">
      <b>Nothing graded yet.</b> This board fills in as results land against
      predictions that were published before kick-off. If the site has only just
      started archiving, or the daily job has not run since the last round of
      fixtures, there is nothing honest to show here yet.</div>`;
    $("#resSport").addEventListener("click", e=>{
      const b = e.target.closest("button"); if(!b) return;
      resState.sport = b.dataset.sport;
      renderResults();
    });
    return;
  }
  const day = R_DAYS.find(d => d.date === resState.day) || R_DAYS[0];
  const tierLine = (day.tiers||[]).map(t =>
    `<b>${t.name}</b> ${t.correct}/${t.n}`).join(" · ");

  host.innerHTML = sportTabs + `
    <div style="margin-top:20px">
      <div class="ctl-label" style="margin-bottom:6px">Completed day</div>
      <div class="dayseg" id="dayseg">${R_DAYS.map(d=>
        `<button data-day="${d.date}" aria-pressed="${d.date===day.date}">
           ${fmtShort(d.date)}<i>${d.correct}/${d.n}</i></button>`).join("")}</div>
    </div>

    <div class="day-head" style="margin-top:22px"><h2>${fmtDay(day.date)}</h2>
      <div class="count">${day.n} graded</div></div>

    <div class="scoreline">
      <div class="${day.accuracy >= day.homeRate ? "good":"bad"}">
        <span>Top pick correct</span><b>${day.correct} / ${day.n}</b>
        <small>${pct(day.accuracy)}% · ${pct(day.homeRate)}% if you always backed home</small></div>
      <div><span>Drawn out</span><b>${day.drawnOut}</b>
        <small>picked a winner, got a draw</small></div>
      <div><span>Exact scorelines</span><b>${day.exactScores}</b>
        <small>of ${day.n}</small></div>
      <div><span>Log loss</span><b>${day.logLoss.toFixed(3)}</b>
        <small>lower is better · 1.099 = knowing nothing</small></div>
    </div>
    ${tierLine ? `<div class="readbar" style="margin-top:10px">By tier on this day: ${tierLine}.
      A tier is only worth reading across many days, not one.</div>` : ""}

    <div class="rruler" style="margin-top:16px">
      <div>Comp</div><div>Home</div>
      <div class="r-bar"><span>Home</span><span>Draw</span><span>Away</span></div>
      <div style="text-align:center">Pred</div><div style="text-align:center">Final</div>
      <div style="text-align:right">Away</div><div style="text-align:right">Conf.</div><div></div>
    </div>
    ${day.games.map(resultRow).join("")}

    <h2 class="sect">Reading the confidence number</h2>
    <div class="prose">
      <p>The percentage on a fixture is the model's chance for its <b>single most likely
      outcome</b>, out of three. It is not a chance of winning a bet and it is not a
      strength rating. Because a draw is always in play, anything in the fifties is close
      to a coin flip dressed up as a number: at <em>52%</em> the model is telling you it
      cannot separate two sides, not that the favourite is likely.</p>
      <p>The tiers below are thresholds, not rankings. <b>Top of the day's board is not
      the same as Strong.</b> Most days produce nothing above the Lean line, and on those
      days the most confident fixture on the page is still a no-read.</p>
    </div>
    <div class="ladder">${ladderTable()}</div>
    <div class="prose"><p><b>Backtest</b> is the hit rate measured across 5,281 fixtures in
    2025/26. <b>Live</b> is this season's published predictions graded after the fact, which
    is the harder test and the one to trust once the sample is large enough. Small live
    samples move around a lot; treat anything under about fifty fixtures as noise.</p></div>

    <h2 class="sect">Is a quoted number worth its face value</h2>
    <div class="ladder">${bandTable()}</div>
    <div class="prose"><p>If the model is honest, the last two columns match. A positive
    error means it is under-selling itself in that band, a negative one that it is
    over-confident. ${R && R.settled && R.celtic ? `Fixtures flagged under <b>Celtic's Law</b>
    have landed <em>${pct(R.celtic.accuracy)}%</em> against <em>${pct(R.settled.accuracy)}%</em>
    for settled ones, across ${R.celtic.n} and ${R.settled.n} fixtures. That gap is why a
    flagged row is dropped one tier before it is labelled.` : ""}</p>
    <p>${R && R.overall ? `Across every graded fixture so far, the model almost never picks a
    draw: <em>${R.overall.picks.d}</em> draw picks against <em>${R.overall.actuals.d}</em> matches
    that actually finished level. Those <em>${R.overall.drawnOut}</em> drawn-out fixtures are the
    single largest category of miss, and no amount of confidence in a favourite protects you
    from one.` : ""}</p></div>`;

  $("#dayseg").addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    resState.day = b.dataset.day;
    renderResults();
    host.scrollIntoView({block:"start", behavior:"auto"});
  });
  $("#resSport").addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    resState.sport = b.dataset.sport;
    renderResults();
  });
}

/* ---------- view switching ---------- */
$("#views").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const v = b.dataset.view;
  $("#views").querySelectorAll("button").forEach(x=>
    x.setAttribute("aria-pressed", x.dataset.view===v));
  const fixtures = v === "fixtures";
  const starred = v === "starred";
  const tennis = v === "tennis";
  const list = v === "list";
  const sport = v.startsWith("sport:") ? v.slice(6) : null;
  $("#controls").hidden = !fixtures;
  $("#days").hidden = !fixtures;
  $("#note").hidden = !fixtures;
  readbarEl.hidden = !fixtures;
  $("#results").hidden = v !== "results";
  $("#starred").hidden = !starred;
  $("#tennis").hidden = !tennis;
  $("#list").hidden = !list;
  $("#sport").hidden = !sport;
  if(sport) renderSport(sport);
  if(list) renderList();
  if(starred) renderStarred();
  if(tennis) renderTennis();
  window.scrollTo({top:0});
});

$("#footer").innerHTML = `
  <p><b>How the numbers are made.</b> Football: a Dixon-Coles adjusted Poisson model over attack and
  defence ratings, with the FIFA ranking for internationals. Tennis: surface Elo, with the ATP ranking
  for men's matches. NFL, baseball, basketball and rugby: Elo per sport. Every model is tested on games
  it was never tuned on before anything is shown, and every row says how often calls at its level
  landed. Rows marked <b>flagged</b> are ones the model is partly blind to and drop a tier; flagged
  before kick-off, never after.</p>
  <p><b>Sources.</b> Fixtures and results from <a href="https://github.com/openfootball">openfootball</a>
  (public domain), ESPN's public scoreboards and
  <a href="https://www.football-data.co.uk">football-data.co.uk</a>; world rankings from FIFA, ATP and
  WTA; tennis history from Jeff Sackmann's archive.</p>
  <p>This is a model, not a tip sheet. It is the model's own independent read; the betting market
  sees team news it does not, and on average prices matches better.</p>`;

render();
updateReadbar();
renderResults();
// The Daily List is the front page; the full board is one tap away.
$('#views button[data-view="list"]').click();
})();
</script>
</body>
</html>
