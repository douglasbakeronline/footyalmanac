<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Almanac — complete fixture statistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* A 1950s American sports annual: aged stock, banner red, foil gold,
     and navy. Home / draw / away map onto navy / gold / red, which keeps the
     probability bar readable while staying inside the period palette. */
  --ink:#1a1511;
  --ink-2:#4b4038;
  --mute:#867a6b;
  --rule:#c6b89e;
  --rule-soft:#ded3bd;
  --paper:#f0e8d6;
  --surface:#fbf6ea;

  --home:#1f3b5c;
  --home-soft:#d3dae4;
  --draw:#a8801f;
  --draw-soft:#eee0c0;
  --away:#96271d;
  --away-soft:#eed6d1;
  --gold:#b08a2e;

  --rail:6px;

  --f-display:'Anton','Barlow Semi Condensed',sans-serif;
  --f-ui:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f-ui);
  font-size:15px;
  line-height:1.4;
  padding:0 20px 80px;
  font-variant-numeric:tabular-nums;
}
.wrap{max-width:1180px;margin:0 auto}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- masthead ----------
   A close restaging of the Grays Sports Almanac jacket. The details that carry
   the resemblance, in order of how much they matter:
     - the two title words are the full width of the cover, not centred text
     - they are stretched horizontally and set solid, so they nearly touch
     - the black outline is heavy and there is a hard offset shadow under it
     - the star banner and year band bleed edge to edge inside a grey margin
     - the lower panel is red, standing in for the sports artwork
   Getting the words to fill the width is what actually makes it read as the
   cover: the reference has almost no air anywhere. */
header{padding:18px 0 0}
.cover{
  position:relative;overflow:hidden;
  background:#9ba1a6;border:3px solid #100e0c;
  padding:9px;text-align:center;
}
.starband{
  background:#c8102e;border:2px solid #100e0c;
  padding:3px 12px;display:flex;align-items:center;justify-content:space-between;
}
.starband b{
  font-family:var(--f-display);font-weight:400;color:#fff;
  font-size:clamp(15px,3.2vw,27px);letter-spacing:clamp(.16em,1.1vw,.34em);
  text-transform:uppercase;line-height:1.1;padding-left:.28em;
  text-shadow:2px 0 0 #100e0c,-2px 0 0 #100e0c,0 2px 0 #100e0c,0 -2px 0 #100e0c;
}
.starband i{
  color:#fff;font-style:normal;letter-spacing:.18em;
  font-size:clamp(9px,1.6vw,15px);
}
h1{margin:5px 0 0;line-height:.82}
h1 span{
  display:block;font-family:var(--f-display);font-weight:400;text-transform:uppercase;
  letter-spacing:-.012em;white-space:nowrap;
  transform:scaleX(1.05);transform-origin:center;
}
h1 .a{
  color:#e0202c;font-size:clamp(34px,8.9vw,88px);
  text-shadow:
    4px 0 0 #100e0c,-4px 0 0 #100e0c,0 4px 0 #100e0c,0 -4px 0 #100e0c,
    3px 3px 0 #100e0c,-3px 3px 0 #100e0c,3px -3px 0 #100e0c,-3px -3px 0 #100e0c;
}
h1 .b{
  color:#fff;font-size:clamp(34px,8.9vw,88px);margin-top:-.04em;
  text-shadow:
    4px 0 0 #100e0c,-4px 0 0 #100e0c,0 4px 0 #100e0c,0 -4px 0 #100e0c,
    3px 3px 0 #100e0c,-3px 3px 0 #100e0c,3px -3px 0 #100e0c,-3px -3px 0 #100e0c,
    8px 8px 0 rgba(16,14,12,.55);
}
.cover .sub{
  font-family:var(--f-ui);font-weight:700;color:#c8102e;
  font-size:clamp(11px,2.5vw,19px);letter-spacing:.05em;text-transform:uppercase;
  margin-top:6px;text-align:center;
}
.cover .yr{margin-top:5px;background:#100e0c;padding:2px 0;text-align:center}
.cover .yr b{
  font-family:var(--f-display);font-weight:400;font-style:italic;color:#f4d21c;
  font-size:clamp(20px,4.8vw,40px);letter-spacing:.01em;
  text-shadow:3px 3px 0 rgba(0,0,0,.5);
}
/* the red panel stands in for the cover artwork, and carries the numbers */
.meta{
  display:flex;gap:0;flex-wrap:wrap;
  background:#c8102e;border:2px solid #100e0c;border-top:0;
  position:relative;
}
.meta div{
  flex:1 1 0;min-width:100px;padding:7px 11px;text-align:left;
  border-right:1px solid rgba(255,255,255,.28);
}
.meta div:last-child{border-right:0}
.meta b{font-family:var(--f-num);font-weight:600;font-size:14.5px;color:#fff;display:block;letter-spacing:-.02em}
.meta span{display:block;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:700;margin-bottom:2px}
.meta small{font-family:var(--f-num);font-size:10.5px;color:rgba(255,255,255,.72)}
.meta .good b{color:#f4d21c}
.meta .bad b{color:#ffd9d9}
.flash{
  position:absolute;right:-30px;bottom:-8px;width:168px;z-index:3;
  background:#f4d21c;border-top:2px solid #100e0c;border-bottom:2px solid #100e0c;
  transform:rotate(-30deg);padding:5px 0;text-align:center;pointer-events:none;
}
.flash span{
  font-family:var(--f-ui);font-weight:700;font-size:8.5px;letter-spacing:.01em;
  text-transform:uppercase;color:#100e0c;line-height:1.3;display:block;white-space:nowrap;
}
@media (max-width:700px){ .flash{display:none} }

/* ---------- honesty strip ---------- */
.note{
  margin-top:12px;padding:9px 13px;border-left:var(--rail) solid var(--draw);
  background:var(--draw-soft);font-size:12.5px;color:#4a3712;max-width:100ch;line-height:1.5;
}
.note:empty{display:none}
.note.stale{border-left-color:var(--away);background:var(--away-soft);color:#5e1e2e}
.record{
  margin-top:16px;padding:13px 15px;background:var(--surface);
  border:1px solid var(--rule);display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end;
}
.record h3{
  font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mute);width:100%;margin-bottom:-4px;
}
.record div span{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:600}
.record div b{display:block;font-family:var(--f-num);font-size:17px;font-weight:600;letter-spacing:-.03em}
.record div small{font-family:var(--f-num);font-size:11px;color:var(--mute);font-weight:400}
.record .beat b{color:var(--home)}
.record .lose b{color:var(--away)}
.note b{font-weight:700}

/* ---------- controls ---------- */
.controls{
  position:sticky;top:0;z-index:20;background:var(--paper);
  padding:10px 0 9px;border-bottom:2px solid var(--ink);
  display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;
}
/* the controls belong to the fixture board, so they go away with it, and a
   display rule on the class would otherwise beat the hidden attribute */
.controls[hidden]{display:none}
.controls > div{min-width:0}
.chips{max-width:none}
.chips{display:flex;gap:4px;flex-wrap:wrap}
button.chip{
  font-family:var(--f-ui);font-size:12.5px;font-weight:600;letter-spacing:.04em;
  border:1px solid var(--rule);background:transparent;color:var(--ink-2);
  padding:4px 8px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;gap:5px;line-height:1.3;
  transition:background .12s,color .12s,border-color .12s;
}
button.chip .flg{box-shadow:0 0 0 .5px rgba(26,21,17,.3)}
button.chip:hover{border-color:var(--ink-2)}
button.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
button.chip:focus-visible{outline:2px solid var(--home);outline-offset:2px}
.seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg button{
  font-family:var(--f-ui);font-size:12.5px;font-weight:600;border:0;background:transparent;
  padding:6px 10px;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--rule);
  white-space:nowrap;
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button:focus-visible{outline:2px solid var(--home);outline-offset:-2px}
.ctl-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* ---------- day ---------- */
.day{margin-top:24px}
.day-head{
  display:flex;align-items:baseline;gap:12px;padding:0 0 6px;
  border-bottom:3px double var(--ink);
}
.day-head h2{
  font-family:var(--f-display);font-weight:400;font-size:16px;
  letter-spacing:.01em;text-transform:uppercase;
}
.day-head .count{font-family:var(--f-num);font-size:12px;color:var(--mute);margin-left:auto}

/* ---------- column ruler ---------- */
.ruler{
  display:grid;grid-template-columns:32px 46px 1fr 258px 74px 1fr 56px;
  gap:10px;align-items:center;padding:7px 8px 5px;
  background:var(--paper);border-bottom:1px solid var(--rule);
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);font-weight:600;
}
.ruler .r-bar,.rruler .r-bar{display:flex;justify-content:space-between}

/* ---------- fixture row ---------- */
/* Row states, each carrying exactly one meaning:
     default   parchment
     alternate a half-tone band, so the eye can track across a wide row
     unrated   faded, the model has no rating for a side
     celtic    amber rail, the model is working blind
     noread    muted type, the number is close to a guess
   Nothing else changes the background, so a tint always means something. */
.row{
  display:grid;grid-template-columns:32px 46px 1fr 258px 74px 1fr 56px;
  gap:10px;align-items:center;
  background:var(--surface);border-bottom:1px solid var(--rule-soft);
  padding:9px 8px;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;
  font-family:var(--f-ui);font-size:15px;color:var(--ink);cursor:pointer;
}
.row:hover{background:#f3ead6}
.row:focus-visible{outline:2px solid var(--home);outline-offset:-2px}
.row[aria-expanded="true"]{background:#f3ead6;box-shadow:inset 0 0 0 1px var(--rule)}

.rank{font-family:var(--f-num);font-size:12px;color:var(--mute);font-weight:500}
.rank.top{color:var(--ink);font-weight:600}
.ko{font-family:var(--f-num);font-size:12.5px;color:var(--ink-2)}
.ko small{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);
  font-family:var(--f-ui);font-weight:600;white-space:nowrap;overflow:hidden}

.side{min-width:0}
.side.away{text-align:right}
.club{
  font-weight:600;font-size:16px;letter-spacing:-.005em;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stat{font-family:var(--f-num);font-size:11px;color:var(--mute);margin-top:2px;white-space:nowrap}
.stat i{font-style:normal}
.stat .pos{color:var(--home)}
.stat .neg{color:var(--away)}

/* ---------- the bar: this is the whole point of the page ---------- */
.bar{position:relative;height:26px;display:flex;background:#f0f2f0}
.bar i{display:block;height:100%;position:relative;overflow:hidden}
.bar .h{background:var(--home)}
.bar .d{background:var(--draw)}
.bar .a{background:var(--away)}
.bar b{
  font-family:var(--f-num);font-size:11px;font-weight:600;color:#fff;
  position:absolute;top:50%;transform:translateY(-50%);left:6px;
  letter-spacing:-.03em;
}
.bar .a b{left:auto;right:6px}
.bar .d b{left:50%;transform:translate(-50%,-50%)}
/* shared reference line: any home block reaching past it is odds-on */
.bar::after{
  content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;
  background:var(--ink);opacity:.5;
}
.conf{font-family:var(--f-num);font-size:14px;font-weight:600;text-align:right}
.tier{
  display:block;font-family:var(--f-ui);font-size:9.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;margin-top:2px;
}
.tier.t3{color:var(--home)}
.tier.t2{color:#2f6b52}
.tier.t1{color:var(--draw)}
.tier.t0{color:var(--mute)}
.row.noread .club{font-weight:500;color:var(--ink-2)}
.row.noread .bar{opacity:.62}
.row.noread .conf{color:var(--mute);font-weight:500}
.readbar{
  margin:9px 0 0;font-size:12.5px;color:var(--ink-2);max-width:100ch;line-height:1.5;
}
.readbar b{font-family:var(--f-num);color:var(--ink)}
.boards{display:flex;gap:0;border:1px solid var(--ink);border-radius:2px;overflow:hidden;margin-top:2px}
.boards button{
  font-family:var(--f-ui);font-size:13.5px;font-weight:600;border:0;background:transparent;
  padding:6px 13px;cursor:pointer;color:var(--ink);border-right:1px solid var(--ink);
  white-space:nowrap;
}
.boards button:last-child{border-right:0}
.boards button[aria-pressed="true"]{background:var(--ink);color:#fff}
.boards button:focus-visible{outline:2px solid var(--home);outline-offset:-3px}
.btts{font-family:var(--f-num);font-size:14px;font-weight:600;text-align:right}
.btts small{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:400;font-family:var(--f-ui)}
.row.bttsmode{grid-template-columns:32px 46px 1fr 258px 74px 1fr 56px}
.conf small{display:block;font-size:9.5px;letter-spacing:.06em;color:var(--mute);font-weight:400;text-transform:uppercase}

/* ---------- top-level views ----------
   Two boards that answer different questions: what is coming, and how the last
   one went. They sit above the controls because switching between them changes
   what the controls even mean. Styled as a band rather than as tabs, so it
   reads as part of the cover rather than as browser chrome. */
.views{
  display:flex;margin-top:0;border:3px solid #100e0c;border-top:0;
  background:#100e0c;
}
.views button{
  flex:1 1 0;font-family:var(--f-display);font-weight:400;font-size:clamp(13px,2.6vw,18px);
  letter-spacing:.08em;text-transform:uppercase;
  border:0;background:#100e0c;color:#9a9086;padding:7px 10px;cursor:pointer;
  border-right:1px solid #3a342e;
}
.views button:last-child{border-right:0}
.views button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.views button:focus-visible{outline:2px solid #f4d21c;outline-offset:-4px}

/* ---------- results review ---------- */
.dayseg{display:flex;flex-wrap:wrap;gap:4px}
.dayseg button{
  font-family:var(--f-ui);font-size:12.5px;font-weight:600;letter-spacing:.03em;
  border:1px solid var(--rule);background:transparent;color:var(--ink-2);
  padding:4px 9px;cursor:pointer;border-radius:2px;line-height:1.3;white-space:nowrap;
}
.dayseg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.dayseg button:focus-visible{outline:2px solid var(--home);outline-offset:2px}
.dayseg button i{font-style:normal;font-family:var(--f-num);opacity:.75;margin-left:5px}

.scoreline{
  display:flex;gap:0;flex-wrap:wrap;margin-top:14px;
  background:var(--surface);border:1px solid var(--rule);
}
.scoreline div{
  flex:1 1 0;min-width:118px;padding:9px 13px;border-right:1px solid var(--rule-soft);
}
.scoreline div:last-child{border-right:0}
.scoreline span{
  display:block;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--mute);font-weight:700;margin-bottom:3px;
}
.scoreline b{display:block;font-family:var(--f-num);font-size:21px;font-weight:600;letter-spacing:-.03em;line-height:1}
.scoreline small{display:block;font-family:var(--f-num);font-size:11px;color:var(--mute);margin-top:3px}
.scoreline .good b{color:#2f6b52}
.scoreline .bad b{color:var(--away)}

.rruler,.rrow{
  display:grid;grid-template-columns:46px 1fr 176px 52px 52px 1fr 68px 26px;
  gap:10px;align-items:center;
}
.rruler{
  padding:7px 8px 5px;border-bottom:1px solid var(--rule);
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);font-weight:600;
}
.rrow{
  background:var(--surface);border-bottom:1px solid var(--rule-soft);
  padding:9px 8px;font-size:15px;
}
.rrow.alt{background:#f6efdc}
.rrow.celtic{box-shadow:inset 3px 0 0 var(--draw)}
.rrow .sc{font-family:var(--f-num);font-size:15px;font-weight:600;text-align:center;letter-spacing:-.03em}
.rrow .sc.pred{font-size:13px;font-weight:400;color:var(--mute)}
.rrow .lg{font-family:var(--f-num);font-size:11px;color:var(--mute);font-weight:500}
.mark{
  font-family:var(--f-ui);font-weight:700;font-size:15px;text-align:center;line-height:1;
}
.mark.ok{color:#2f6b52}
.mark.no{color:var(--away)}
.rrow.miss .club{color:var(--ink-2);font-weight:500}
.rrow.miss .bar{opacity:.55}

.ladder{margin-top:26px}
.ladder table{border-collapse:collapse;width:100%;max-width:94ch;font-family:var(--f-num);font-size:13px}
.ladder th{
  text-align:right;font-family:var(--f-ui);font-weight:700;color:var(--mute);
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:0 8px 5px 0;
  border-bottom:1px solid var(--rule);
}
.ladder th:first-child{text-align:left}
.ladder td{text-align:right;padding:6px 8px 6px 0;border-bottom:1px solid var(--rule-soft)}
.ladder td:first-child{
  text-align:left;font-family:var(--f-ui);font-size:14px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;
}
.ladder td.thin{font-weight:400;color:var(--mute);font-family:var(--f-num);font-size:12px;
  letter-spacing:0;text-transform:none}
.ladder .t3 td:first-child{color:var(--home)}
.ladder .t2 td:first-child{color:#2f6b52}
.ladder .t1 td:first-child{color:var(--draw)}
.ladder .t0 td:first-child{color:var(--mute)}
.prose{max-width:78ch;font-size:14px;line-height:1.6;color:var(--ink-2);margin-top:12px}
.prose p{margin-top:11px}
.prose b{color:var(--ink)}
.prose em{font-style:normal;font-family:var(--f-num);font-size:13px;color:var(--ink)}
.sect{
  margin-top:34px;padding-bottom:6px;border-bottom:3px double var(--ink);
  font-family:var(--f-display);font-weight:400;font-size:16px;
  letter-spacing:.01em;text-transform:uppercase;
}

/* ---------- expanded detail ---------- */
.detail{background:#f3ead6;border-bottom:2px solid var(--ink);padding:16px 18px 18px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.detail h3{
  font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mute);margin-bottom:8px;
}
table.sheet{border-collapse:collapse;width:100%;font-family:var(--f-num);font-size:12px}
table.sheet th{
  text-align:right;font-weight:500;color:var(--mute);padding:2px 7px 2px 0;
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;
}
table.sheet th:first-child{text-align:left}
table.sheet td{text-align:right;padding:3px 7px 3px 0;border-top:1px solid var(--rule-soft)}
table.sheet td:first-child{text-align:left;font-family:var(--f-ui);font-size:13.5px;font-weight:600}
.why{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);
  font-size:13.5px;color:var(--ink-2);max-width:82ch;
}
.why em{font-style:normal;font-family:var(--f-num);font-size:12.5px;color:var(--ink)}
.flag{
  display:inline-block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;padding:2px 6px;border-radius:2px;margin-right:6px;
}
.flag.carry{background:var(--draw-soft);color:#5f4715}
.flag.live{background:var(--home-soft);color:#0d443f}


.row.unrated .club{color:var(--mute);font-weight:500}
.row.unrated .bar{opacity:.38}
.row.unrated .conf{color:var(--mute);font-weight:500}
.row.unrated .stat{opacity:.8}
.stat.none{color:var(--away);opacity:.85}
.flg{
  width:15px;height:10.3px;flex:0 0 auto;border-radius:1px;
  box-shadow:0 0 0 .5px rgba(20,24,29,.28);vertical-align:baseline;
}
.club{display:flex;align-items:center;gap:7px}
.side.away .club{flex-direction:row-reverse}
.club span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xg{font-family:var(--f-num);font-size:12.5px;text-align:center;color:var(--ink-2);white-space:nowrap}
.xg small{display:block;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-family:var(--f-ui);font-weight:600}
.xg b{font-weight:600;color:var(--ink)}
.flag.unrated{background:var(--away-soft);color:#6a1f31}
.flag.manual{background:#d8dced;color:#2b3560}
.flag.celtic{background:var(--draw-soft);color:#5f4715}
.flag.out{background:var(--away-soft);color:#6a1f31}
.outlist{margin-top:8px;font-family:var(--f-num);font-size:11.5px;color:var(--ink-2);line-height:1.65}
.outlist i{font-style:normal;color:var(--away)}
.outlist span{color:var(--mute)}
.mini-out{color:var(--away);font-family:var(--f-ui);font-weight:600}
/* Alternate rows carry a faint tint, as a printed results table does. It is
   there to help the eye track across a wide row, so it must be weak enough to
   read as texture rather than as meaning. Every state that DOES mean something
   (flagged, unrated, no read) is signalled by rail, weight or opacity instead,
   so nothing competes with it. */
.row.alt{background:#f6efe0}
.row.alt{background:#f6efdc}
.row.celtic{box-shadow:inset 3px 0 0 var(--draw)}
.row.unrated{opacity:.72}
.row.celtic.alt{background:#f6efe0}
.cl{
  display:inline-block;font-family:var(--f-num);font-size:9.5px;font-weight:600;
  color:var(--draw);border:1px solid var(--draw);border-radius:2px;
  padding:0 3px;line-height:1.35;margin-left:5px;vertical-align:1px;
}
.pred{font-family:var(--f-num);text-align:center;white-space:nowrap;line-height:1.25}
.pred b{display:block;font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.pred small{display:block;font-size:10.5px;color:var(--mute);letter-spacing:-.02em}
.empty{padding:40px 8px;color:var(--mute);font-size:14px}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--mute);max-width:80ch}
footer a{color:var(--ink-2)}

  .rrow .sc::before{

}

    + '<pre style="margin-top:14px;font-family:var(--f-num);font-size:13px;background:#fff;padding:12px;'
    + 'border-left:6px solid var(--draw)">python3 build.py --days 4 --top 50\npython3 -m http.server 8000</pre></div>';
  return;
}
const $ = s => document.querySelector(s);
const pct = x => Math.round(x*100);
const state = { leagues:new Set(), sort:"conf", open:null, board:"win" };
// Which flags the sprite actually carries. Read once, lazily, because flag() is
// called while building the league chips, before this file's later
// declarations have run.
let FLAGS = null;

/* ---------- freshness ----------
   A build is a snapshot with a few days of fixtures in it. If the rebuild does
   not run, the page still holds yesterday's games and will happily show them as
   though they were the slate. Days in the past are dropped at render time and
   an out-of-date build says so, rather than quietly looking wrong. */
const todayISO = (()=>{ const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); })();

const upcoming = D.days.filter(d => d.date >= todayISO);
const droppedDays = D.days.length - upcoming.length;
const ageHours = (Date.now() - new Date(D.generated).getTime()) / 36e5;
const isStale = ageHours > 30 || upcoming.length === 0;

/* ---------- header ---------- */
const fmtDay = iso => new Date(iso+"T12:00:00").toLocaleDateString("en-GB",
  {weekday:"long", day:"numeric", month:"long"});
const fmtShort = iso => new Date(iso+"T12:00:00").toLocaleDateString("en-GB",
  {day:"numeric", month:"short"});

$("#window").textContent = D.season.replace("-", "—20");
const rangeText = upcoming.length
  ? fmtShort(upcoming[0].date)+" – "+fmtShort(upcoming[upcoming.length-1].date)
  : "none upcoming";

const total = upcoming.reduce((a,d)=>a+d.count,0);
const live  = upcoming.reduce((a,d)=>a+d.games.filter(g=>g.evidence!=="carryover").length,0);
const R = window.__RECORD__;
const metaCells = [
  ["Covering", rangeText, ""],
  ["Fixtures priced", total, ""],
  ["Competitions", new Set(upcoming.flatMap(d=>d.games.map(g=>g.league))).size, ""],
  ["Live evidence", live + " of " + total, "fixtures"],
];
// The live record belongs in the masthead, not in a panel of its own. It is
// the single most important number on the page and it should be as prominent
// as the fixture count, whether it flatters the model or not.
if(R && R.overall && R.overall.n >= 5){
  const o = R.overall;
  metaCells.push(["Top pick correct", pct(o.accuracy) + "%",
                  "of " + o.n + " graded · " + pct(o.homeRate) + "% baseline",
                  o.accuracy > o.homeRate ? "good" : "bad"]);
  metaCells.push(["Exact scorelines", o.exactScores, "of " + o.n, ""]);
} else {
  metaCells.push(["Built", new Date(D.generated).toLocaleString("en-GB",
    {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}), ""]);
}
$("#meta").insertAdjacentHTML("afterbegin", metaCells.map(([k,v,sub,cls])=>
  `<div class="${cls||""}"><span>${k}</span><b>${v}</b>${sub?`<small>${sub}</small>`:""}</div>`).join(""));

const ageText = ageHours < 1 ? "less than an hour ago"
  : ageHours < 36 ? Math.round(ageHours)+" hours ago"
  : Math.round(ageHours/24)+" days ago";

if(isStale){
  $("#note").className = "note stale";
  $("#note").innerHTML = upcoming.length === 0
    ? `<b>This build has run out of fixtures.</b> It was generated ${ageText} and every
       match in it has now been played. The daily rebuild has not run. Trigger it from the
       repository's Actions tab, or check whether the scheduled workflow is still enabled.`
    : `<b>This build was generated ${ageText}.</b> The daily rebuild has not run, so these numbers take
       no account of results since then${droppedDays ? ` and ${droppedDays} day${droppedDays>1?"s":""} of played fixtures ${droppedDays>1?"have":"has"} been hidden` : ""}.
       Trigger a rebuild from the repository's Actions tab.`;
} else {
  $("#note").innerHTML = live===0
    ? `<b>Nothing has been played yet.</b> Every number on this page comes from last season's completed results, carried across divisions for promoted and relegated sides. It knows nothing about this summer's transfers or managerial changes. Confidence is deliberately flattened until real results arrive.`
    : `<b>${live} of ${total}</b> fixtures have some current-season evidence behind them. The rest are priced from last season alone.`;
}

/* ---------- how much of today is actually worth reading ---------- */
const allGames = upcoming.flatMap(d => d.games);
const readbarEl = document.createElement("div");
readbarEl.className = "readbar";
$("#note").after(readbarEl);

function updateReadbar(){
  if(!allGames.length){ readbarEl.innerHTML=""; return; }
  if(state.board === "btts"){
    const n = allGames.filter(g => g.btts >= 0.58 && !g.celtic && !g.unrated).length;
    readbarEl.innerHTML = `<b>${n}</b> of ${allGames.length} fixtures reach 58% for both teams
      to score. Be careful with this board: across last season the model's very best
      both-score calls came in <b>59%</b> of the time against a <b>54%</b> base rate for all
      fixtures. It is a real edge but a thin one, far weaker than the winner board.`;
  } else {
    const n = allGames.filter(g => g.confidence >= 0.55 && !g.celtic && !g.unrated).length;
    readbarEl.innerHTML = n === 0
      ? `<b>None</b> of today's ${allGames.length} fixtures clear the threshold where this model
         has historically been worth listening to. That is normal — across last season three
         quarters of all fixtures fell below it.`
      : `<b>${n}</b> of ${allGames.length} fixtures clear the 55% mark, where the model's top
         pick has historically been right about two thirds of the time. The rest are closer to
         guesswork and are marked <b>No read</b>.`;
  }
}
updateReadbar();

/* ---------- league chips ---------- */
const present = [...new Set(upcoming.flatMap(d=>d.games.map(g=>g.league)))]
  .sort((a,b)=>D.leagues.find(l=>l.code===a).order - D.leagues.find(l=>l.code===b).order);
const lname = c => D.leagues.find(l=>l.code===c);

const chips = $("#chips");
chips.innerHTML = `<button class="chip" data-league="*" aria-pressed="true">All</button>` +
  present.map(c=>{
    const L = lname(c);
    const g = upcoming.flatMap(d=>d.games).find(x=>x.league===c);
    return `<button class="chip" data-league="${c}" aria-pressed="false"` +
           ` title="${L.country} ${L.name}">${g?flag(g.iso,L.country):""}${L.short}</button>`;
  }).join("");

chips.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const c = b.dataset.league;
  if(c==="*"){ state.leagues.clear(); }
  else { state.leagues.has(c) ? state.leagues.delete(c) : state.leagues.add(c); }
  chips.querySelectorAll("button").forEach(x=>{
    const k = x.dataset.league;
    x.setAttribute("aria-pressed", k==="*" ? state.leagues.size===0 : state.leagues.has(k));
  });
  render();
});

$("#boards").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  state.board=b.dataset.board; state.open=null;
  $("#boards").querySelectorAll("button").forEach(x=>
    x.setAttribute("aria-pressed", x.dataset.board===state.board));
  // Each board has its own natural ordering; switching resets to it.
  // The primary sort means something different on each board, so relabel it
  // rather than leaving the control with nothing selected.
  const primary = $("#sortPrimary");
  primary.dataset.sort = state.board==="btts" ? "btts" : "conf";
  primary.textContent  = state.board==="btts" ? "Most likely" : "One-sided";
  state.sort = primary.dataset.sort;
  $("#sort").querySelectorAll("button").forEach(x=>
    x.setAttribute("aria-pressed", x.dataset.sort===state.sort));
  render(); updateReadbar();
});

$("#sort").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  state.sort = b.dataset.sort;
  $("#sort").querySelectorAll("button").forEach(x=>
    x.setAttribute("aria-pressed", x.dataset.sort===state.sort));
  render();
});

/* ---------- how much to trust a number ----------
   A percentage on its own tells a reader nothing: 47% on a three-way market is
   barely above the 33% you would get by guessing. These bands are the model's
   own backtested hit rates across 5,281 fixtures in 2025/26, so the label is a
   measurement rather than a description. Celtic's Law drops a fixture one band,
   because flagged fixtures measurably underperform their quoted confidence. */
const TIERS = [
  {min:0.70, k:3, name:"Strong",  was:"79%"},
  {min:0.62, k:2, name:"Firm",    was:"66%"},
  {min:0.55, k:1, name:"Lean",    was:"61%"},
  {min:0.00, k:0, name:"No read", was:"44%"},
];
/* Both-teams-to-score bands, measured the same way. Note how much flatter they
   are than the winner bands: the very best call is 59% against a 54% base rate.
   That gap is the honest size of the signal. */
const BTTS_TIERS = [
  {min:0.58, k:2, name:"Likely",  was:"59%"},
  {min:0.55, k:1, name:"Leaning", was:"57%"},
  {min:0.50, k:0, name:"Toss-up", was:"53%"},
  {min:0.00, k:0, name:"Unlikely",was:"49%"},
];
function bttsTier(g){
  let t = BTTS_TIERS.find(t => g.btts >= t.min);
  if(g.celtic || g.unrated){
    const i = BTTS_TIERS.indexOf(t);
    if(i < BTTS_TIERS.length - 1) t = BTTS_TIERS[i + 1];
  }
  return t;
}

function tier(g){
  let t = TIERS.find(t => g.confidence >= t.min);
  if(g.celtic || g.unrated){
    const i = TIERS.indexOf(t);
    if(i < TIERS.length - 1) t = TIERS[i + 1];
  }
  return t;
}

/* ---------- row rendering ---------- */
const rank = {
  conf:  (a,b)=> b.confidence - a.confidence,
  btts:  (a,b)=> b.btts - a.btts,
  upset: (a,b)=> b.p.a - a.p.a,
  goals: (a,b)=> (b.xg[0]+b.xg[1]) - (a.xg[0]+a.xg[1]),
  time:  (a,b)=> (a.time||"99:99").localeCompare(b.time||"99:99") || b.confidence-a.confidence,
};
// Straight order, no special cases. Every day reads top to bottom by
// confidence; unrated and flagged rows are marked visually instead of being
// pushed around, so the ranking always means the same thing.
const sortFns = rank;

/* The flag set is read off the sprite rather than hard-coded, so a competition
   from a country with no flag drawn yet renders without one instead of leaving
   an empty box on every row. Add a symbol to the sprite and it appears. */
function flag(iso, country){
  if(FLAGS === null) FLAGS = new Set(
    [...document.querySelectorAll('symbol[id^="f-"]')].map(s => s.id.slice(2)));
  if(!iso || !FLAGS.has(iso)) return "";
  return `<svg class="flg" role="img" aria-label="${country}"><use href="#f-${iso}"/></svg>`;
}

function sideStats(t){
  const s = t.now && t.now.P ? t.now : t.last;
  if(!s) return `<div class="stat none">not rated — no season on file</div>`;
  const gd = s.GD>0 ? `<i class="pos">+${s.GD}</i>` : (s.GD<0?`<i class="neg">${s.GD}</i>`:`<i>0</i>`);
  const f = t.form ? ` · ${t.form.seq}` : "";
  const miss = t.out ? ` · <span class="mini-out">${t.out.length} out</span>` : "";
  return `<div class="stat">${s.PPG.toFixed(2)} ppg · ${s.W}-${s.D}-${s.L} · ${gd}${f}${miss}</div>`;
}

function bttsBar(g){
  const y=pct(g.btts), n=100-y;
  return `<div class="bar" role="img" aria-label="Both teams to score ${y} per cent">
    <i class="h" style="width:${y}%">${y>=13?`<b>${y}</b>`:""}</i>
    <i class="a" style="width:${n}%">${n>=13?`<b>${n}</b>`:""}</i>
  </div>`;
}

function bar(g){
  const h=pct(g.p.h), d=pct(g.p.d), a=100-h-d;
  const lbl=(v,min)=> v>=min ? `<b>${v}</b>` : "";
  return `<div class="bar" role="img" aria-label="Home win ${h} per cent, draw ${d} per cent, away win ${a} per cent">
    <i class="h" style="width:${h}%">${lbl(h,13)}</i>
    <i class="d" style="width:${d}%">${lbl(d,13)}</i>
    <i class="a" style="width:${a}%">${lbl(a,13)}</i>
  </div>`;
}

function teamSheet(t, label){
  const rows = [];
  if(t.last) rows.push(["2025/26", t.last]);
  if(t.now && t.now.P) rows.unshift(["This season", t.now]);
  const body = rows.map(([k,s])=>`<tr>
      <td>${k}</td><td>${s.P}</td><td>${s.W}</td><td>${s.D}</td><td>${s.L}</td>
      <td>${s.GF}</td><td>${s.GA}</td><td>${s.GD>0?"+":""}${s.GD}</td>
      <td>${s.Pts}</td><td>${s.PPG.toFixed(2)}</td></tr>`).join("");
  const flags = [
    t.unrated ? `<span class="flag unrated">not rated</span>` : "",
    t.adj ? `<span class="flag manual">manual override</span>` : "",
    t.out ? `<span class="flag out">${t.out.length} missing</span>` : "",
    t.carriedFrom ? `<span class="flag carry">carried from ${lname(t.carriedFrom).name}</span>` : "",
    (t.now && t.now.P) ? `<span class="flag live">${t.now.P} played</span>` : "",
  ].join("");
  return `<div>
    <h3>${label} — ${t.name}</h3>
    ${flags}
    <table class="sheet">
      <tr><th>Record</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>PPG</th></tr>
      ${body || `<tr><td colspan="10">No completed matches on record.</td></tr>`}
    </table>
    <div class="stat" style="margin-top:8px">
      attack ${t.att.toFixed(2)} · defence ${t.def.toFixed(2)}
      ${t.form ? " · last "+(t.form.max/3)+": "+t.form.pts+" pts ("+t.form.seq+")" : " · form: not yet available"}
    </div>
    ${t.adj ? `<div class="stat" style="margin-top:6px;color:#2b3560">
        hand-adjusted: attack x${t.adj.att.toFixed(2)}, defence x${t.adj.def.toFixed(2)}${t.adj.why?" — "+t.adj.why:""}
      </div>` : ""}
    ${t.out ? `<div class="outlist">unavailable:
        ${t.out.map(p=>`<i>${p.name}</i> <span>(${p.importance} ${p.role}${p.why?", "+p.why:""})</span>`).join(" · ")}
        <br><span>net effect: attack x${t.outFactors[0].toFixed(2)}, defence x${t.outFactors[1].toFixed(2)}</span>
      </div>` : ""}
  </div>`;
}

function detail(g){
  const edge = g.p.h>g.p.a ? g.home : g.away;
  const dir  = g.p.h>g.p.a ? "home" : "away";
  const missing = [g.home,g.away].filter(t=>t.unrated).map(t=>t.name);

  const why = missing.length
    ? `<b>This fixture is not really priced.</b> ${missing.join(" and ")}
       ${missing.length>1?"have":"has"} no season on file — almost certainly promoted from a
       division this build does not yet cover — so the model substitutes a league-average rating
       and the split below is close to what you would get from knowing nothing at all.
       Treat the ${pct(g.confidence)}% as a placeholder, not a read.`
    : `Model expects <em>${g.xg[0].toFixed(2)} – ${g.xg[1].toFixed(2)}</em> goals,
       likeliest scoreline <em>${g.score[0]}–${g.score[1]}</em>.
       The ${dir} edge comes from ${edge.name}'s attack rating of
       <em>${edge.att.toFixed(2)}</em> against a defence rating of
       <em>${(dir==="home"?g.away.def:g.home.def).toFixed(2)}</em>, before a home-ground
       adjustment worth about a third of a goal.
       ${g.evidence==="carryover"
         ? " Nothing has been played this season, so this rests entirely on 2025/26 and takes no account of summer transfers."
         : ""}`;

  const cl = g.celtic ? `<div class="why" style="border-top:1px solid var(--rule);color:#5f4715">
      <span class="flag celtic">Celtic's Law</span>
      Flagged before kick-off as one the model is blind to: ${g.celtic.reasons.join("; ")}.
      ${g.celtic.early ? "Fewer than ten matches have been played, when the effect is strongest. " : ""}
      Across 2025/26, fixtures like this were called correctly
      <em>${g.celtic.early ? "43.8%" : "47.2%"}</em> of the time against
      <em>${g.celtic.early ? "48.8%" : "50.4%"}</em> for settled ones. This fixture's split is
      not wrong so much as worth less than the same number on an unflagged row.
    </div>` : "";

  if(state.board === "btts"){
    const B = bttsTier(g);
    const bv = `<div class="why" style="border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:0">
        <b>${B.name}: ${pct(g.btts)}% both teams score.</b>
        Expected goals of <em>${g.xg[0].toFixed(2)}</em> and <em>${g.xg[1].toFixed(2)}</em> put the
        chance of over 2.5 goals at <em>${pct(g.over25)}%</em>.
        Fixtures quoted around here came in <em>${B.was}</em> of the time last season, against a
        <em>54%</em> base rate across all fixtures. Goals markets are much harder to call from
        season averages than the result is, so treat this as a nudge rather than a read.
      </div>`;
    return `<div class="detail">${bv}
      <div class="detail-grid" style="margin-top:16px">${teamSheet(g.home,"Home")}${teamSheet(g.away,"Away")}</div>
    </div>`;
  }
  const T = tier(g);
  const side = g.p.h>=g.p.d && g.p.h>=g.p.a ? g.home.name
             : (g.p.a>=g.p.d ? g.away.name : "a draw");
  const verdict = T.k === 0
    ? `<div class="why" style="border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:0">
         <b>No read.</b> At ${pct(g.confidence)}% this is close to the 33% you would get from
         guessing between three outcomes. Fixtures the model quoted in this range came in
         ${T.was} of the time last season. It is telling you these sides are hard to separate,
         not that ${side} is likely.
       </div>`
    : `<div class="why" style="border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:0">
         <b>${T.name} read on ${side}.</b> Fixtures the model quoted around ${pct(g.confidence)}%
         came in ${T.was} of the time across 5,281 matches last season${g.celtic ? ", though this one is flagged below and should be discounted a notch" : ""}.
       </div>`;

  return `<div class="detail">
    ${verdict}
    <div class="detail-grid" style="margin-top:16px">
      ${teamSheet(g.home,"Home")}
      ${teamSheet(g.away,"Away")}
    </div>
    <div class="why">${why}</div>
    ${cl}
  </div>`;
}

function render(){
  const host = $("#days");
  host.innerHTML = "";
  let shown = 0;

  upcoming.forEach(day=>{
    let games = day.games.filter(g=> state.leagues.size===0 || state.leagues.has(g.league));
    if(!games.length) return;
    games = games.slice().sort(sortFns[state.sort]);
    shown += games.length;

    const sec = document.createElement("section");
    sec.className = "day";
    sec.innerHTML = `
      <div class="day-head">
        <h2>${fmtDay(day.date)}</h2>
        <div class="count">${games.length} fixture${games.length===1?"":"s"}</div>
      </div>
      <div class="ruler">
        <div>#</div><div>K/O</div><div>Home</div>
        <div class="r-bar">${state.board==="btts"
          ? `<span>Both score</span><span>Not both</span>`
          : `<span>Home win</span><span>Draw</span><span>Away win</span>`}</div>
        <div style="text-align:center">Score · xG</div>
        <div style="text-align:right">Away</div><div style="text-align:right">Conf.</div>
      </div>`;

    games.forEach((g,i)=>{
      const id = day.date+"|"+g.home.name+"|"+g.away.name;
      const btn = document.createElement("button");
      const btts = state.board === "btts";
      const T = btts ? bttsTier(g) : tier(g);
      btn.className = "row" + (i % 2 ? " alt" : "")
                    + (g.unrated ? " unrated" : "") + (g.celtic ? " celtic" : "")
                    + (T.k === 0 ? " noread" : "");
      btn.setAttribute("aria-expanded", state.open===id ? "true":"false");
      btn.innerHTML = `
        <div class="rank ${i<3?"top":""}">${String(i+1).padStart(2,"0")}</div>
        <div class="ko">${g.time||"TBC"}<small>${g.short}</small></div>
        <div class="side"><div class="club">${flag(g.iso,g.country)}<span>${g.home.name}</span></div>${sideStats(g.home)}</div>
        ${btts ? bttsBar(g) : bar(g)}
        <div class="pred"><b>${g.score[0]}–${g.score[1]}</b><small>${g.xg[0].toFixed(2)}–${g.xg[1].toFixed(2)}</small></div>
        <div class="side away"><div class="club">${flag(g.iso,g.country)}<span>${g.away.name}</span></div>${sideStats(g.away)}</div>
        <div class="conf">${pct(btts ? g.btts : g.confidence)}${g.celtic?`<span class="cl" title="Celtic&#39;s Law — the model is working blind here">CL</span>`:""}<span class="tier t${T.k}">${T.name}</span></div>`;
      btn.addEventListener("click", ()=>{ state.open = state.open===id ? null : id; render(); });
      sec.appendChild(btn);
      if(state.open===id){
        const dv = document.createElement("div");
        dv.innerHTML = detail(g);
        sec.appendChild(dv.firstElementChild);
      }
    });
    host.appendChild(sec);
  });

  if(!shown) host.innerHTML = upcoming.length
    ? `<div class="empty">No fixtures match that filter. Clear a competition to see more.</div>`
    : `<div class="empty">Nothing left to show. Every fixture in this build has been played.</div>`;
}

/* ---------- the review board ----------
   Predictions are worth nothing unless someone goes back and checks them, and
   a page that only ever shows the future is asking to be believed on nothing.
   This board reads a completed day back against what was published before it
   kicked off: which tier each pick sat in, what happened, and where the misses
   came from. The tier hit rates underneath are the live version of the labels
   the fixture board uses, so a reader can see whether "Lean" has meant anything
   on this season's fixtures rather than only in a backtest. */
const resState = { day: null };
const R_DAYS = (R && R.days) || [];
if(R_DAYS.length) resState.day = R_DAYS[0].date;

const mark = ok => `<div class="mark ${ok?"ok":"no"}" aria-label="${ok?"correct":"wrong"}">${ok?"✓":"✗"}</div>`;
const OUTCOME = {h:"home win", d:"draw", a:"away win"};

function resultRow(g, i){
  const L = lname(g.league) || {short:g.league, iso:"", country:""};
  const h = pct(g.p[0]), d = pct(g.p[1]), a = 100-h-d;
  const lbl = (v,min) => v>=min ? `<b>${v}</b>` : "";
  return `<div class="rrow${i%2?" alt":""}${g.celtic?" celtic":""}${g.ok?"":" miss"}">
    <div class="lg">${L.short}</div>
    <div class="side"><div class="club">${flag(L.iso,L.country)}<span>${g.home}</span></div></div>
    <div class="bar" role="img" aria-label="Home win ${h} per cent, draw ${d} per cent, away win ${a} per cent">
      <i class="h" style="width:${h}%">${lbl(h,15)}</i>
      <i class="d" style="width:${d}%">${lbl(d,15)}</i>
      <i class="a" style="width:${a}%">${lbl(a,15)}</i>
    </div>
    <div class="sc pred" title="predicted scoreline">${g.predScore[0]}–${g.predScore[1]}</div>
    <div class="sc act" title="final score">${g.result[0]}–${g.result[1]}</div>
    <div class="side away"><div class="club">${flag(L.iso,L.country)}<span>${g.away}</span></div></div>
    <div class="conf">${pct(g.confidence)}${g.celtic?`<span class="cl" title="Celtic&#39;s Law — the model was working blind here">CL</span>`:""}<span class="tier t${g.k}">${g.tier}</span></div>
    ${mark(g.ok)}
  </div>`;
}

function ladderTable(){
  const live = (R && R.tiers) || [];
  const rows = TIERS.map(t => {
    const l = live.find(x => x.name === t.name);
    return `<tr class="t${t.k}">
      <td>${t.name}</td>
      <td class="thin">${t.min>0 ? pct(t.min)+"% and above" : "below 55%"}</td>
      <td>${t.was}</td>
      <td>${l ? l.n : "—"}</td>
      <td>${l ? pct(l.hit)+"%" : "—"}</td>
      <td class="thin">${l ? (l.hit>=l.expected?"+":"")+Math.round((l.hit-l.expected)*100)+" pts" : "—"}</td>
    </tr>`;
  }).join("");
  return `<table>
    <tr><th>Tier</th><th>Confidence</th><th>Backtest</th>
        <th>Live picks</th><th>Live hit</th><th style="text-align:right">vs quoted</th></tr>
    ${rows}</table>`;
}

function bandTable(){
  const b = (R && R.bands) || [];
  if(!b.length) return "";
  return `<table>
    <tr><th>Quoted confidence</th><th>Fixtures</th><th>Average quote</th><th>Actually landed</th><th style="text-align:right">Error</th></tr>
    ${b.map(x=>`<tr>
      <td class="thin" style="font-family:var(--f-num);font-size:13px">${pct(x.from)}% – ${pct(x.to)}%</td>
      <td>${x.n}</td><td>${pct(x.expected)}%</td><td>${pct(x.hit)}%</td>
      <td>${x.hit>=x.expected?"+":""}${Math.round((x.hit-x.expected)*100)} pts</td>
    </tr>`).join("")}</table>`;
}

function renderResults(){
  const host = $("#results");
  if(!R_DAYS.length){
    host.innerHTML = `<div class="empty" style="max-width:80ch;line-height:1.6">
      <b>Nothing graded yet.</b> This board fills in as results land against
      predictions that were published before kick-off. If the site has only just
      started archiving, or the daily job has not run since the last round of
      fixtures, there is nothing honest to show here yet.</div>`;
    return;
  }
  const day = R_DAYS.find(d => d.date === resState.day) || R_DAYS[0];
  const tierLine = (day.tiers||[]).map(t =>
    `<b>${t.name}</b> ${t.correct}/${t.n}`).join(" · ");

  host.innerHTML = `
    <div style="margin-top:20px">
      <div class="ctl-label" style="margin-bottom:6px">Completed day</div>
      <div class="dayseg" id="dayseg">${R_DAYS.map(d=>
        `<button data-day="${d.date}" aria-pressed="${d.date===day.date}">
           ${fmtShort(d.date)}<i>${d.correct}/${d.n}</i></button>`).join("")}</div>
    </div>

    <div class="day-head" style="margin-top:22px"><h2>${fmtDay(day.date)}</h2>
      <div class="count">${day.n} graded</div></div>

    <div class="scoreline">
      <div class="${day.accuracy >= day.homeRate ? "good":"bad"}">
        <span>Top pick correct</span><b>${day.correct} / ${day.n}</b>
        <small>${pct(day.accuracy)}% · ${pct(day.homeRate)}% if you always backed home</small></div>
      <div><span>Drawn out</span><b>${day.drawnOut}</b>
        <small>picked a winner, got a draw</small></div>
      <div><span>Exact scorelines</span><b>${day.exactScores}</b>
        <small>of ${day.n}</small></div>
      <div><span>Log loss</span><b>${day.logLoss.toFixed(3)}</b>
        <small>lower is better · 1.099 = knowing nothing</small></div>
    </div>
    ${tierLine ? `<div class="readbar" style="margin-top:10px">By tier on this day: ${tierLine}.
      A tier is only worth reading across many days, not one.</div>` : ""}

    <div class="rruler" style="margin-top:16px">
      <div>Comp</div><div>Home</div>
      <div class="r-bar"><span>Home</span><span>Draw</span><span>Away</span></div>
      <div style="text-align:center">Pred</div><div style="text-align:center">Final</div>
      <div style="text-align:right">Away</div><div style="text-align:right">Conf.</div><div></div>
    </div>
    ${day.games.map(resultRow).join("")}

    <h2 class="sect">Reading the confidence number</h2>
    <div class="prose">
      <p>The percentage on a fixture is the model's chance for its <b>single most likely
      outcome</b>, out of three. It is not a chance of winning a bet and it is not a
      strength rating. Because a draw is always in play, anything in the fifties is close
      to a coin flip dressed up as a number: at <em>52%</em> the model is telling you it
      cannot separate two sides, not that the favourite is likely.</p>
      <p>The tiers below are thresholds, not rankings. <b>Top of the day's board is not
      the same as Strong.</b> Most days produce nothing above the Lean line, and on those
      days the most confident fixture on the page is still a no-read.</p>
    </div>
    <div class="ladder">${ladderTable()}</div>
    <div class="prose"><p><b>Backtest</b> is the hit rate measured across 5,281 fixtures in
    2025/26. <b>Live</b> is this season's published predictions graded after the fact, which
    is the harder test and the one to trust once the sample is large enough. Small live
    samples move around a lot; treat anything under about fifty fixtures as noise.</p></div>

    <h2 class="sect">Is a quoted number worth its face value</h2>
    <div class="ladder">${bandTable()}</div>
    <div class="prose"><p>If the model is honest, the last two columns match. A positive
    error means it is under-selling itself in that band, a negative one that it is
    over-confident. ${R && R.settled && R.celtic ? `Fixtures flagged under <b>Celtic's Law</b>
    have landed <em>${pct(R.celtic.accuracy)}%</em> against <em>${pct(R.settled.accuracy)}%</em>
    for settled ones, across ${R.celtic.n} and ${R.settled.n} fixtures. That gap is why a
    flagged row is dropped one tier before it is labelled.` : ""}</p>
    <p>${R && R.overall ? `Across every graded fixture so far, the model almost never picks a
    draw: <em>${R.overall.picks.d}</em> draw picks against <em>${R.overall.actuals.d}</em> matches
    that actually finished level. Those <em>${R.overall.drawnOut}</em> drawn-out fixtures are the
    single largest category of miss, and no amount of confidence in a favourite protects you
    from one.` : ""}</p></div>`;

  $("#dayseg").addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    resState.day = b.dataset.day;
    renderResults();
    host.scrollIntoView({block:"start", behavior:"auto"});
  });
}

/* ---------- view switching ---------- */
$("#views").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const v = b.dataset.view;
  $("#views").querySelectorAll("button").forEach(x=>
    x.setAttribute("aria-pressed", x.dataset.view===v));
  const fixtures = v === "fixtures";
  $("#controls").hidden = !fixtures;
  $("#days").hidden = !fixtures;
  $("#note").hidden = !fixtures;
  readbarEl.hidden = !fixtures;
  $("#results").hidden = fixtures;
  window.scrollTo({top:0});
});

$("#footer").innerHTML = `
  Probabilities come from a Dixon-Coles adjusted Poisson model over attack and defence ratings.
  Backtested across ${'5,281'} matches in 2025/26: <b>49.5%</b> of top picks correct against a
  43.7% always-back-the-home-side baseline. The most confident tenth of fixtures landed 75.0% of the time.
  Rows marked <span class="cl">CL</span> fall under Celtic's Law: a side has changed division,
  has no rating, is missing players, or carries a manual override, so the model is working blind. Flagged before
  kick-off, never after. Fixtures and results from
  <a href="https://github.com/openfootball">openfootball</a>, public domain.
  ${D.missing.length ? `<br><br>No current-season fixture list published yet for: ${D.missing.map(m=>m.split(" ")[0]).join(", ")}.` : ""}
  <br><br>This is a model, not a tip sheet. It is worse than the betting market, which is what a
  properly priced market is for.`;

render();
renderResults();
})();
</script>
</body>
</html>
