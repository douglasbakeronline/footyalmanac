<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Slate — fixture probabilities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14181d;
  --ink-2:#3d464f;
  --mute:#77828c;
  --hair:#cfd6d2;
  --hair-soft:#e0e5e1;
  --ground:#e9ece9;
  --surface:#ffffff;
  --home:#12615b;
  --home-soft:#d3e3e0;
  --draw:#a8813a;
  --draw-soft:#ece0cb;
  --away:#8b2f45;
  --away-soft:#eed7dc;

  --sp:4px;
  --rail:6px;

  --f-display:'Archivo',system-ui,sans-serif;
  --f-ui:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--f-ui);
  font-size:15px;
  line-height:1.4;
  padding:0 20px 80px;
  font-variant-numeric:tabular-nums;
}
.wrap{max-width:1180px;margin:0 auto}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- masthead ---------- */
header{padding:34px 0 20px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{
  font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5vw,46px);
  letter-spacing:-.045em;line-height:.92;text-transform:uppercase;
}
h1 em{font-style:normal;color:var(--home)}
.tag{
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);font-weight:600;padding-bottom:3px;
}
.meta{
  display:flex;gap:26px;flex-wrap:wrap;margin-top:18px;
  font-size:12.5px;color:var(--ink-2);
}
.meta b{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--ink);display:block}
.meta span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}

/* ---------- honesty strip ---------- */
.note{
  margin-top:18px;padding:12px 15px;border-left:var(--rail) solid var(--draw);
  background:var(--draw-soft);font-size:13.5px;color:#4b3a17;max-width:74ch;
}
.note b{font-weight:700}

/* ---------- controls ---------- */
.controls{
  position:sticky;top:0;z-index:20;background:var(--ground);
  padding:14px 0 12px;border-bottom:1px solid var(--hair);
  display:flex;gap:18px;align-items:center;flex-wrap:wrap;
}
.chips{display:flex;gap:5px;flex-wrap:wrap}
button.chip{
  font-family:var(--f-ui);font-size:12.5px;font-weight:600;letter-spacing:.02em;
  border:1px solid var(--hair);background:transparent;color:var(--ink-2);
  padding:5px 10px;cursor:pointer;border-radius:2px;
  transition:background .12s,color .12s,border-color .12s;
}
button.chip:hover{border-color:var(--ink-2)}
button.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
button.chip:focus-visible{outline:2px solid var(--home);outline-offset:2px}
.seg{display:flex;border:1px solid var(--hair);border-radius:2px;overflow:hidden}
.seg button{
  font-family:var(--f-ui);font-size:12.5px;font-weight:600;border:0;background:transparent;
  padding:5px 11px;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--hair);
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button:focus-visible{outline:2px solid var(--home);outline-offset:-2px}
.ctl-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* ---------- day ---------- */
.day{margin-top:34px}
.day-head{display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.day-head h2{
  font-family:var(--f-display);font-weight:600;font-size:19px;
  letter-spacing:-.02em;text-transform:uppercase;
}
.day-head .count{font-family:var(--f-num);font-size:12px;color:var(--mute);margin-left:auto}

/* ---------- column ruler ---------- */
.ruler{
  display:grid;grid-template-columns:32px 46px 1fr 258px 74px 1fr 56px;
  gap:10px;align-items:center;padding:9px 8px 6px;
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);font-weight:600;
}
.ruler .r-bar{display:flex;justify-content:space-between}

/* ---------- fixture row ---------- */
.row{
  display:grid;grid-template-columns:32px 46px 1fr 258px 74px 1fr 56px;
  gap:10px;align-items:center;
  background:var(--surface);border-bottom:1px solid var(--hair-soft);
  padding:9px 8px;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;
  font-family:var(--f-ui);font-size:15px;color:var(--ink);cursor:pointer;
}
.row:hover{background:#f7f9f7}
.row:focus-visible{outline:2px solid var(--home);outline-offset:-2px}
.row[aria-expanded="true"]{background:#f4f7f5}

.rank{font-family:var(--f-num);font-size:12px;color:var(--mute);font-weight:500}
.rank.top{color:var(--ink);font-weight:600}
.ko{font-family:var(--f-num);font-size:12.5px;color:var(--ink-2)}
.ko small{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);
  font-family:var(--f-ui);font-weight:600;white-space:nowrap;overflow:hidden}

.side{min-width:0}
.side.away{text-align:right}
.club{
  font-weight:600;font-size:16px;letter-spacing:-.005em;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stat{font-family:var(--f-num);font-size:11px;color:var(--mute);margin-top:2px;white-space:nowrap}
.stat i{font-style:normal}
.stat .pos{color:var(--home)}
.stat .neg{color:var(--away)}

/* ---------- the bar: this is the whole point of the page ---------- */
.bar{position:relative;height:26px;display:flex;background:#f0f2f0}
.bar i{display:block;height:100%;position:relative;overflow:hidden}
.bar .h{background:var(--home)}
.bar .d{background:var(--draw)}
.bar .a{background:var(--away)}
.bar b{
  font-family:var(--f-num);font-size:11px;font-weight:600;color:#fff;
  position:absolute;top:50%;transform:translateY(-50%);left:6px;
  letter-spacing:-.03em;
}
.bar .a b{left:auto;right:6px}
.bar .d b{left:50%;transform:translate(-50%,-50%)}
/* shared reference line: any home block reaching past it is odds-on */
.bar::after{
  content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;
  background:var(--ink);opacity:.5;
}
.conf{font-family:var(--f-num);font-size:14px;font-weight:600;text-align:right}
.conf small{display:block;font-size:9.5px;letter-spacing:.06em;color:var(--mute);font-weight:400;text-transform:uppercase}

/* ---------- expanded detail ---------- */
.detail{background:#f4f7f5;border-bottom:1px solid var(--hair);padding:16px 18px 18px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.detail h3{
  font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mute);margin-bottom:8px;
}
table.sheet{border-collapse:collapse;width:100%;font-family:var(--f-num);font-size:12px}
table.sheet th{
  text-align:right;font-weight:500;color:var(--mute);padding:2px 7px 2px 0;
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;
}
table.sheet th:first-child{text-align:left}
table.sheet td{text-align:right;padding:3px 7px 3px 0;border-top:1px solid var(--hair-soft)}
table.sheet td:first-child{text-align:left;font-family:var(--f-ui);font-size:13.5px;font-weight:600}
.why{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--hair);
  font-size:13.5px;color:var(--ink-2);max-width:82ch;
}
.why em{font-style:normal;font-family:var(--f-num);font-size:12.5px;color:var(--ink)}
.flag{
  display:inline-block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;padding:2px 6px;border-radius:2px;margin-right:6px;
}
.flag.carry{background:var(--draw-soft);color:#5f4715}
.flag.live{background:var(--home-soft);color:#0d443f}

.row.unrated{background:#fbfbfa}
.row.unrated .club{color:var(--ink-2)}
.row.unrated .bar{opacity:.42}
.row.unrated .conf{color:var(--mute);font-weight:500}
.stat.none{color:var(--away);opacity:.85}
.flg{
  width:15px;height:10.3px;flex:0 0 auto;border-radius:1px;
  box-shadow:0 0 0 .5px rgba(20,24,29,.28);vertical-align:baseline;
}
.club{display:flex;align-items:center;gap:7px}
.side.away .club{flex-direction:row-reverse}
.club span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xg{font-family:var(--f-num);font-size:12.5px;text-align:center;color:var(--ink-2);white-space:nowrap}
.xg small{display:block;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-family:var(--f-ui);font-weight:600}
.xg b{font-weight:600;color:var(--ink)}
.flag.unrated{background:var(--away-soft);color:#6a1f31}
.flag.manual{background:#dfe3f0;color:#2c3763}
.empty{padding:40px 8px;color:var(--mute);font-size:14px}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--mute);max-width:80ch}
footer a{color:var(--ink-2)}

@media (max-width:860px){
  .ruler{display:none}
  .row{grid-template-columns:28px 1fr 62px;grid-template-areas:
    "rank home conf" "rank bar conf" "rank away conf" "rank xg xg";
    row-gap:5px;padding:11px 8px;}
  .xg{grid-area:xg;text-align:left;font-size:11.5px}
  .xg small{display:inline;margin-left:5px}
  .rank{grid-area:rank;align-self:start}
  .ko{display:none}
  .side{grid-area:home}
  .side.away{grid-area:away;text-align:left}
  .bar{grid-area:bar;margin:2px 0}
  .side.away .club{flex-direction:row}
  .conf{grid-area:conf;align-self:start}
  .detail-grid{grid-template-columns:1fr;gap:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

h":0.3499,"d":0.2897,"a":0.3604},"xg":[1.25,1.28],"score":[1,1],"confidence":0.3604,"evidence":"current","unrated":false,"rank":45}]}],"model":{"blendK":12.0,"formCap":0.05,"rho":-0.06,"temperature":1.15,"homeMult":{"1":1.155,"2":1.17,"3":1.18,"4":1.185},"awayMult":{"1":0.87,"2":0.862,"3":0.855,"4":0.85}}};</script>
<script>
(function(){
"use strict";
const D = window.__FIXTURE_DATA__;
if(!D || !D.days){
  document.body.innerHTML = '<div class="wrap" style="padding:60px 0;max-width:60ch">'
    + '<h1 style="font-family:var(--f-display);font-size:28px;letter-spacing:-.03em">No fixture data loaded</h1>'
    + '<p style="margin-top:14px;font-size:15px;line-height:1.55">This page expects <code>data.js</code> '
    + 'to sit next to it. Either open <b>dashboard.html</b> instead, which has the data built in, '
    + 'or run <code>python3 build.py</code> and serve the folder:</p>'
    + '<pre style="margin-top:14px;font-family:var(--f-num);font-size:13px;background:#fff;padding:12px;'
    + 'border-left:6px solid var(--draw)">python3 build.py --days 4 --top 50\npython3 -m http.server 8000</pre></div>';
  return;
}
const $ = s => document.querySelector(s);
const pct = x => Math.round(x*100);
const state = { leagues:new Set(), sort:"conf", open:null };

/* ---------- header ---------- */
const fmtDay = iso => new Date(iso+"T12:00:00").toLocaleDateString("en-GB",
  {weekday:"long", day:"numeric", month:"long"});
const fmtShort = iso => new Date(iso+"T12:00:00").toLocaleDateString("en-GB",
  {day:"numeric", month:"short"});

$("#window").textContent = fmtShort(D.window.from)+" – "+fmtShort(D.window.to)+" · "+D.season;

const total = D.days.reduce((a,d)=>a+d.count,0);
const live  = D.days.reduce((a,d)=>a+d.games.filter(g=>g.evidence!=="carryover").length,0);
$("#meta").innerHTML = [
  ["Fixtures priced", total],
  ["Competitions", new Set(D.days.flatMap(d=>d.games.map(g=>g.league))).size],
  ["Built from current-season results", live+" of "+total],
  ["Data pulled", new Date(D.generated).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})],
].map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join("");

$("#note").innerHTML = live===0
  ? `<b>Nothing has been played yet.</b> Every number on this page comes from last season's completed results, carried across divisions for promoted and relegated sides. It knows nothing about this summer's transfers or managerial changes. Confidence is deliberately flattened until real results arrive.`
  : `<b>${live} of ${total}</b> fixtures have some current-season evidence behind them. The rest are priced from last season alone.`;

/* ---------- league chips ---------- */
const present = [...new Set(D.days.flatMap(d=>d.games.map(g=>g.league)))]
  .sort((a,b)=>D.leagues.find(l=>l.code===a).order - D.leagues.find(l=>l.code===b).order);
const lname = c => D.leagues.find(l=>l.code===c);

const chips = $("#chips");
chips.innerHTML = `<button class="chip" data-league="*" aria-pressed="true">All</button>` +
  present.map(c=>{
    const L = lname(c);
    return `<button class="chip" data-league="${c}" aria-pressed="false">${L.country} ${L.name}</button>`;
  }).join("");

chips.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const c = b.dataset.league;
  if(c==="*"){ state.leagues.clear(); }
  else { state.leagues.has(c) ? state.leagues.delete(c) : state.leagues.add(c); }
  chips.querySelectorAll("button").forEach(x=>{
    const k = x.dataset.league;
    x.setAttribute("aria-pressed", k==="*" ? state.leagues.size===0 : state.leagues.has(k));
  });
  render();
});

$("#sort").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  state.sort = b.dataset.sort;
  $("#sort").querySelectorAll("button").forEach(x=>
    x.setAttribute("aria-pressed", x.dataset.sort===state.sort));
  render();
});

/* ---------- row rendering ---------- */
const rank = {
  conf:  (a,b)=> b.confidence - a.confidence,
  upset: (a,b)=> b.p.a - a.p.a,
  goals: (a,b)=> (b.xg[0]+b.xg[1]) - (a.xg[0]+a.xg[1]),
  time:  (a,b)=> (a.time||"99:99").localeCompare(b.time||"99:99") || b.confidence-a.confidence,
};
// Unrated fixtures always sink, whatever the ordering: a placeholder number
// should never sit at the top of the slate pretending to be a read.
const sortFns = Object.fromEntries(Object.entries(rank).map(([k,f])=>
  [k,(a,b)=> (a.unrated-b.unrated) || f(a,b)]));

function flag(iso, country){
  if(!iso) return "";
  return `<svg class="flg" role="img" aria-label="${country}"><use href="#f-${iso}"/></svg>`;
}

function sideStats(t){
  const s = t.now && t.now.P ? t.now : t.last;
  if(!s) return `<div class="stat none">not rated — no season on file</div>`;
  const gd = s.GD>0 ? `<i class="pos">+${s.GD}</i>` : (s.GD<0?`<i class="neg">${s.GD}</i>`:`<i>0</i>`);
  const f = t.form ? ` · ${t.form.seq}` : "";
  return `<div class="stat">${s.PPG.toFixed(2)} ppg · ${s.W}-${s.D}-${s.L} · ${gd}${f}</div>`;
}

function bar(g){
  const h=pct(g.p.h), d=pct(g.p.d), a=100-h-d;
  const lbl=(v,min)=> v>=min ? `<b>${v}</b>` : "";
  return `<div class="bar" role="img" aria-label="Home win ${h} per cent, draw ${d} per cent, away win ${a} per cent">
    <i class="h" style="width:${h}%">${lbl(h,13)}</i>
    <i class="d" style="width:${d}%">${lbl(d,13)}</i>
    <i class="a" style="width:${a}%">${lbl(a,13)}</i>
  </div>`;
}

function teamSheet(t, label){
  const rows = [];
  if(t.last) rows.push(["2025/26", t.last]);
  if(t.now && t.now.P) rows.unshift(["This season", t.now]);
  const body = rows.map(([k,s])=>`<tr>
      <td>${k}</td><td>${s.P}</td><td>${s.W}</td><td>${s.D}</td><td>${s.L}</td>
      <td>${s.GF}</td><td>${s.GA}</td><td>${s.GD>0?"+":""}${s.GD}</td>
      <td>${s.Pts}</td><td>${s.PPG.toFixed(2)}</td></tr>`).join("");
  const flags = [
    t.unrated ? `<span class="flag unrated">not rated</span>` : "",
    t.adj ? `<span class="flag manual">manual override</span>` : "",
    t.carriedFrom ? `<span class="flag carry">carried from ${lname(t.carriedFrom).name}</span>` : "",
    (t.now && t.now.P) ? `<span class="flag live">${t.now.P} played</span>` : "",
  ].join("");
  return `<div>
    <h3>${label} — ${t.name}</h3>
    ${flags}
    <table class="sheet">
      <tr><th>Record</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>PPG</th></tr>
      ${body || `<tr><td colspan="10">No completed matches on record.</td></tr>`}
    </table>
    <div class="stat" style="margin-top:8px">
      attack ${t.att.toFixed(2)} · defence ${t.def.toFixed(2)}
      ${t.form ? " · last "+(t.form.max/3)+": "+t.form.pts+" pts ("+t.form.seq+")" : " · form: not yet available"}
    </div>
    ${t.adj ? `<div class="stat" style="margin-top:6px;color:#2c3763">
        hand-adjusted: attack x${t.adj.att.toFixed(2)}, defence x${t.adj.def.toFixed(2)}${t.adj.why?" — "+t.adj.why:""}
      </div>` : ""}
  </div>`;
}

function detail(g){
  const edge = g.p.h>g.p.a ? g.home : g.away;
  const dir  = g.p.h>g.p.a ? "home" : "away";
  const missing = [g.home,g.away].filter(t=>t.unrated).map(t=>t.name);

  const why = missing.length
    ? `<b>This fixture is not really priced.</b> ${missing.join(" and ")}
       ${missing.length>1?"have":"has"} no season on file — almost certainly promoted from a
       division this build does not yet cover — so the model substitutes a league-average rating
       and the split below is close to what you would get from knowing nothing at all.
       Treat the ${pct(g.confidence)}% as a placeholder, not a read.`
    : `Model expects <em>${g.xg[0].toFixed(2)} – ${g.xg[1].toFixed(2)}</em> goals,
       likeliest scoreline <em>${g.score[0]}–${g.score[1]}</em>.
       The ${dir} edge comes from ${edge.name}'s attack rating of
       <em>${edge.att.toFixed(2)}</em> against a defence rating of
       <em>${(dir==="home"?g.away.def:g.home.def).toFixed(2)}</em>, before a home-ground
       adjustment worth about a third of a goal.
       ${g.evidence==="carryover"
         ? " Nothing has been played this season, so this rests entirely on 2025/26 and takes no account of summer transfers."
         : ""}`;

  return `<div class="detail">
    <div class="detail-grid">
      ${teamSheet(g.home,"Home")}
      ${teamSheet(g.away,"Away")}
    </div>
    <div class="why">${why}</div>
  </div>`;
}

function render(){
  const host = $("#days");
  host.innerHTML = "";
  let shown = 0;

  D.days.forEach(day=>{
    let games = day.games.filter(g=> state.leagues.size===0 || state.leagues.has(g.league));
    if(!games.length) return;
    games = games.slice().sort(sortFns[state.sort]);
    shown += games.length;

    const sec = document.createElement("section");
    sec.className = "day";
    sec.innerHTML = `
      <div class="day-head">
        <h2>${fmtDay(day.date)}</h2>
        <div class="count">${games.length} fixture${games.length===1?"":"s"}</div>
      </div>
      <div class="ruler">
        <div>#</div><div>K/O</div><div>Home</div>
        <div class="r-bar"><span>Home win</span><span>Draw</span><span>Away win</span></div>
        <div style="text-align:center">xG</div>
        <div style="text-align:right">Away</div><div style="text-align:right">Conf.</div>
      </div>`;

    games.forEach((g,i)=>{
      const id = day.date+"|"+g.home.name+"|"+g.away.name;
      const btn = document.createElement("button");
      btn.className = "row" + (g.unrated ? " unrated" : "");
      btn.setAttribute("aria-expanded", state.open===id ? "true":"false");
      btn.innerHTML = `
        <div class="rank ${i<3?"top":""}">${String(i+1).padStart(2,"0")}</div>
        <div class="ko">${g.time||"TBC"}<small>${g.short}</small></div>
        <div class="side"><div class="club">${flag(g.iso,g.country)}<span>${g.home.name}</span></div>${sideStats(g.home)}</div>
        ${bar(g)}
        <div class="xg"><b>${g.xg[0].toFixed(2)}</b> – <b>${g.xg[1].toFixed(2)}</b></div>
        <div class="side away"><div class="club">${flag(g.iso,g.country)}<span>${g.away.name}</span></div>${sideStats(g.away)}</div>
        <div class="conf">${pct(g.confidence)}<small>${g.p.h>=g.p.a && g.p.h>=g.p.d?"home":(g.p.a>=g.p.d?"away":"draw")}</small></div>`;
      btn.addEventListener("click", ()=>{ state.open = state.open===id ? null : id; render(); });
      sec.appendChild(btn);
      if(state.open===id){
        const dv = document.createElement("div");
        dv.innerHTML = detail(g);
        sec.appendChild(dv.firstElementChild);
      }
    });
    host.appendChild(sec);
  });

  if(!shown) host.innerHTML = `<div class="empty">No fixtures match that filter. Clear a competition to see more.</div>`;
}

$("#footer").innerHTML = `
  Probabilities come from a Dixon-Coles adjusted Poisson model over attack and defence ratings.
  Backtested across ${'4,605'} matches in 2025/26: <b>49.3%</b> of top picks correct against a
  43.3% always-back-the-home-side baseline. The most confident tenth of fixtures landed 73.5% of the time.
  Fixtures and results from <a href="https://github.com/openfootball">openfootball</a>, public domain.
  ${D.missing.length ? `<br><br>No current-season fixture list published yet for: ${D.missing.map(m=>m.split(" ")[0]).join(", ")}.` : ""}
  <br><br>This is a model, not a tip sheet. It is worse than the betting market, which is what a
  properly priced market is for.`;

render();
})();
</script>
</body>
</html>
